    - generic [ref=f696e71]:
      - generic [ref=f696e72]:
        - text: Top Natural Attractions & Coastal Parks
        - heading "Top Natural Attractions & Coastal Parks" [level=2] [ref=f696e73]
        - paragraph [ref=f696e74]: 10 places, written up one at a time
      - generic [ref=f696e75]:
        - article [ref=f696e76]:
          - figure [ref=f696e77]:
            - img "Sooke Potholes Provincial Park, Sooke" [ref=f696e78]
          - generic [ref=f696e79]:
            - heading "Sooke Potholes Provincial Park" [level=3] [ref=f696e80]
            - paragraph [ref=f696e81]: Sooke Potholes Provincial Park is a 7.3-hectare natural area on the banks of the Sooke River, famous for its unique geological formations. These potholes, deep, smooth rock pools, were carved out of volcanic rock by boulders trapped in swirling river currents over thousands of years. While the provincial park itself is smaller and less developed than the adjacent regional park, it serves as the essential southern entry point to this iconic river system.
            - paragraph [ref=f696e82]: "Natural Swimming Holes: The park is a premier destination for freshwater swimming. The crystal-clear emerald pools range from shallow gravel beds perfect for wading to deep basins popular with confident swimmers seeking a refreshingly cold dip."
            - paragraph [ref=f696e83]: "The Riverside Trail: A well-maintained path follows the edge of the canyon, offering multiple viewpoints of the river's dramatic rock formations and cascading waterfalls. It connects directly to the larger trail network of the neighboring regional park."
            - paragraph [ref=f696e84]: Good to know. the smaller Sooke Potholes Provincial Park at the southern end and the larger Sooke Potholes Regional Park to the north. Most of the famous viewpoints and the campground are located within the Regional Park section.
        - article [ref=f696e85]:
          - figure [ref=f696e86]:
            - img "East Sooke Regional Park, Sooke" [ref=f696e87]
          - generic [ref=f696e88]:
            - heading "East Sooke Regional Park" [level=3] [ref=f696e89]
            - paragraph [ref=f696e90]: East Sooke Regional Park is often described as a miniature West Coast Trail, offering over 50 kilometers of trails through 1,400 hectares of rugged coastal wilderness. It is the premier destination on the southern tip of Vancouver Island for those seeking a true wilderness experience without leaving the Greater Victoria area.
            - paragraph [ref=f696e91]: "The Coast Trail: This challenging 10-kilometer route is the park's signature hike. It follows the jagged shoreline of the Juan de Fuca Strait, requiring some scrambling over rocky bluffs but rewarding hikers with panoramic views of the Olympic Mountains and the occasional sighting of whales or sea lions."
            - paragraph [ref=f696e92]: "Aylard Farm: This is the most accessible part of the park, featuring a large open meadow and a sandy pocket beach. It is a popular spot for families, picnicking, and shorter walks to the nearby Ceepeecee Lookout."
        - article [ref=f696e93]:
          - figure [ref=f696e94]:
            - img "Whiffin Spit, Sooke" [ref=f696e95]
          - generic [ref=f696e96]:
            - heading "Whiffin Spit" [level=3] [ref=f696e97]
            - paragraph [ref=f696e98]: Whiffin Spit is a naturally formed gravel bar that stretches for about 1.5 kilometers into Sooke Harbour, acting as a scenic breakwater between the calm inner basin and the rugged Juan de Fuca Strait. It is a favorite for those seeking a quick, low-impact coastal walk with some of the best mountain and water views in Sooke.
            - paragraph [ref=f696e99]: "Coastal Stroll: The main trail is a flat, 2.7-kilometer out-and-back gravel path. It provides a unique experience of walking through the middle of the ocean, with the Olympic Mountains of Washington State looming directly ahead."
            - paragraph [ref=f696e100]: "Wildlife and Birdwatching: Over 220 species of birds have been recorded here. On the seaward side, you can often spot Harlequin Ducks and Pacific Loons, while the calmer harbour side attracts Great Blue Herons and Black Oystercatchers. Keep an eye out for harbour seals, sea lions, and even orcas near the mouth of the harbour."
        - article [ref=f696e101]:
          - figure [ref=f696e102]:
            - img "Sheringham Point Lighthouse, Sooke" [ref=f696e103]
          - generic [ref=f696e104]:
            - heading "Sheringham Point Lighthouse" [level=3] [ref=f696e105]
            - paragraph [ref=f696e106]: Sheringham Point Lighthouse is a designated National Heritage site perched on the rocky coastline of Shirley, approximately 20 minutes west of Sooke. Built in 1912 following the tragic wreck of the SS Valencia, the white hexagonal tower remains an iconic symbol of maritime history and is one of the few lighthouses on Vancouver Island accessible by land.
            - paragraph [ref=f696e107]: "Jennie’s Trail & Viewpoints: A short, relatively easy walking trail leads from the parking lot to the lighthouse gate. From there, you can explore several spur trails that lead to specialized viewing platforms, offering unobstructed vistas of the Juan de Fuca Strait and the Olympic Mountains."
            - paragraph [ref=f696e108]: "Whale Watching: The point is a premier shore-based whale-watching spot. The preservation society has installed a speaker on the side of the engine room connected to underwater hydrophones, allowing you to listen for the vocalizations of passing orcas and humpbacks."
        - article [ref=f696e109]:
          - figure [ref=f696e110]:
            - img "French Beach Provincial Park, Sooke" [ref=f696e111]
          - generic [ref=f696e112]:
            - heading "French Beach Provincial Park" [level=3] [ref=f696e113]
            - paragraph [ref=f696e114]: French Beach Provincial Park is a 59-hectare coastal destination situated along the Juan de Fuca Strait, approximately 20 kilometers west of Sooke. It is widely recognized for its long, pebble-and-sand beach and its accessibility, making it one of the most popular family destinations on the southwestern coast of Vancouver Island.
            - paragraph [ref=f696e115]: "Shoreline Exploration: The park features a 1,600-meter beach that is ideal for beachcombing and walking. It offers expansive views across the strait to the Olympic Mountains in Washington State."
            - paragraph [ref=f696e116]: "Wildlife Viewing: The area is a prime location for spotting marine life. Gray whales can often be seen migrating past the beach in the spring, while killer whales, sea lions, and seals are frequent visitors throughout the year. Bald eagles and ospreys are also common sights in the tall trees bordering the shore."
        - article [ref=f696e117]:
          - figure [ref=f696e118]:
            - img "China Beach, Sooke" [ref=f696e119]
          - generic [ref=f696e120]:
            - heading "China Beach" [level=3] [ref=f696e121]
            - paragraph [ref=f696e122]: China Beach is a stunning coastal destination within the Juan de Fuca Provincial Park, located roughly 35 kilometers west of Sooke. It serves as one of the major trailheads for the Juan de Fuca Marine Trail and is highly regarded for its expansive fine-sand shoreline and dramatic ocean vistas.
            - paragraph [ref=f696e123]: "Shoreline and Waterfall: The beach itself is a wide stretch of sand, perfect for long walks. A highlight is the small waterfall that cascades down the sandstone cliffs directly onto the beach, particularly active after a rainfall."
            - paragraph [ref=f696e124]: "Juan de Fuca Marine Trail: This area serves as the eastern terminus for the 47-kilometer Juan de Fuca Marine Trail. Hikers can explore the first few kilometers of this rugged backcountry trail to get a taste of the wilderness without committing to the full multi-day trek."
        - article [ref=f696e125]:
          - figure [ref=f696e126]:
            - img "Race Rocks Ecological Reserve, Sooke" [ref=f696e127]
          - generic [ref=f696e128]:
            - heading "Race Rocks Ecological Reserve" [level=3] [ref=f696e129]
            - paragraph [ref=f696e130]: Race Rocks Ecological Reserve is a unique marine sanctuary located at the eastern entrance of the Juan de Fuca Strait. Known for its high-current environment, it serves as a critical habitat for a diverse range of marine life and is home to one of the oldest lighthouses on the Pacific Coast.
            - paragraph [ref=f696e131]: "Marine Mammal Observation: This is a premier spot for viewing California and Steller sea lions, which haul out on the rocks in massive numbers. You can also frequently spot harbour seals and northern elephant seals, alongside passing orcas and humpback whales."
            - paragraph [ref=f696e132]: "Birdwatching: The islands are a vital nesting and stopover site for numerous seabirds. Look for Black Oystercatchers, Pigeon Guillemots, and various species of gulls and cormorants."
        - article [ref=f696e133]:
          - figure [ref=f696e134]:
            - img "Matheson Lake Regional Park, Sooke" [ref=f696e135]
          - generic [ref=f696e136]:
            - heading "Matheson Lake Regional Park" [level=3] [ref=f696e137]
            - paragraph [ref=f696e138]: Matheson Lake Regional Park is a scenic 156-hectare park located in Metchosin, known for its tranquil freshwater lake nestled within a steep-sided forest. It is a popular destination for those seeking a peaceful alternative to the oceanfront, offering a mix of accessible recreation and rugged hiking.
            - paragraph [ref=f696e139]: "The Lakeside Loop: A 3.8-kilometer trail circles the entire lake. While the eastern side is relatively flat and wide, the western portion becomes more rugged, involving some scrambling over rocky outcrops and roots, providing a varied hiking experience."
            - paragraph [ref=f696e140]: "Swimming and Paddling: The lake's calm, freshwater surface is ideal for swimming during the summer months. It is also a favored spot for launching kayaks, canoes, or paddleboards to explore the small islands and hidden coves along the shoreline."
        - article [ref=f696e141]:
          - heading "Roche Cove Regional Park" [level=3] [ref=f696e142]
          - generic [ref=f696e143]:
            - paragraph [ref=f696e144]: Roche Cove Regional Park is a serene 163-hectare destination that borders the Sooke Basin and the District of Metchosin. Named after Richard Roche, a 3rd Lieutenant on the HMS Satellite, the park is known for its secluded cove, lush temperate rainforest, and convenient connection to the Galloping Goose Regional Trail.
            - paragraph [ref=f696e145]: "The Secluded Cove: A short, easy walk from the parking area leads to the protected waters of Roche Cove. At low tide, the sandy shoreline reveals little-neck clams and barnacles, while high tide is ideal for observing sea stars and migrating waterfowl like buffleheads and mergansers."
            - paragraph [ref=f696e146]: "Cedar Grove Trail: This moderate, 2.5-hour loop offers an invigorating climb through old-growth forests. A highlight of the trail is a massive fallen cedar estimated to be over 500 years old, alongside viewpoints that overlook the park and Sooke Basin."
        - article [ref=f696e147]:
          - figure [ref=f696e148]:
            - img "Jordan River Regional Park, Sooke" [ref=f696e149]
          - generic [ref=f696e150]:
            - heading "Jordan River Regional Park" [level=3] [ref=f696e151]
            - paragraph [ref=f696e152]: Jordan River Regional Park and Campground is a diverse 187-hectare coastal park situated about 37 kilometers west of Sooke. It is a significant hub for outdoor recreation along the Juan de Fuca Highway, offering everything from premier cold-water surfing to quiet forested campsites and unique geological formations.
            - paragraph [ref=f696e153]: "Surfing and Storm Watching: The park is centered around the mouth of the Jordan River, a location world-renowned for its surfing. During the winter months, large swells draw experienced surfers to the point, while the cobble beach serves as an excellent vantage point for watching powerful Pacific storms."
            - paragraph [ref=f696e154]: "Sandcut Beach Access: A separate section of the park leads to Sandcut Beach, famous for its twin waterfalls that drop from a sandstone ledge directly onto the beach cobbles."
    - generic [ref=f696e156]:
      - generic [ref=f696e157]:
        - text: Hiking, Walking & Trail Adventures
        - heading "Hiking, Walking & Trail Adventures" [level=2] [ref=f696e158]
        - paragraph [ref=f696e159]: 5 places, written up one at a time
      - generic [ref=f696e160]:
        - article [ref=f696e161]:
          - figure [ref=f696e162]:
            - img "Galloping Goose Regional Trail, Sooke" [ref=f696e163]
          - generic [ref=f696e164]:
            - heading "Galloping Goose Regional Trail" [level=3] [ref=f696e165]
            - paragraph [ref=f696e166]: The Galloping Goose Regional Trail is a picturesque 55-kilometer multi-use path that follows a decommissioned railway line from downtown Victoria to the ghost town of Leechtown. Named after the noisy rail-car that traveled the line in the 1920s, it serves as a critical artery for both commuters and recreational users, transitioning from urban pavement to rugged wilderness.
            - paragraph [ref=f696e167]: "The Selkirk Trestle: Located near the Victoria end, this massive wooden trestle offers spectacular views across the Upper Harbour and Gorge Waterway. It is a popular spot for watching rowing teams and sunsets over the water."
            - paragraph [ref=f696e168]: "Sooke Basin Views: As the trail winds through Roche Cove Regional Park and toward Sooke, it hugs the shoreline of the basin, providing quiet vistas of the saltwater and frequent sightings of bald eagles."
        - article [ref=f696e169]:
          - figure [ref=f696e170]:
            - img "Juan de Fuca Marine Trail, Sooke" [ref=f696e171]
          - generic [ref=f696e172]:
            - heading "Juan de Fuca Marine Trail" [level=3] [ref=f696e173]
            - paragraph [ref=f696e174]: The Juan de Fuca Marine Trail is a rugged 47-kilometer wilderness trek stretching along the southwestern coast of Vancouver Island. Often compared to its more famous neighbor, the West Coast Trail, it offers a similar landscape of mist-shrouded rainforests, suspension bridges, and dramatic shoreline vistas without requiring a formal reservation system.
            - paragraph [ref=f696e175]: "Signature Beaches: The trail connects several iconic coastal spots, including Mystic Beach, known for its rope swing and cliffside waterfall, and Sombrio Beach, which features a hidden waterfall tucked inside a narrow emerald canyon."
            - paragraph [ref=f696e176]: "Suspension Bridges: Hikers cross several deep gorges via impressive suspension bridges, such as the one at Loss Creek and Pete Wolfe Creek. These offer a bird's-eye view of the rushing water and lush fern gullies below."
        - article [ref=f696e177]:
          - heading "Kludahk Forest Recreation Trails" [level=3] [ref=f696e178]
          - generic [ref=f696e179]:
            - paragraph [ref=f696e180]: The Kludahk Trail is a hidden gem of the South Island, running approximately 40 kilometers along the San Juan Ridge between Jordan River and Port Renfrew. Often referred to as Canada’s most southerly alpine route, it offers a dramatic contrast to the coastal Juan de Fuca Trail by providing semi-alpine geography, subalpine bogs, and meadow landscapes at elevations around 1,000 meters.
            - paragraph [ref=f696e181]: "The Huts of Kludahk: The trail is famous for its series of community-maintained huts (such as Meadow Cabin and Tower Cabin). While these are managed by the Kludahk Outdoors Club (KOC) for member use and bookings, they serve as iconic landmarks for day hikers and provide emergency shelter."
            - paragraph [ref=f696e182]: "Flora and Fauna: The ridge is characterized by vibrant subalpine meadows and unique bogs that turn deep rust and red in the autumn. It is a prime location for spotting wildflowers in early summer and wildlife like elk, black bears, and various raptors."
        - article [ref=f696e183]:
          - heading "Shields Lake Loop" [level=3] [ref=f696e184]
          - generic [ref=f696e185]:
            - paragraph [ref=f696e186]: The Shields Lake Loop is a rugged, backcountry hiking route located within the Sea to Sea Regional Park and the adjacent Sooke Mountain Provincial Park. Unlike the coastal walks in Sooke, this trail takes you deep into the Sooke Hills, offering a wilderness experience characterized by steep climbs, rocky ridges, and quiet upland lakes.
            - paragraph [ref=f696e187]: "Shields Lake: This pristine, high-elevation lake is the centerpiece of the hike. It is a popular spot for a mid-hike break or a refreshing swim in the summer. The lake is also stocked with Rainbow Trout, making it a destination for backcountry anglers."
            - paragraph [ref=f696e188]: "Empress Mountain Summit: Many hikers combine the Shields Lake Loop with a trek to the summit of Empress Mountain, the highest point in the Sooke Hills. From the top, you are rewarded with 360-degree views of the Sooke Basin, Victoria, and the distant Olympic Mountains."
        - article [ref=f696e189]:
          - figure [ref=f696e190]:
            - img "Sooke Mountain Provincial Park, Sooke" [ref=f696e191]
          - generic [ref=f696e192]:
            - heading "Sooke Mountain Provincial Park" [level=3] [ref=f696e193]
            - paragraph [ref=f696e194]: Sooke Mountain Provincial Park is a 450-hectare wilderness area located in the Sooke Hills, approximately 8 kilometers north of the Sooke townsite. Unlike more developed parks in the region, this park remains largely primitive and unmaintained, offering a challenging experience for those looking to escape the more crowded coastal trails.
            - paragraph [ref=f696e195]: "Rugged Terrain: The park is characterized by steep, forested hills and rocky outcroppings. The trails are often old logging roads or overgrown paths that require a high degree of navigational skill to follow, as there is very little signage."
            - paragraph [ref=f696e196]: "Upland Lakes: Several small, pristine lakes are found within or near the park boundaries, including Shields Lake and Grass Lake. These are popular destinations for hikers and backcountry anglers seeking a quiet spot for rainbow trout fishing."
    - generic [ref=f696e198]:
      - generic [ref=f696e199]:
        - text: Wildlife, Marine & Water Experiences
        - heading "Wildlife, Marine & Water Experiences" [level=2] [ref=f696e200]
        - paragraph [ref=f696e201]: 4 places, written up one at a time
      - generic [ref=f696e202]:
        - article [ref=f696e203]:
          - figure [ref=f696e204]:
            - img "Whale watching and wildlife tours, Sooke" [ref=f696e205]
          - generic [ref=f696e206]:
            - heading "Whale watching and wildlife tours" [level=3] [ref=f696e207]
            - paragraph [ref=f696e208]: Whale watching and wildlife tours in Sooke provide an intimate alternative to the larger hubs in Victoria. Because Sooke sits directly on the Strait of Juan de Fuca, tour vessels reach the primary feeding grounds and migration corridors much faster, often spending more time with the wildlife and less time in transit.
            - paragraph [ref=f696e209]: Sooke Whale Watching / Sooke Coastal Explorations is a family-owned operation that offers a personalized experience with a focus on local marine ecology.
            - paragraph [ref=f696e210]: "The Experience: They utilize open-air vessels to provide 360-degree unobstructed views, which are ideal for photography and feeling the spray of the ocean."
        - article [ref=f696e211]:
          - figure [ref=f696e212]:
            - img "Charter Fishing, Sooke" [ref=f696e213]
          - generic [ref=f696e214]:
            - heading "Charter Fishing" [level=3] [ref=f696e215]
            - paragraph [ref=f696e216]: Sooke is a major hub for world-class saltwater angling, providing direct access to the productive waters of the Juan de Fuca Strait. Because the coastline here is less congested than other regional ports, charter guests often enjoy more time with lines in the water and a high success rate for iconic Pacific species.
            - paragraph [ref=f696e217]: Goin Coastal Fishing Charters is a well-regarded operator based in the heart of Sooke that focuses on providing a professional and personalized experience for both novice and experienced anglers.
            - paragraph [ref=f696e218]: "Target Species: Their excursions primarily target Chinook and Coho salmon, as well as oversized halibut and various species of rockfish."
        - article [ref=f696e219]:
          - figure [ref=f696e220]:
            - img "Kayaking and Paddling, Sooke" [ref=f696e221]
          - generic [ref=f696e222]:
            - heading "Kayaking and Paddling" [level=3] [ref=f696e223]
            - paragraph [ref=f696e224]: Sooke offers some of the most diverse paddling terrain on Vancouver Island, ranging from the glassy, protected waters of the Sooke Basin to the rugged, surge-filled coastlines near East Sooke and Jordan River.
            - paragraph [ref=f696e225]: "Sooke Basin: This is the most sheltered area, characterized by calm waters and minimal current. It is ideal for beginners, families, and those looking for a meditative sunset or full-moon paddle. You can explore hidden coves, small islands, and even see the remains of historical ships in Cooper's Cove."
            - paragraph [ref=f696e226]: "Sooke Harbour: Connecting the basin to the open ocean, the harbour offers a bit more movement. A classic route involves paddling out to Whiffin Spit for a beach picnic. Be mindful of the tidal currents at the narrow mouth of the harbour, which can be surprisingly strong."
        - article [ref=f696e227]:
          - figure [ref=f696e228]:
            - img "Bear Creek and Diversion Reservoirs, Sooke" [ref=f696e229]
          - generic [ref=f696e230]:
            - heading "Bear Creek and Diversion Reservoirs" [level=3] [ref=f696e231]
            - paragraph [ref=f696e232]: Bear Creek Reservoir and Diversion Reservoir are significant upland water bodies located in the rugged backcountry hills northwest of Sooke. Part of the Jordan River hydroelectric system and regional water lands, these reservoirs offer a true wilderness experience for those prepared to navigate the challenging forest service roads and high-elevation terrain.
            - paragraph [ref=f696e233]: "Bear Creek Reservoir: This high-elevation reservoir is impounded by the Bear Creek Dam. Unlike some active hydro sites, it is not primarily used for power generation and often functions like a natural alpine lake. The surrounding landscape is characterized by dense subalpine forest and rocky bluffs."
            - paragraph [ref=f696e234]: "Diversion Reservoir: Situated further west, this is the primary storage reservoir for the Jordan River hydroelectric system. It features a dramatic concrete dam and serves as a major piece of infrastructure in the region’s power grid."
    - generic [ref=f696e236]:
      - generic [ref=f696e237]:
        - text: Culture, History & Local Character
        - heading "Culture, History & Local Character" [level=2] [ref=f696e238]
        - paragraph [ref=f696e239]: 5 places, written up one at a time
      - generic [ref=f696e240]:
        - article [ref=f696e241]:
          - figure [ref=f696e242]:
            - img "Sooke Harbour and the Waterfront, Sooke" [ref=f696e243]
          - generic [ref=f696e244]:
            - heading "Sooke Harbour and the Waterfront" [level=3] [ref=f696e245]
            - paragraph [ref=f696e246]: Sooke Harbour and its waterfront serve as the heart of the community, where the rich maritime history of the T'Sou-ke Nation meets modern coastal living. The area is defined by a sheltered basin that provides calm waters for paddling and a more active outer harbour that opens into the Strait of Juan de Fuca.
            - paragraph [ref=f696e247]: "The Marine Boardwalk: This accessible wooden walkway connects Ed Macgregor Park to the Rotary Pier. It is a favorite spot for a morning stroll, offering 180-degree views of the harbour where you can watch local seals, herons, and bald eagles."
            - paragraph [ref=f696e248]: "Whiffin Spit: This natural sand and gravel spit stretches over a kilometer into the harbour, acting as a natural breakwater. The flat, out-and-back trail is a local tradition for dog walkers and storm watchers, ending at a small lighthouse with views of the Olympic Mountains."
        - article [ref=f696e249]:
          - heading "Charters River Interpretive Centre and Hatchery" [level=3] [ref=f696e250]
          - generic [ref=f696e251]:
            - paragraph [ref=f696e252]: The Juan De Fuca Salmon Restoration Society operates the Charters River Interpretive Centre, a dedicated education facility located at the junction of the Charters and Sooke Rivers. This center serves as a vital hub for understanding the lifecycle of Pacific salmon and the ongoing conservation efforts required to protect their habitat.
            - paragraph [ref=f696e253]: "Salmon Viewing: The facility features an outdoor riverside viewing platform designed to let visitors observe Coho, Chinook, and Chum salmon as they return to spawn in the clear waters of the Charters River during the autumn months."
            - paragraph [ref=f696e254]: "Educational Exhibits: Inside the interpretive center, you'll find detailed displays on the local watershed, the cultural significance of salmon to the T'Sou-ke Nation, and the technical challenges of stream restoration."
        - article [ref=f696e255]:
          - figure [ref=f696e256]:
            - img "Sooke Region Museum & Visitor Centre, Sooke" [ref=f696e257]
          - generic [ref=f696e258]:
            - heading "Sooke Region Museum & Visitor Centre" [level=3] [ref=f696e259]
            - paragraph [ref=f696e260]: The Sooke Region Museum & Visitor Centre serves as a comprehensive gateway to the history and natural wonders of the South Island. It functions as both a repository for local heritage and a primary resource for travelers heading toward the rugged west coast.
            - paragraph [ref=f696e261]: "The Moss Cottage: A highlight of the museum grounds is this restored 1870s pioneer home. Visitors can tour the interior to see authentic period furnishings and learn about the daily lives of early settlers in the region."
            - paragraph [ref=f696e262]: "Maritime and Industrial History: Extensive outdoor and indoor exhibits detail the local transition from traditional T'Sou-ke fishing practices to the era of large-scale logging and trap fishing. The collection includes a restored lighthouse lens and massive steam donkeys used in early timber operations."
        - article [ref=f696e263]:
          - heading "Sooke Country Market" [level=3] [ref=f696e264]
          - generic [ref=f696e265]:
            - paragraph [ref=f696e266]: The Sooke Country Market is the primary farmers market in Sooke, serving as a seasonal Saturday tradition that highlights the region's agricultural and creative output. Following a period of central location changes, the market has found a permanent home at a historic local farm, providing a true farm-to-table atmosphere.
            - paragraph [ref=f696e267]: "Farm-Fresh Produce: The market is a showcase for the make it, bake it, grow it philosophy. You’ll find a seasonal rotation of local vegetables, honey, eggs, and preserves directly from Sooke-area farms like Silver Cloud or Red Earth."
            - paragraph [ref=f696e268]: "Artisan Crafts: Beyond food, the market features unique handmade goods, including arbutus wood carvings, hand-sewn fabric crafts, and local pottery."
        - article [ref=f696e269]:
          - heading "Sooke Studio Tour" [level=3] [ref=f696e270]
          - generic [ref=f696e271]:
            - paragraph [ref=f696e272]: The art scene in Sooke is vibrant and deeply connected to the local landscape, ranging from world-class exhibitions to intimate backyard workshops. While individual artists often open their doors year-round, the community is best known for its organized annual events that bring hundreds of creatives together.
            - paragraph [ref=f696e273]: "Sooke Fine Arts Show: This is Vancouver Island’s premier juried art show, marking its 40th anniversary in 2026. Running from July 25 to August 3 at the SEAPARC Recreation Centre, it transforms a hockey arena into a world-class gallery featuring over 370 pieces of original West Coast art."
            - paragraph [ref=f696e274]: "Sooke Secret Garden & Artisans Tour: Scheduled for June 6, 7, 2026, this self-guided tour is a major fundraiser for the Sooke Philharmonic Society. It grants access to ten private gardens where visitors can find local musicians performing and in-garden artisans demonstrating their crafts."
    - generic [ref=f696e276]:
      - generic [ref=f696e277]:
        - text: Scenic Stays, Day Trips & Nearby Coastal Stops
        - heading "Scenic Stays, Day Trips & Nearby Coastal Stops" [level=2] [ref=f696e278]
        - paragraph [ref=f696e279]: 2 places, written up one at a time
      - generic [ref=f696e280]:
        - article [ref=f696e281]:
          - figure [ref=f696e282]:
            - img "Point No Point Resort, Sooke" [ref=f696e283]
          - generic [ref=f696e284]:
            - heading "Point No Point Resort" [level=3] [ref=f696e285]
            - paragraph [ref=f696e286]: Point No Point Resort is a historic 40-acre coastal retreat located in Shirley, about 25 kilometers west of Sooke. Established in 1952 by Evelyn Packham, the resort is perched on a rugged bluff overlooking the Juan de Fuca Strait, providing a secluded atmosphere with expansive views of the Olympic Peninsula.
            - paragraph [ref=f696e287]: Accommodations and Amenities
            - paragraph [ref=f696e288]: "Rustic Log Cabins: The resort features 25 private beachfront cabins, ranging from cozy studios to two-bedroom houses. Every cabin is equipped with a full kitchen, a fireplace or wood-burning stove, and a private sundeck with a hot tub."
        - article [ref=f696e289]:
          - figure [ref=f696e290]:
            - img "Scenic drive toward Port Renfrew, Sooke" [ref=f696e291]
          - generic [ref=f696e292]:
            - heading "Scenic drive toward Port Renfrew" [level=3] [ref=f696e293]
            - paragraph [ref=f696e294]: The scenic drive from Sooke to Port Renfrew along Highway 14, also known as the West Coast Road, is a 70-kilometer stretch of winding coastal highway that offers some of the most dramatic ocean views and accessible wilderness on Vancouver Island.
            - paragraph [ref=f696e295]: Key Stops and Scenic Points
            - paragraph [ref=f696e296]: French Beach Provincial Park is an essential first stop, roughly 20 minutes west of Sooke. The 1,600-meter pebble beach provides a wide panorama of the Strait of Juan de Fuca and the Olympic Mountains. This is a prime location for spotting migrating gray whales in the spring and fall, as well as resident orcas, sea lions, and otters year-round. The park features a large picnic area, a playground, and well-maintained trails through second-growth forests of Sitka spruce and cedar.
    - generic [ref=f696e298]:
      - generic [ref=f696e299]:
        - text: Golf & Adventure Activities
        - heading "Golf & Adventure Activities" [level=2] [ref=f696e300]
        - paragraph [ref=f696e301]: 4 places, written up one at a time
      - generic [ref=f696e302]:
        - article [ref=f696e303]:
          - heading "John Phillips Memorial Park" [level=3] [ref=f696e304]
          - generic [ref=f696e305]:
            - paragraph [ref=f696e306]: The John Phillips Memorial Park (frequently referred to by its former life as the John Phillips Memorial Golf Course) is a central green space in Sooke that has transitioned from a traditional golf course into a multi-use community park. Located directly behind the Sooke Municipal Hall, it serves as the town’s Central Park, offering a mix of open meadows, walking trails, and space for major community events.
            - paragraph [ref=f696e307]: For many years, this site operated as a 9-hole executive golf course. While the traditional golf operations have ceased, the landscape still retains the rolling fairways and manicured feel of a course, making it a unique spot for urban exploration. The District of Sooke has officially designated this as a primary parkland. The open spaces that once served as fairways are now used for picnics, kite flying, and leisurely strolls. While not a permanent fixture, the park occasionally hosts pop-up disc golf tournaments and events, taking advantage of the varied terrain and natural obstacles.
            - paragraph [ref=f696e308]: "The Pond: A central feature of the park, the pond is a hub for local birdlife. It is a common spot to see ducks, geese, and occasionally herons. A small picnic table nearby offers a quiet place for a break."
        - article [ref=f696e309]:
          - heading "Nearby Golf Courses" [level=3] [ref=f696e310]
          - generic [ref=f696e311]:
            - paragraph [ref=f696e312]: While the John Phillips Memorial Park has transitioned away from its golfing origins, Sooke is ideally positioned for access to several of British Columbia's premier courses located just a short drive east in Metchosin and Langford.
            - paragraph [ref=f696e313]: Premier Golfing Near Sooke
            - paragraph [ref=f696e314]: Olympic View Golf Club is an award-winning championship course located about 20 minutes from Sooke, known for its dramatic West Coast scenery and year-round playability.
        - article [ref=f696e315]:
          - heading "Zipline at Sooke Hills" [level=3] [ref=f696e316]
          - generic [ref=f696e317]:
            - paragraph [ref=f696e318]: Adrena LINE Zipline Adventure Tours is the primary provider of high-flying adventure in the Sooke Hills, offering a thrilling perspective of the coastal rainforest canopy. Located on a 100-acre parcel of land in Sooke, it features an extensive course designed to showcase the diverse ecology of the region.
            - paragraph [ref=f696e319]: "Guided Zipline Tours: The signature experience includes eight different ziplines, ranging from 150 to 1,000 feet in length. Participants glide over the forest floor at heights of up to 150 feet, providing panoramic views of the Sooke Hills and the distant Olympic Mountains."
            - paragraph [ref=f696e320]: "The Unimog Experience: The adventure often begins with a rugged ride up the hillside in an authentic Unimog, a heavy-duty off-road vehicle that adds a mechanical element to the wilderness excursion."
        - article [ref=f696e321]:
          - heading "ATV / off-road backcountry areas" [level=3] [ref=f696e322]
          - generic [ref=f696e323]:
            - paragraph [ref=f696e324]: The backcountry surrounding Sooke is a major draw for off-road enthusiasts, primarily due to the extensive network of decommissioned and active forest service roads (FSRs) that cut deep into the Sooke Hills. While many regional and provincial parks in the immediate area prohibit motorized vehicles to protect sensitive watersheds, the surrounding crown lands and industrial corridors offer significant technical terrain.
            - paragraph [ref=f696e325]: "The Sooke Hills Industrial Corridor: Most off-roading in this region occurs on forest service roads originally built for the logging industry. These routes offer access to remote alpine viewpoints and hidden lakes that are inaccessible by standard vehicles."
            - paragraph [ref=f696e326]: "Granite Dunes / Sooke Backcountry: For experienced riders, the area toward the Jordan River offers more technical in-and-out trails. These can involve rocky riverbeds, steep inclines, and washouts that require high-clearance 4x4s, ATVs, or dirt bikes."

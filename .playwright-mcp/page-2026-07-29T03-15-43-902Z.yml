          - paragraph [ref=f744e87]: Long Beach is part of Pacific Rim National Park Reserve. It is one of the most famous beaches on Vancouver Island. It is wide, long, and open to the ocean. This makes it a powerful place to watch winter waves. You can walk on the sand when conditions are safe, or watch from a safer distance.
          - paragraph [ref=f744e88]: "Best for: Wide views, long walks, classic west coast scenery"
          - paragraph [ref=f744e89]: Good to know. You may need a park pass. Always follow Parks Canada safety signs and closures.
      - article [ref=f744e90]:
        - generic [ref=f744e91]:
          - heading "Wickaninnish Beach and Kwisitis Visitor Centre" [level=3] [ref=f744e92]
          - paragraph [ref=f744e93]: The Kwisitis Visitor Centre area is a good choice if you want a safer, more comfortable storm watching spot. The viewing deck gives you a strong view of the beach and waves.
          - paragraph [ref=f744e94]: The Kwisitis Visitor Centre area is a good choice if you want a safer, more comfortable storm watching spot. The viewing deck gives you a strong view of the beach and waves.
          - paragraph [ref=f744e95]: This is also a good place to learn about the area’s natural history, wildlife, and local First Nations culture.
          - paragraph [ref=f744e96]: Good to know. This is a good option when the beach itself feels too rough.
      - article [ref=f744e97]:
        - generic [ref=f744e98]:
          - heading "Tonquin Beach" [level=3] [ref=f744e99]
          - paragraph [ref=f744e100]: Tonquin Beach is smaller and more sheltered than the larger surf beaches. It is reached by a forest trail from town.
          - paragraph [ref=f744e101]: Tonquin Beach is smaller and more sheltered than the larger surf beaches. It is reached by a forest trail from town.
          - paragraph [ref=f744e102]: This beach can be beautiful in stormy weather, but the trail may be wet and slippery. It is better for a short visit than a long storm watching session.
          - paragraph [ref=f744e103]: Good to know. Wear proper shoes because the trail can be muddy.

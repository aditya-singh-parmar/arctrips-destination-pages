          - paragraph [ref=f744e80]: Chesterman Beach is a favorite place for beach walks and storm watching. It is close to town and easy to access. The beach is long, sandy, and scenic. On stormy days, you can watch waves crash along the shore. On calmer days, it is a great place for a winter walk.
          - paragraph [ref=f744e81]: "Best for: Easy access, beach walks, families, photography"
          - paragraph [ref=f744e82]: Good to know. Watch the tide. Parts of the beach may be harder to walk during high tide.

          - paragraph [ref=f744e73]: Cox Bay is one of the most famous storm-watching spots in Tofino. It is wide, open, and exposed to the Pacific Ocean. This makes it a great place to see large waves roll in. On stormy days, the waves can look huge. You may also see surfers on calmer winter days, but do not enter the water unless you are trained and conditions are safe.
          - paragraph [ref=f744e74]: "Best for: Big waves, beach views, photos, stormy ocean scenes"
          - paragraph [ref=f744e75]: Good to know. Stay far back from the water. Waves can reach higher up the beach than expected.

      - generic [ref=f714e618]:
        - generic [ref=f714e619]:
          - generic [ref=f714e620]: Camping
          - heading "What is the best campground in Tofino?" [level=3] [ref=f714e621]
          - paragraph [ref=f714e622]: Surf Grove is a top choice for Cox Bay surf access. Bella Pacifica is a classic family-friendly beach campground on tinwis/Mackenzie Beach. Crystal Cove is best for RV campers who want a resort-style stay.
        - generic [ref=f714e623]:
          - generic [ref=f714e624]: Surfing
          - heading "Can beginners surf in Tofino?" [level=3] [ref=f714e625]
          - paragraph [ref=f714e626]: Yes. Tofino is one of the best places in Canada for beginner surf lessons. Start with a surf school so you learn the right beach, gear, and safety steps.
        - generic [ref=f714e627]:
          - generic [ref=f714e628]: Kayaking and paddling
          - heading "Where is the best place to kayak in Tofino?" [level=3] [ref=f714e629]
          - paragraph [ref=f714e630]: Clayoquot Sound is the classic kayaking area. Meares Island is also popular because you can combine kayaking with the Big Tree Trail.
        - generic [ref=f714e631]:
          - generic [ref=f714e632]: Birding and wildlife
          - heading "Can you see puffins in Tofino?" [level=3] [ref=f714e633]
          - paragraph [ref=f714e634]: Yes, tufted puffins may be seen near Tofino, especially on summer boat tours near offshore rocks and islands. They are not usually easy to see from town beaches.
        - generic [ref=f714e635]:
          - generic [ref=f714e636]: Storm watching
          - heading "Is storm watching in Tofino dangerous?" [level=3] [ref=f714e637]
          - paragraph [ref=f714e638]: It can be dangerous if you get too close to the ocean. Watch from a safe distance, avoid wet rocks, and never turn your back on the waves.
        - generic [ref=f714e639]:
          - generic [ref=f714e640]: Restaurants
          - heading "What is the best restaurant in Tofino?" [level=3] [ref=f714e641]
          - paragraph [ref=f714e642]: Many visitors consider Wolf in the Fog one of the best restaurants in Tofino because it focuses on local seafood, foraged ingredients, cocktails, and west coast flavor. The Pointe Restaurant is another top choice for fine dining and ocean views.

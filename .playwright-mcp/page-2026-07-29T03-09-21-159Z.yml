    - generic [ref=f714e94]:
      - generic [ref=f714e95]:
        - text: Why go
        - heading "A town the tide sets the timetable for" [level=2] [ref=f714e96]
        - paragraph [ref=f714e97]: Tofino sits at the western edge of Vancouver Island, where the rainforest meets long stretches of open Pacific beach. It draws surfers, storm-watchers, and travellers looking for quiet time close to the water.
        - paragraph [ref=f714e98]: Plan around the tides and the seasons. Summer brings calm mornings and warm evenings on the sand, while winter delivers dramatic storm watching and empty beaches. Whatever the season, the pace here rewards staying a few nights rather than passing through.
        - link "Read the month by month guide" [ref=f714e99] [cursor=pointer]:
          - /url: guide.html
      - generic [ref=f714e100]:
        - generic [ref=f714e101]:
          - term [ref=f714e102]: Where it is
          - definition [ref=f714e103]: The western edge of Vancouver Island, where the rainforest meets open Pacific beach.
        - generic [ref=f714e104]:
          - term [ref=f714e105]: Getting there
          - definition [ref=f714e106]: Four hours from Nanaimo by road, and the last stretch is slow. Book the ferry first.

          - text: Long
          - generic [ref=f734e55]: Beach
        - paragraph [ref=f734e58]: One of the most famous beaches on Vancouver Island, on the park road between Tofino and Ucluelet.
        - paragraph [ref=f734e59]: As the name says, it is very long. Open sand, big sky, rolling waves, and rainforest standing behind you.
        - paragraph [ref=f734e60]:
          - text: "It turns up in four of our Tofino guides:"
          - link "beaches, hiking, storm watching and kayaking" [ref=f734e61] [cursor=pointer]:

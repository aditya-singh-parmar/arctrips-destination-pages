    - generic [ref=f734e365]:
      - generic [ref=f734e367]:
        - heading "Getting here" [level=2] [ref=f734e368]
        - paragraph [ref=f734e369]: Long Beach is the middle of a run of park beaches. This is the order they come in, driving from the Tofino end to the Ucluelet end.
      - list "The park beaches from the Tofino end to the Ucluelet end" [ref=f734e370]:
        - listitem [ref=f734e371]:
          - generic [ref=f734e372]: Schooner Cove
          - generic [ref=f734e373]: Forest first, then sand. The quietest stop of the five, closest to the Tofino end.
          - generic [ref=f734e374]: Tofino end
        - listitem [ref=f734e375]:
          - generic [ref=f734e376]: Long Beach
          - generic [ref=f734e377]: The main strand, and this page. Surf, walking, and the winter waves.
          - generic [ref=f734e378]: You are here
        - listitem [ref=f734e379]:
          - generic [ref=f734e380]: Combers Beach
          - generic [ref=f734e381]: Not a town beach. Wilder, emptier, and made for a long walk.
        - listitem [ref=f734e382]:
          - generic [ref=f734e383]: Wickaninnish Beach
          - generic [ref=f734e384]: Big ocean views, storm watching, and the Kwisitis Visitor Centre.
        - listitem [ref=f734e385]:
          - generic [ref=f734e386]: Florencia Bay
          - generic [ref=f734e387]: Sand cliffs and low tide exploring, down a set of stairs that feel longer coming back.
          - generic [ref=f734e388]: Ucluelet end
      - generic [ref=f734e389]:
        - paragraph [ref=f734e390]: "The Long Beach Unit holds twenty places in all: five beaches on this road, ten trails and paths off it, and three pieces of water."
        - link "See everything to do in Tofino" [ref=f734e391] [cursor=pointer]:
          - /url: things-to-do.html
      - generic [ref=f734e394]:
        - generic [ref=f734e395]:
          - term [ref=f734e396]: The road
          - definition [ref=f734e397]: Highway 4 runs behind the whole beach, with Parks Canada car parks off it at intervals. There is no single entrance to aim for.
        - generic [ref=f734e398]:
          - term [ref=f734e399]: From Tofino
          - definition [ref=f734e400]: You arrive at the north end, about twenty minutes out of town.
        - generic [ref=f734e401]:
          - term [ref=f734e402]: From Ucluelet
          - definition [ref=f734e403]: You arrive at the south end, about twenty minutes out of town, past Florencia Bay and Wickaninnish.
        - generic [ref=f734e404]:
          - term [ref=f734e405]: Without a car
          - definition [ref=f734e406]: The ʔapsčiik t̓ašii pathway, said ups-cheek ta-shee, is paved and runs the length of the unit between the two towns. It has hills, so plan the way back.
    - generic [ref=f734e408]:
      - generic [ref=f734e410]:
        - heading "Before you go" [level=2] [ref=f734e411]
        - paragraph [ref=f734e412]: Five things the guides say every time. Read these and you are set.
      - generic [ref=f734e413]:
        - generic [ref=f734e414]:
          - term [ref=f734e415]: Check the tide
          - definition [ref=f734e416]: The beach is much wider at low water, and the walk back is longer than it looked on the way out. Today's readings are at the top of this page.
        - generic [ref=f734e417]:
          - term [ref=f734e418]: Watch the waves
          - definition [ref=f734e419]: Stay well back from big waves and never turn your back on the ocean. This is open coast, not a sheltered bay.
        - generic [ref=f734e420]:
          - term [ref=f734e421]: Swimming
          - definition [ref=f734e422]: Yes, but the water is cold and the current can be strong. Most people wear a wetsuit. There are no lifeguards.

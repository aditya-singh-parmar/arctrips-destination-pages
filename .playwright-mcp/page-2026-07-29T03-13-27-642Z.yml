    - generic [ref=f734e145]:
      - heading "What Long Beach actually is" [level=2] [ref=f734e148]
      - generic [ref=f734e149]:
        - generic [ref=f734e150]:
          - paragraph [ref=f734e151]: Long Beach is part of Pacific Rim National Park Reserve, the stretch of protected coast between Tofino and Ucluelet. It is the beach most people picture when they picture this coast, and it is the reason the road runs out here at all.
          - paragraph [ref=f734e152]: "It gives you the classic west coast feeling in one look: open sand, big sky, rolling waves, and rainforest behind you. No promenade, no line of hotels, no boardwalk. The car park, then the sand, then the Pacific."
          - paragraph [ref=f734e153]: It is a good place for walking, surfing, watching waves, and taking photographs, and there are trails and visitor areas in the park within a few minutes of it.
          - list "What the beaches guide says Long Beach is good for" [ref=f734e154]:
            - listitem [ref=f734e155]: Long walks
            - listitem [ref=f734e156]: Big beach views
            - listitem [ref=f734e157]: Surfing
            - listitem [ref=f734e158]: Storm watching
            - listitem [ref=f734e159]: Photography
            - listitem [ref=f734e160]: Pacific Rim National Park Reserve
          - heading "In winter it becomes the storm beach" [level=3] [ref=f734e161]
          - paragraph [ref=f734e162]: Long Beach is wide, long, and open to the ocean with nothing in front of it. That is what makes it a powerful place to watch winter waves. You can walk on the sand when conditions are safe, or watch from a safer distance back, which on the worst days is the better call and still the better view.
          - heading "Walking it" [level=3] [ref=f734e163]
          - paragraph [ref=f734e164]: "A Long Beach hike is not a formal trail. It is simple: walk along the sand, watch the waves, enjoy the wide open views, and turn back when you are ready. It is the easiest big walk near Tofino, and the one that suits people who want scenery without a trailhead, a map, or boots."
          - generic [ref=f734e165]:
            - heading "Not a kayaking beach" [level=4] [ref=f734e166]
            - paragraph [ref=f734e167]: "Long Beach faces the open Pacific, so surf, swell, rip currents and wind make it a hard place to paddle. Expert sea kayakers and surf kayakers use it in the right conditions. Everyone else should enjoy it from shore and paddle the sheltered water instead: Lemmens Inlet, Meares Island, Grice Bay, Tinwis Beach or Kennedy Lake."
        - generic [ref=f734e168]:
          - heading "What our guides say about it" [level=3] [ref=f734e169]

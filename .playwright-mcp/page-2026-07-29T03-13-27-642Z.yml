              - paragraph [ref=f734e176]: Walk along the sand, watch the waves, enjoy the wide open views, and turn back when you are ready.
            - generic [ref=f734e177]:
              - paragraph [ref=f734e178]: Storm watching guide
              - paragraph [ref=f734e179]: It is wide, long, and open to the ocean. This makes it a powerful place to watch winter waves.
      - generic [ref=f734e180]:
        - figure [ref=f734e181]:
          - img "Rows of white water rolling in at Long Beach with spray blowing off the wave tops and a dark forested point behind" [ref=f734e182]
        - figure [ref=f734e183]:
          - img "A paddler in a small kayak punching through a breaking wave in the surf zone off the open coast" [ref=f734e184]
      - paragraph [ref=f734e185]: Left, the surf that made the beach famous. Right, why most visitors should paddle somewhere else.
    - generic [ref=f734e186]:
      - img "A single cyclist crossing the wet sand at Long Beach at low water under a wide grey sky" [ref=f734e187]
      - generic [ref=f734e189]:
        - text: The Long Beach Unit
        - paragraph [ref=f734e190]:
          - generic [ref=f734e191]: "20"
          - text: places in and beside this one unit of the park.
        - paragraph [ref=f734e192]: Five beaches on the road, ten trails and paths off it, two storm viewpoints and three pieces of water, each walked and written up on its own. Long Beach is one of the twenty.
        - link "Everything worth doing in Tofino" [ref=f734e193] [cursor=pointer]:
          - /url: things-to-do.html

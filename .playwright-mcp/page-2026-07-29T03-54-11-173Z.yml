      - generic [ref=f801e53]:
        - text: Tofino, Vancouver Island
        - heading "Storm watching in Tofino" [level=1] [ref=f801e54]
        - paragraph [ref=f801e55]: Tofino is not just a summer beach town. In winter, it becomes one of the best places in Canada to watch storms.
        - generic [ref=f801e56]:
          - generic [ref=f801e57]:
            - term [ref=f801e58]: Places written up
            - definition [ref=f801e59]: "7"
          - generic [ref=f801e60]:

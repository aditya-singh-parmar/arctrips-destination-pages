    - generic [ref=f801e65]:
      - article [ref=f801e66]:
        - generic [ref=f801e67]:
          - heading "Cox Bay" [level=3] [ref=f801e68]
          - paragraph [ref=f801e69]: Cox Bay is one of the most famous storm-watching spots in Tofino. It is wide, open, and exposed to the Pacific Ocean. This makes it a great place to see large waves roll in. On stormy days, the waves
          - paragraph [ref=f801e70]: "Best for: Big waves, beach views, photos, stormy ocean scenes"
          - paragraph [ref=f801e71]: Good to know. Stay far back from the water. Waves can reach higher up the beach than expected.
      - article [ref=f801e72]:
        - generic [ref=f801e73]:
          - heading "Chesterman Beach" [level=3] [ref=f801e74]
          - paragraph [ref=f801e75]: Chesterman Beach is a favorite place for beach walks and storm watching. It is close to town and easy to access. The beach is long, sandy, and scenic. On stormy days, you can watch waves crash along t
          - paragraph [ref=f801e76]: "Best for: Easy access, beach walks, families, photography"
          - paragraph [ref=f801e77]: Good to know. Watch the tide. Parts of the beach may be harder to walk during high tide.
      - article [ref=f801e78]:
        - generic [ref=f801e79]:
          - heading "Long Beach" [level=3] [ref=f801e80]
          - paragraph [ref=f801e81]: Long Beach is part of Pacific Rim National Park Reserve. It is one of the most famous beaches on Vancouver Island. It is wide, long, and open to the ocean. This makes it a powerful place to watch wint
          - paragraph [ref=f801e82]: "Best for: Wide views, long walks, classic west coast scenery"
          - paragraph [ref=f801e83]: Good to know. You may need a park pass. Always follow Parks Canada safety signs and closures.
      - article [ref=f801e84]:
        - generic [ref=f801e85]:
          - heading "Wickaninnish Beach and Kwisitis Visitor Centre" [level=3] [ref=f801e86]
          - paragraph [ref=f801e87]: The Kwisitis Visitor Centre area is a good choice if you want a safer, more comfortable storm watching spot. The viewing deck gives you a strong view of the beach and waves.
          - paragraph [ref=f801e88]: This is also a good place to learn about the area’s natural history, wildlife, and local First Nations culture.
          - paragraph [ref=f801e89]: "Best for: Viewing deck, learning, families, safer storm views"
          - paragraph [ref=f801e90]: Good to know. This is a good option when the beach itself feels too rough.
      - article [ref=f801e91]:
        - generic [ref=f801e92]:
          - heading "Tonquin Beach" [level=3] [ref=f801e93]
          - paragraph [ref=f801e94]: Tonquin Beach is smaller and more sheltered than the larger surf beaches. It is reached by a forest trail from town.
          - paragraph [ref=f801e95]: This beach can be beautiful in stormy weather, but the trail may be wet and slippery. It is better for a short visit than a long storm watching session.
          - paragraph [ref=f801e96]: "Best for: Short walk, forest trail, quiet views"
          - paragraph [ref=f801e97]: Good to know. Wear proper shoes because the trail can be muddy.
      - article [ref=f801e98]:
        - figure [ref=f801e99]:
          - img "Pettinger Point, Tofino" [ref=f801e100]
        - generic [ref=f801e101]:
          - heading "Pettinger Point" [level=3] [ref=f801e102]
          - paragraph [ref=f801e103]: Accessible via a trail from Cox Bay, this headland offers a spectacular vantage point where waves explode into white spray against the cliffs.
      - article [ref=f801e104]:
        - figure [ref=f801e105]:
          - img "Oceanfront Resorts and Cabins, Tofino" [ref=f801e106]
        - generic [ref=f801e107]:
          - heading "Oceanfront Resorts and Cabins" [level=3] [ref=f801e108]
          - paragraph [ref=f801e109]: One of the best ways to storm watch in Tofino is from inside. Many oceanfront hotels, cabins, and resorts have large windows facing the water.
          - paragraph [ref=f801e110]: This is perfect if the weather is too rough to be outside. You can watch the storm with a warm drink, a blanket, and dry socks.
          - paragraph [ref=f801e111]: The Wickaninnish Inn is the most iconic destination for this experience, specifically built on a rocky headland to withstand and showcase the Pacific's power.

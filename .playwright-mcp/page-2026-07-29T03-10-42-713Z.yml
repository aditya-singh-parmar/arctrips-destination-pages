            - paragraph [ref=f722e204]: The Ottawa Art Gallery (OAG) is a contemporary cultural hub located in the heart of downtown Ottawa. Reopened in 2018 in a sleek, multi-story facility, it serves as a premier venue for the art of the Ottawa-Gatineau region while fostering connections to national and international art scenes.
            - paragraph [ref=f722e205]: "Diverse Collections: The gallery is home to the Firestone Collection of Canadian Art, which includes significant works by the Group of Seven, alongside rotating contemporary exhibitions featuring photography, sculpture, and new media."
            - paragraph [ref=f722e206]: "Architectural Landmark: The building features stunning modern design with light-filled galleries, a rooftop terrace with views of the city, and integrated spaces that connect it to the University of Ottawa and the Rideau Centre."

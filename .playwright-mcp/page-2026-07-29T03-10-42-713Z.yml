            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_3jmcg8j2p2yu\" w:id=\"36\"/><w:bookmarkEnd w:id=\"36\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">7. Mooney's Bay Park and Beach, Ottawa" [ref=f722e311]
          - generic [ref=f722e312]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_3jmcg8j2p2yu\" w:id=\"36\"/><w:bookmarkEnd w:id=\"36\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">7. Mooney's Bay Park and Beach" [level=3] [ref=f722e313]
            - paragraph [ref=f722e314]: Mooney's Bay Park and Beach is a massive multi-use waterfront park located along the Rideau River. It is home to one of Ottawa’s most popular summer beaches and serves as a major hub for outdoor recreation and competitive water sports.
            - paragraph [ref=f722e315]: "Sue Holloway Fitness Park: The park features an extensive outdoor fitness circuit named after the Olympic medalist, offering various stations for strength and agility training along the scenic riverfront."
            - paragraph [ref=f722e316]: "Giver 150 Playground: This is one of the largest playgrounds in Canada, built to celebrate the country's 150th anniversary. It is designed in the shape of Canada, with different play structures representing various provinces and territories."
        - article [ref=f722e317]:
          - figure [ref=f722e318]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_9e86uno2q1pe\" w:id=\"37\"/><w:bookmarkEnd w:id=\"37\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">8. Andrew Haydon Park, Ottawa" [ref=f722e319]
          - generic [ref=f722e320]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_9e86uno2q1pe\" w:id=\"37\"/><w:bookmarkEnd w:id=\"37\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">8. Andrew Haydon Park" [level=3] [ref=f722e321]
            - paragraph [ref=f722e322]: Andrew Haydon Park is a scenic waterfront destination located along the shores of the Ottawa River in the city's west end. It is widely regarded as one of Ottawa's best spots for family gatherings and outdoor relaxation, offering a mix of manicured lawns, tranquil ponds, and river views.
            - paragraph [ref=f722e323]: "Acoustic Bandshell: The park features a prominent outdoor bandshell that hosts community concerts and events throughout the summer months."
            - paragraph [ref=f722e324]: "Water Features: Visitors can enjoy several man-made ponds and a small waterfall, which serve as a peaceful backdrop for walks and a popular habitat for local geese and ducks."
        - article [ref=f722e325]:
          - figure [ref=f722e326]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_v0e8k3d6rkj2\" w:id=\"38\"/><w:bookmarkEnd w:id=\"38\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">9. Dows Lake Pavilion, Ottawa" [ref=f722e327]
          - generic [ref=f722e328]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_v0e8k3d6rkj2\" w:id=\"38\"/><w:bookmarkEnd w:id=\"38\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">9. Dows Lake Pavilion" [level=3] [ref=f722e329]
            - paragraph [ref=f722e330]: Dows Lake Pavilion serves as a vibrant year-round hub for outdoor recreation and dining, located at the scenic southern end of the Rideau Canal's western section. It is a primary destination for those looking to experience Ottawa’s waterways, offering a mix of adventure and relaxation with panoramic views of the water.
            - paragraph [ref=f722e331]: "Year-Round Recreation: During the warmer months, the marina offers rentals for canoes, kayaks, and paddleboats. In the winter, it transforms into a major gateway for the Rideau Canal Skateway, providing skate rentals and sharpening services."
            - paragraph [ref=f722e332]: "Diverse Dining: The pavilion houses several restaurants, including Lago Bar & Grill for more formal dining and Malone’s Lakeside Grill for a casual atmosphere, both of which feature patios overlooking the lake."
        - article [ref=f722e333]:
          - figure [ref=f722e334]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_1gzoz1pvre2g\" w:id=\"39\"/><w:bookmarkEnd w:id=\"39\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">10. Victoria Island, Ottawa" [ref=f722e335]
          - generic [ref=f722e336]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_1gzoz1pvre2g\" w:id=\"39\"/><w:bookmarkEnd w:id=\"39\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">10. Victoria Island" [level=3] [ref=f722e337]
            - paragraph [ref=f722e338]: Victoria Island is a place of deep historical and spiritual significance, located in the Ottawa River just below Parliament Hill. Known as Asinabka to the Algonquin Anishinaabe people, it has served as a traditional gathering place for indigenous communities for thousands of years.
            - paragraph [ref=f722e339]: "Indigenous Heritage: The island is a sacred site where indigenous peoples once met for trade, ceremonies, and celebrations. Today, it remains a focal point for indigenous culture and land claims within the capital."
            - paragraph [ref=f722e340]: "Industrial Past: In the 19th century, the island was a major industrial hub powered by the Chaudière Falls, hosting sawmills and ironworks. You can still see the remains of heritage industrial buildings, such as the old Bronson Company structures."

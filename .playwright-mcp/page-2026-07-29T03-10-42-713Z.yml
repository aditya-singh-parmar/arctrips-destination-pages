          - generic [ref=f722e288]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_8bp3v6omlhjt\" w:id=\"33\"/><w:bookmarkEnd w:id=\"33\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">4. Petrie Island Park" [level=3] [ref=f722e289]
            - paragraph [ref=f722e290]: Petrie Island Park is a unique natural oasis situated on the Ottawa River in the city's east end. Formed by sand deposited during the last ice age, the islands offer a rare beach-and-bog environment that feels more like a coastal getaway than a typical riverside park.
            - paragraph [ref=f722e291]: "Sandy Beaches: The park features two main public beaches (North Beach and East Bay) with expansive sandy shores that are popular for swimming and sunbathing during the summer months."
            - paragraph [ref=f722e292]: "Nature Trails: A network of low-intensity trails winds through the island’s wetlands and forests. The Turtle Pond area is particularly famous for sightings of painted and snapping turtles."
        - article [ref=f722e293]:

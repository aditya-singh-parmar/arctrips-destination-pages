          - generic [ref=f722e186]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_5ngd9sf4nx0n\" w:id=\"17\"/><w:bookmarkEnd w:id=\"17\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Royal Canadian Mint" [level=3] [ref=f722e187]
            - paragraph [ref=f722e188]: Housed in a magnificent historic Tudor-Revival building (established 1908), the Royal Canadian Mint headquarters is where Canada’s hand-crafted collector coins, gold bullion, and medals are produced. Unlike the high-speed circulation facility in Winnipeg, the Ottawa Mint is a place of artistry, precision, and immense wealth.
            - paragraph [ref=f722e189]: "Guided Tours: Every visit centers on a 45-minute guided tour (available in English and French) that provides a bird’s-eye view of the production floor. You’ll learn how master engravers translate art into metal and see the state-of-the-art gold refining technology."
            - paragraph [ref=f722e190]: "Million Dollar Coin: Witness the Guinness World Record-breaking 100-kg coin made of 99.999% pure gold. With a face value of $1 million, it is one of the rarest and most valuable coins in the world."

            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_rg6u77mkm0ej\" w:id=\"23\"/><w:bookmarkEnd w:id=\"23\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">7. Laurier House National Historic Site" [level=3] [ref=f722e219]
            - paragraph [ref=f722e220]: "Laurier House is a stately Victorian mansion that served as the residence for two of Canada’s most important Prime Ministers: Sir Wilfrid Laurier and William Lyon Mackenzie King. This National Historic Site offers a rare, intimate look at the private lives of the leaders who shaped the country for over 50 years, preserved exactly as it was when Mackenzie King lived there."
            - paragraph [ref=f722e221]: "Second-Floor Library: This is the most famous room in the house, where Mackenzie King spent his evenings. It remains filled with his personal book collection, his crystal ball, and a portrait of his mother, whom he famously claimed to communicate with during spiritualist seances."
            - paragraph [ref=f722e222]: "Political History: The house features original artifacts and documents that highlight key moments in Canadian history, including the development of the Commonwealth and the social reforms of the early 20th century."

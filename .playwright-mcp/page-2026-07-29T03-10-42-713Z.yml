          - generic [ref=f722e296]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_qholbbxnqdt7\" w:id=\"34\"/><w:bookmarkEnd w:id=\"34\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Ottawa Locks" [level=3] [ref=f722e297]
            - paragraph [ref=f722e298]: The Rideau Canal, Locks 1 - 8 - Ottawa, commonly known as the Ottawa Locks, is a masterwork of 19th-century engineering located in a dramatic gorge between Parliament Hill and the Fairmont Château Laurier. These eight flight locks connect the Ottawa River to the Rideau Canal, lifting or lowering vessels a total of 24 meters (79 feet).
            - paragraph [ref=f722e299]: "Manual Operation: To this day, the massive wooden gates are opened and closed by hand using hand-cranked winches, exactly as they were when the canal opened in 1832."
            - paragraph [ref=f722e300]: "Step-Like Design: The flight design means the locks are connected directly to one another like a giant staircase of water, providing one of the most photographed vistas in the capital."

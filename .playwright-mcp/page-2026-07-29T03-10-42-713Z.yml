          - generic [ref=f722e350]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_73afvykgurbb\" w:id=\"41\"/><w:bookmarkEnd w:id=\"41\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">1. Alexandra Bridge" [level=3] [ref=f722e351]
            - paragraph [ref=f722e352]: The Alexandra Bridge is an iconic interprovincial cantilever bridge that spans the Ottawa River, connecting Ottawa, Ontario, to Gatineau, Quebec. Completed in 1901, it was once the longest cantilever bridge in Canada and remains a vital and scenic link for commuters and tourists alike.
            - paragraph [ref=f722e353]: "Breathtaking Panoramas: The bridge is widely considered to offer the best vantage point in the region for photographing Parliament Hill, the National Gallery of Canada, and the Canadian Museum of History."
            - paragraph [ref=f722e354]: "Active Transportation Hub: It features a dedicated wooden boardwalk for pedestrians and cyclists, providing a scenic and safe route away from vehicle traffic."

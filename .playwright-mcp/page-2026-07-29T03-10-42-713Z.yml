          - generic [ref=f722e178]:
            - 'heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_158yh6dnaz4h\" w:id=\"15\"/><w:bookmarkEnd w:id=\"15\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">2. Diefenbunker: Canada''s Cold War Museum" [level=3] [ref=f722e179]'
            - paragraph [ref=f722e180]: "Located in the rural village of Carp, just outside Ottawa, the Diefenbunker: Canada's Cold War Museum is a massive four-story underground bunker designed to withstand a nuclear blast. Built in secret between 1959 and 1961, it was intended to house the top officials of the Canadian government and military in the event of a nuclear war, ensuring the continuity of government. Today, the bunker serves as a haunting and fascinating museum that preserves the tension of the Cold War era."
            - paragraph [ref=f722e181]: "Blast Tunnel: Enter through the same 115-foot metal tunnel designed to absorb the shockwave of a nuclear explosion."
            - paragraph [ref=f722e182]: "War Cabinet Room: See the nerve center where the Prime Minister and advisors would have made critical decisions during a crisis."

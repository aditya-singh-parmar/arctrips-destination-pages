          - generic [ref=f722e272]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_k8mdxgqlqrbj\" w:id=\"31\"/><w:bookmarkEnd w:id=\"31\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">2. Hog’s Back Falls" [level=3] [ref=f722e273]
            - paragraph [ref=f722e274]: Hog's Back Park is a stunning natural retreat located where the Rideau Canal splits from the Rideau River. Known officially as Prince of Wales Falls, this site offers a dramatic display of churning water and jagged rock formations, providing a powerful contrast to the calm waters of the nearby canal.
            - paragraph [ref=f722e275]: "Historical Engineering: You can observe the Hog's Back Dam, a significant feat of 19th-century engineering that remains a vital part of the canal's water management system."
            - paragraph [ref=f722e276]: "Hiking and Biking: The park is a major hub for Ottawa’s pathway network, with trails connecting directly to Vincent Massey Park and the Rideau Canal Eastern Pathway."
        - article [ref=f722e277]:
          - figure [ref=f722e278]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_js6dt0neau0o\" w:id=\"32\"/><w:bookmarkEnd w:id=\"32\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Mer Bleue Bog, Ottawa" [ref=f722e279]
          - generic [ref=f722e280]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_js6dt0neau0o\" w:id=\"32\"/><w:bookmarkEnd w:id=\"32\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Mer Bleue Bog" [level=3] [ref=f722e281]
            - paragraph [ref=f722e282]: Mer Bleue Bog is one of the most outstanding natural features of the National Capital Region. This 7,700-year-old bog provides a unique glimpse into an ecosystem more typically found in the northern Arctic. It is a designated Ramsar site, meaning it is a wetland of international importance, and it serves as a critical living laboratory for studying climate change and carbon sequestration. The bog is a favorite for nature photographers and hikers due to its stark, haunting beauty and rare flora.
            - paragraph [ref=f722e283]: "Boardwalk: The most popular feature is a 1.2-kilometer interpretive boardwalk that loops through the heart of the bog, allowing you to walk over the fragile peatland without damaging the ecosystem."
            - paragraph [ref=f722e284]: "Unique Flora: Keep an eye out for rare plants like the carnivorous pitcher plant, bog laurel, and cottongrass, which creates a sea of white tufts in early summer."

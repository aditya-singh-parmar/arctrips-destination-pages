          - generic [ref=f722e250]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_7hsi91bnuouz\" w:id=\"27\"/><w:bookmarkEnd w:id=\"27\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">11. Tomb of the Unknown Soldier" [level=3] [ref=f722e251]
            - paragraph [ref=f722e252]: The Tomb of the Unknown Soldier is Canada’s most significant site of individual and collective remembrance. Located at the base of the National War Memorial in Confederation Square, it holds the remains of an unidentified Canadian soldier who died during the First World War near Vimy Ridge, France.
            - paragraph [ref=f722e253]: "Sarcophagus: Designed by artist Mary-Ann Liu, the tomb is made of dark Caledonia granite from Quebec, chosen to complement the National War Memorial. Its bronze relief features a medieval sword, a First World War helmet, and branches of maple and laurel leaves (signifying victory and death)."
            - paragraph [ref=f722e254]: "Poppies: In a spontaneous tradition that began in 2000, visitors often leave their poppies on the tomb after Remembrance Day ceremonies, covering the bronze in a sea of red."

          - generic [ref=f722e374]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_puu2domuqk91\" w:id=\"44\"/><w:bookmarkEnd w:id=\"44\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">4. Canadian Tire Centre" [level=3] [ref=f722e375]
            - paragraph [ref=f722e376]: The Canadian Tire Centre is a premier multi-purpose arena located in Kanata, about 25 kilometers west of downtown Ottawa. Since opening in 1996, it has served as the home ice for the National Hockey League’s Ottawa Senators and is the region's primary venue for large-scale entertainment.
            - paragraph [ref=f722e377]: "World-Class Events: Beyond NHL hockey, the arena hosts major global touring acts, from rock concerts and pop stars to family shows like Disney on Ice and professional wrestling events."
            - paragraph [ref=f722e378]: "Ottawa Hockey Hall of Fame: Located within the building, this space celebrates the rich history of hockey in the Ottawa region, featuring plaques and memorabilia from local legends."
        - article [ref=f722e379]:
          - figure [ref=f722e380]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_qn3rmsfsiv7y\" w:id=\"45\"/><w:bookmarkEnd w:id=\"45\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. The Glebe, Ottawa" [ref=f722e381]
          - generic [ref=f722e382]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_qn3rmsfsiv7y\" w:id=\"45\"/><w:bookmarkEnd w:id=\"45\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. The Glebe" [level=3] [ref=f722e383]
            - paragraph [ref=f722e384]: The Glebe is one of Ottawa’s most desirable and historic neighborhoods, offering a village-in-the-city feel just south of the downtown core. Bordered by the scenic Rideau Canal, it is a pedestrian-friendly enclave known for its high-end boutiques, lush parks, and stunning Victorian and Edwardian architecture.
            - paragraph [ref=f722e385]: "Bank Street Promenade: The neighborhood's main artery is lined with independent businesses. You can find everything from rare vinyl at Compact Music to artisanal kitchenware at J.D. Adam Kitchen Company."
            - paragraph [ref=f722e386]: "Rideau Canal & Patterson Creek: The canal provides a scenic backdrop for year-round recreation, including skating in winter and cycling in summer. Patterson Creek Park is a local favorite for its tranquil willow-lined inlet and stone bridges."
        - article [ref=f722e387]:
          - figure [ref=f722e388]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_jbrmdkms5tcc\" w:id=\"46\"/><w:bookmarkEnd w:id=\"46\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">6. National Arts Centre, Ottawa" [ref=f722e389]
          - generic [ref=f722e390]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_jbrmdkms5tcc\" w:id=\"46\"/><w:bookmarkEnd w:id=\"46\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">6. National Arts Centre" [level=3] [ref=f722e391]
            - paragraph [ref=f722e392]: The National Arts Centre is Canada's premier bilingual performing arts hub, situated along the scenic Rideau Canal in downtown Ottawa. Since its opening in 1969 as a Centennial project, it has become a beacon for the arts, showcasing world-class theater, dance, and music across its four distinct stages.
            - paragraph [ref=f722e393]: "Architectural Grandeur: The building is a striking example of Brutalist architecture, recently revitalized with a magnificent glass atrium that offers panoramic views of Confederation Square and Parliament Hill."
            - paragraph [ref=f722e394]: "Performance Variety: It is the home of the NAC Orchestra and hosts everything from Broadway tours and contemporary dance to indigenous theater and French-language productions."
        - article [ref=f722e395]:
          - figure [ref=f722e396]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_94zhtmn6uxlq\" w:id=\"47\"/><w:bookmarkEnd w:id=\"47\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">7. Sparks Street, Ottawa" [ref=f722e397]
          - generic [ref=f722e398]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_94zhtmn6uxlq\" w:id=\"47\"/><w:bookmarkEnd w:id=\"47\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">7. Sparks Street" [level=3] [ref=f722e399]
            - paragraph [ref=f722e400]: Sparks Street is a historic pedestrian mall in the heart of downtown Ottawa, just a block south of Parliament Hill. Converted into a permanent outdoor mall in 1967, it was the first of its kind in Canada and remains a vibrant public space known for its heritage architecture, diverse dining, and major seasonal festivals.
            - paragraph [ref=f722e401]: "Iconic Landmarks: You can find the famous Ottawa Sign for a perfect photo opportunity, alongside historic buildings that house unique shops like Canada's Four Corners."
            - paragraph [ref=f722e402]: "Dining and Nightlife: The mall is lined with numerous patios and restaurants, ranging from the European-inspired Bier Markt to cozy pubs and cafes, making it a popular spot for both weekday business lunches and evening socializing."
        - article [ref=f722e403]:
          - figure [ref=f722e404]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_nd2dpy5z1xzp\" w:id=\"48\"/><w:bookmarkEnd w:id=\"48\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">8. Winterlude, Ottawa" [ref=f722e405]
          - generic [ref=f722e406]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_nd2dpy5z1xzp\" w:id=\"48\"/><w:bookmarkEnd w:id=\"48\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">8. Winterlude" [level=3] [ref=f722e407]
            - paragraph [ref=f722e408]: Winterlude (Bal de Neige) is Ottawa’s flagship winter festival, typically held during the first three weeks of February. Established in 1979, it celebrates Canada's northern climate and culture, transforming the capital into a giant playground of ice and snow.
            - paragraph [ref=f722e409]: "Rideau Canal Skateway: The world’s largest skating rink is the heart of Winterlude. Stretching 7.8 kilometers, it features food kiosks selling BeaverTails and hot chocolate directly on the ice."
            - paragraph [ref=f722e410]: "Snowflake Kingdom: Located across the river in Gatineau's Jacques-Cartier Park, this is a massive snow playground featuring giant slides, snow sculptures, and activities designed specifically for children and families."
        - article [ref=f722e411]:
          - figure [ref=f722e412]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_4xgyi8u7y6ib\" w:id=\"49\"/><w:bookmarkEnd w:id=\"49\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">9. Canadian Tulip Festival, Ottawa" [ref=f722e413]
          - generic [ref=f722e414]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_4xgyi8u7y6ib\" w:id=\"49\"/><w:bookmarkEnd w:id=\"49\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">9. Canadian Tulip Festival" [level=3] [ref=f722e415]
            - paragraph [ref=f722e416]: The Canadian Tulip Festival is a world-renowned event held annually in May, transforming Ottawa into a sea of vibrant color. The festival is a symbol of international friendship, originating from a gift of 100,000 tulip bulbs from the Dutch Royal Family in 1945 to thank Canada for providing them refuge during WWII and for the liberation of the Netherlands.
            - paragraph [ref=f722e417]: "Commissioners Park: This is the festival's epicenter at Dows Lake, featuring over 300,000 tulips in dozens of garden beds. It’s the largest single display of tulips in the world."
            - paragraph [ref=f722e418]: "Blacklight Boardwalk: Every evening, this boardwalk transforms into a glowing experience with ultraviolet lighting that reveals the hidden patterns on the tulips that pollinators see."
        - article [ref=f722e419]:
          - figure [ref=f722e420]:
            - img "10. Gatineau Park, Ottawa" [ref=f722e421]
          - generic [ref=f722e422]:
            - heading "10. Gatineau Park" [level=3] [ref=f722e423]
            - paragraph [ref=f722e424]: Gatineau Park is a sprawling 361-square-kilometer conservation area located just 15 minutes north of downtown Ottawa. It serves as the region's primary year-round destination for outdoor adventure, offering a rugged landscape of Precambrian hills, sparkling lakes, and dense forests that feel worlds away from the city.
            - paragraph [ref=f722e425]: "Scenic Lookouts: The park is famous for its panoramic views from the Eardley Escarpment. The most popular spots are Champlain Lookout, which offers a sweeping vista of the Ottawa Valley, and Pink Lake, a rare meromictic lake known for its stunning turquoise water."
            - paragraph [ref=f722e426]: "Mackenzie King Estate: This historic country estate was the summer home of Canada's longest-serving Prime Minister. Visitors can explore the landscaped gardens, the charming cottages, and the Abbey Ruins, a collection of architectural fragments King gathered from various demolished buildings."

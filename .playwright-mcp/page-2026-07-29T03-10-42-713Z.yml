            - paragraph [ref=f722e306]: Rideau Falls Park is a 2.89-hectare urban park where the Rideau River empties into the Ottawa River. The name Rideau (French for curtain) was coined by Samuel de Champlain in 1613, who described the twin 11-meter waterfalls as resembling a shimmering white curtain of water.
            - paragraph [ref=f722e307]: "Twin Falls: The waterfalls are divided by Green Island. You can view them from various angles within the park or cross the bridge on Sussex Drive to look directly down into the churning mist."
            - paragraph [ref=f722e308]: "Green Island Monuments: This small island between the falls houses several significant national commemorations, including:"
        - article [ref=f722e309]:

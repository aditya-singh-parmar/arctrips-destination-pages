          - generic [ref=f722e140]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_lcfb0tgqix4x\" w:id=\"10\"/><w:bookmarkEnd w:id=\"10\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">9. National War Memorial" [level=3] [ref=f722e141]
            - paragraph [ref=f722e142]: The National War Memorial in Ottawa stands as a powerful tribute to Canadian soldiers who have served and sacrificed in wars and peacekeeping missions. Located in Confederation Square, it is a monumental symbol of Canada's military history and resilience. Originally built to commemorate the First World War, it was rededicated over the years to include those who served in the Second World War, the Korean War, and the war in Afghanistan.
            - paragraph [ref=f722e143]: "Response Statues: The memorial features 22 bronze figures representing the different branches of the Canadian forces during World War I, shown passing through a granite arch topped by the allegorical figures of Peace and Freedom."
            - paragraph [ref=f722e144]: "Tomb of the Unknown Soldier: At the foot of the memorial lies the Tomb of the Unknown Soldier, containing the remains of an unidentified Canadian soldier from a cemetery near Vimy Ridge, France."
        - article [ref=f722e145]:
          - figure [ref=f722e146]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_rr720aixdo7p\" w:id=\"11\"/><w:bookmarkEnd w:id=\"11\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">10. Peace Tower, Ottawa" [ref=f722e147]
          - generic [ref=f722e148]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_rr720aixdo7p\" w:id=\"11\"/><w:bookmarkEnd w:id=\"11\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">10. Peace Tower" [level=3] [ref=f722e149]
            - paragraph [ref=f722e150]: The Peace Tower is the most iconic feature of the Canadian parliamentary complex and a national symbol of Canada. Standing at 92.2 meters (302 feet), this stone bell tower serves as a focal point of Parliament Hill and acts as a Victorian High Gothic monument to the sacrifices made by Canadians during the First World War.
            - paragraph [ref=f722e151]: "Memorial Chamber: Located directly above the front arch of the tower, this solemn room houses the Books of Remembrance, which list the names of every Canadian who has died in military service."
            - paragraph [ref=f722e152]: "Carillon: The tower contains 53 bells of varying sizes. The Dominion Carillonneur performs regular live recitals, filling the downtown core with music that ranges from classical pieces to contemporary arrangements."
        - article [ref=f722e153]:
          - figure [ref=f722e154]:
            - img "11. Fairmont Château Laurier, Ottawa" [ref=f722e155]
          - generic [ref=f722e156]:
            - heading "11. Fairmont Château Laurier" [level=3] [ref=f722e157]
            - paragraph [ref=f722e158]: Often referred to as the third chamber of Parliament, the Fairmont Château Laurier is a magnificent French Gothic Revival castle that has anchored downtown Ottawa since 1912. Built by the Grand Trunk Railway, its history is famously intertwined with the Titanic; the hotel's visionary, Charles Melville Hays, perished on the ill-fated ship just days before the scheduled grand opening. Today, it remains a focal point of Canadian political and social life, having hosted royalty, world leaders, and celebrities for over a century.
            - paragraph [ref=f722e159]: "Design and Materials: The castle features a limestone façade, distinctive copper roofing, and soaring turrets. Inside, you'll find Belgian marble floors, hand-moulded plaster decorations, and original Tiffany stained-glass windows."
            - paragraph [ref=f722e160]: "Karsh Connection: Famed portrait photographer Yousuf Karsh lived and worked in the hotel for 18 years. Several of his world-famous portraits, including his iconic Roaring Lion photo of Winston Churchill, are displayed in the hotel's public spaces."

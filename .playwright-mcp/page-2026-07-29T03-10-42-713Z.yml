            - paragraph [ref=f722e196]: Located on a former military airbase, the Canada Aviation and Space Museum is recognized as one of the finest aviation museums in the world. It houses a vast collection of more than 130 aircraft and artifacts that chronicle the history of flight, from the pioneer era to modern space exploration. The museum is famous for its Reserve Hangar, which stores many of the collection's most rare and delicate specimens in a massive, open-concept space.
            - paragraph [ref=f722e197]: "Avro Arrow: You can see the largest surviving pieces of the legendary Avro CF-105 Arrow, a source of enduring fascination in Canadian aviation history."
            - paragraph [ref=f722e198]: "Canadarm: The museum proudly displays the original Canadarm used on the Space Shuttle Endeavour, a symbol of Canada's significant contributions to international space programs."

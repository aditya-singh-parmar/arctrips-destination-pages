          - generic [ref=f722e170]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_dktdi7dhl2ym\" w:id=\"14\"/><w:bookmarkEnd w:id=\"14\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">1. Canadian Museum of History" [level=3] [ref=f722e171]
            - paragraph [ref=f722e172]: The Canadian Museum of History is Canada's most visited museum, located on the Gatineau side of the Ottawa River. Its stunning architecture, designed by Douglas Cardinal, features sweeping curves inspired by the Canadian landscape. The museum is dedicated to chronicling the human history of Canada and the cultural diversity of its people.
            - paragraph [ref=f722e173]: "Grand Hall: This iconic space offers a breathtaking view of Parliament Hill across the river and houses the world's largest indoor collection of totem poles."
            - paragraph [ref=f722e174]: "Canadian History Hall: A signature gallery that tells the story of Canada through three distinct eras, featuring over 1,500 authentic artifacts and diverse perspectives."
        - article [ref=f722e175]:

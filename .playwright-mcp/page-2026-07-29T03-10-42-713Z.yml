          - generic [ref=f722e264]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_79mybgpeav99\" w:id=\"30\"/><w:bookmarkEnd w:id=\"30\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">1. Major’s Hill Park" [level=3] [ref=f722e265]
            - paragraph [ref=f722e266]: Major's Hill Park is a premier green space in downtown Ottawa, offering some of the most spectacular views in the city. As the site of Ottawa's first settlement, it provides a tranquil escape with rolling lawns and winding pathways, perfectly situated between the ByWard Market District and the National Gallery of Canada.
            - paragraph [ref=f722e267]: "Scenic Vantage Points: The park is famous for its unobstructed views of the Parliament Buildings, the Ottawa River, and the Fairmont Château Laurier."
            - paragraph [ref=f722e268]: "Seasonal Displays: During the spring, it is a focal point for the Canadian Tulip Festival, while in the fall, the heritage trees provide a vibrant display of autumn colors."
        - article [ref=f722e269]:
          - figure [ref=f722e270]:

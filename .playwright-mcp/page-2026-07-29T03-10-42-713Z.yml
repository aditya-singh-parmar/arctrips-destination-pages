          - generic [ref=f722e234]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_4vd8x6kjrbhn\" w:id=\"25\"/><w:bookmarkEnd w:id=\"25\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">9. Supreme Court of Canada" [level=3] [ref=f722e235]
            - paragraph [ref=f722e236]: The Supreme Court of Canada is the highest court in the country and a striking example of Art Deco architecture in the capital. Perched on a cliff overlooking the Ottawa River, the building's steep copper roofs and grey granite walls harmonize with the nearby Parliament Buildings, creating a powerful presence in the Judicial District.
            - paragraph [ref=f722e237]: "Guided Tours: Visitors can take free guided tours led by law students who explain the inner workings of the Canadian judicial system and the history of the building."
            - paragraph [ref=f722e238]: "Grand Entrance Hall: The interior features a majestic Grand Entrance Hall with marble floors and walls, leading to the main courtroom where most of the country's landmark legal decisions are made."
        - article [ref=f722e239]:
          - figure [ref=f722e240]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_ttan5v389ol\" w:id=\"26\"/><w:bookmarkEnd w:id=\"26\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">10. Watson’s Mill, Ottawa" [ref=f722e241]
          - generic [ref=f722e242]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_ttan5v389ol\" w:id=\"26\"/><w:bookmarkEnd w:id=\"26\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">10. Watson’s Mill" [level=3] [ref=f722e243]
            - paragraph [ref=f722e244]: Located in the charming village of Manotick, Watson's Mill (Museum/Historic Site) is one of the few remaining industrial heritage sites in Ontario that is still operating as a water-powered flour mill. Built in 1860 by Moss Kent Dickinson and Joseph Currier, it remains a centerpiece of local history and a beautiful example of mid-19th-century limestone architecture.
            - paragraph [ref=f722e245]: "Milling Demonstrations: During the summer months, you can watch the massive turbines and grindstones in action as they produce whole wheat flour using traditional water-power methods."
            - paragraph [ref=f722e246]: "Ghost of Ann Currier: Legend has it that the mill is haunted by the ghost of Ann Currier, the wife of one of the founders, who tragically died in a milling accident just months after the mill opened."

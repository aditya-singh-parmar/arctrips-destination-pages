          - generic [ref=f722e358]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_p8td6m2fi1x3\" w:id=\"42\"/><w:bookmarkEnd w:id=\"42\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">2. Central Experimental Farm" [level=3] [ref=f722e359]
            - paragraph [ref=f722e360]: The Central Experimental Farm is a unique 426-hectare National Historic Site located in the heart of Ottawa. Established in 1886, it serves as a working research station and a massive urban green space that combines scientific innovation with picturesque landscapes reminiscent of a British country estate.
            - paragraph [ref=f722e361]: "Dominion Arboretum: This 35-hectare site features more than 2,000 varieties of trees and shrubs. It offers panoramic views of the Rideau Canal and Dow's Lake, with specific microclimates that allow for the growth of magnolias and rhododendrons."
            - paragraph [ref=f722e362]: "Ornamental Gardens: An 8-acre showcase including the Macoun Sunken Garden, a rock garden, and world-renowned collections of peonies, lilies, and Preston lilacs. It is a premier destination for photographers and wedding parties."

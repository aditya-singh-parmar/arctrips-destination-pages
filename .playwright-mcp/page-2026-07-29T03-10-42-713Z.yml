          - generic [ref=f722e366]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_e91lshhty7dn\" w:id=\"43\"/><w:bookmarkEnd w:id=\"43\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Lansdowne Park" [level=3] [ref=f722e367]
            - paragraph [ref=f722e368]: Lansdowne Park is a 40-acre urban destination in the heart of the Glebe neighborhood. It seamlessly blends historic architecture with modern sports facilities and a vibrant retail urban village. Originally the site of the Central Canada Exhibition, it has been transformed into Ottawa's premier gathering place for sports, culture, and community events.
            - paragraph [ref=f722e369]: "Aberdeen Pavilion: Built in 1898, this Cattle Castle is a National Historic Site and the last remaining large-scale exhibition hall of its kind in Canada. It serves as a majestic backdrop for events and the winter farmers' market."
            - paragraph [ref=f722e370]: "TD Place Stadium & Arena: The home turf for the Ottawa REDBLACKS (CFL), Atlético Ottawa (CPL), and the Ottawa 67’s (OHL). It also hosts major concerts and the popular Ottawa Charge (PWHL) games."

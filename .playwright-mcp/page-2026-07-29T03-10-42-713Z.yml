            - paragraph [ref=f722e212]: Reopened in 2017 after a complete transformation, the Canada Science and Technology Museum is a highly interactive facility that celebrates Canada's history of innovation. It combines beloved heritage artifacts with cutting-edge digital technology to create an environment that encourages curiosity and hands-on discovery.
            - paragraph [ref=f722e213]: "Crazy Kitchen: One of the most famous and longest-running exhibits in Ottawa, this tilted room uses optical illusions and physical sensations to challenge your sense of balance and perception."
            - paragraph [ref=f722e214]: "Locomotive Hall: This massive hall features a collection of giant steam locomotives that visitors can walk around and even climb inside, showcasing the power of early Canadian rail travel."

            - img "1. Parliament Hill and Buildings, Ottawa" [ref=f722e74]
          - generic [ref=f722e75]:
            - heading "1. Parliament Hill and Buildings" [level=3] [ref=f722e76]
            - paragraph [ref=f722e77]: Parliament Hill is the the political heart of Canadal, a massive neo-Gothic complex that serves as both the seat of the federal government and the nation’s most prominent public square. While the iconic Centre Block is currently closed for a long-term restoration (projected to last until the early 2030s), the Hill is more active than ever with new immersive experiences and relocated legislative chambers.
            - paragraph [ref=f722e78]: "House of Commons (West Block): Visit the temporary home of the lower chamber. It features a spectacular, modern glass-roofed courtyard built into the historic stone shell of the West Block."
            - paragraph [ref=f722e79]: "Senate (Senate of Canada Building): Located just off the Hill (2 Rideau St.), this former train station is a Beaux-Arts masterpiece. The tour showcases the opulent red-and-gold Senate chamber."
        - article [ref=f722e80]:
          - figure [ref=f722e81]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_sth5yshwpzay\" w:id=\"3\"/><w:bookmarkEnd w:id=\"3\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">2. Rideau Canal National Historic Site, Ottawa" [ref=f722e82]
          - generic [ref=f722e83]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_sth5yshwpzay\" w:id=\"3\"/><w:bookmarkEnd w:id=\"3\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">2. Rideau Canal National Historic Site" [level=3] [ref=f722e84]
            - paragraph [ref=f722e85]: A UNESCO World Heritage Site, the Rideau Canal is an engineering marvel stretching 202 km from Ottawa to Kingston. It is the only 19th-century canal in North America still operating on its original route with most of its original structures intact.
            - paragraph [ref=f722e86]: "Ottawa Locks (Downtown): Located right beside Parliament Hill, this flight of eight massive stone locks connects the canal to the Ottawa River."
            - paragraph [ref=f722e87]: "Watch the Step-Up: In the summer, you can watch Parks Canada staff hand-crank the iron winches to raise and lower boats, a process that hasn't changed since 1832."
        - article [ref=f722e88]:
          - figure [ref=f722e89]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_bgy9qlp83t3w\" w:id=\"4\"/><w:bookmarkEnd w:id=\"4\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Canadian War Museum, Ottawa" [ref=f722e90]
          - generic [ref=f722e91]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_bgy9qlp83t3w\" w:id=\"4\"/><w:bookmarkEnd w:id=\"4\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Canadian War Museum" [level=3] [ref=f722e92]
            - paragraph [ref=f722e93]: The Canadian War Museum, located on the banks of the Ottawa River, stands as a significant landmark in Ottawa. It is one of the world’s most respected museums of military history known not only for its extensive collection of tanks, artillery, and aircraft but also for its powerful, brutally honest depiction of the human experience of conflict.
            - paragraph [ref=f722e94]: "Canadian Experience Galleries: These four main galleries take you on a chronological journey from early Indigenous warfare and the War of 1812 through the World Wars and into the Cold War and modern peacekeeping."
            - paragraph [ref=f722e95]: "LeBreton Gallery: A massive, sun-filled hall of heavy metal featuring scores of tanks, military vehicles, and artillery. You’ll find everything from a First World War ambulance to a T-34 tank and a CF-5 fighter jet suspended from the ceiling."
        - article [ref=f722e96]:
          - figure [ref=f722e97]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_90im2xxy4mur\" w:id=\"5\"/><w:bookmarkEnd w:id=\"5\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">4. National Gallery of Canada, Ottawa" [ref=f722e98]
          - generic [ref=f722e99]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_90im2xxy4mur\" w:id=\"5\"/><w:bookmarkEnd w:id=\"5\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">4. National Gallery of Canada" [level=3] [ref=f722e100]
            - paragraph [ref=f722e101]: The National Gallery of Canada, designed by renowned architect Moshe Safdie, is one of the most significant art institutions in North America. Located in a stunning structure of glass and pink granite, it houses a vast collection that spans from indigenous artifacts and traditional Canadian art to European masterpieces and cutting-edge contemporary works.
            - paragraph [ref=f722e102]: "Iconic Architecture: The building itself is a masterpiece, featuring the Scotiabank Great Hall, a soaring glass pavilion that offers what many consider the best panoramic view of Parliament Hill and the Ottawa River."
            - paragraph [ref=f722e103]: "Maman Sculpture: Visitors are greeted outside by Louise Bourgeois’s famous 30-foot bronze spider sculpture, a world-known landmark that has become a favorite photo spot for tourists."
        - article [ref=f722e104]:
          - figure [ref=f722e105]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_8pk3i2d5f3oj\" w:id=\"6\"/><w:bookmarkEnd w:id=\"6\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Notre Dame Cathedral Basilica, Ottawa" [ref=f722e106]
          - generic [ref=f722e107]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_8pk3i2d5f3oj\" w:id=\"6\"/><w:bookmarkEnd w:id=\"6\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Notre Dame Cathedral Basilica" [level=3] [ref=f722e108]
            - paragraph [ref=f722e109]: Located across from the National Gallery, the Notre Dame Cathedral Basilica is the oldest and largest church in Ottawa. This National Historic Site is a stunning example of Neo-Gothic architecture, famous for its twin silver spires that have defined the city's skyline since the mid-19th century.
            - paragraph [ref=f722e110]: "Breathtaking Interior: While the exterior is impressive, the interior is truly spectacular. It features a deep blue vaulted ceiling studded with thousands of gold stars, intricately carved wooden altars, and over 200 statues of religious figures."
            - paragraph [ref=f722e111]: "Artistic Heritage: Visitors often marvel at the brilliant stained-glass windows that depict various biblical scenes and the massive pipe organ, which is one of the most significant in the country."
        - article [ref=f722e112]:
          - figure [ref=f722e113]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_g74pdnnfbp0r\" w:id=\"7\"/><w:bookmarkEnd w:id=\"7\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">6. Rideau Hall, Ottawa" [ref=f722e114]
          - generic [ref=f722e115]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_g74pdnnfbp0r\" w:id=\"7\"/><w:bookmarkEnd w:id=\"7\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">6. Rideau Hall" [level=3] [ref=f722e116]
            - paragraph [ref=f722e117]: Rideau Hall is the official residence and workplace of the Governor General of Canada. Located on a vast 79-acre estate just minutes from downtown Ottawa, it serves as a site for state ceremonies, international welcomes, and honors for deserving Canadians. Unlike many other world leader residences, the grounds and much of the building are open to the public, fostering a sense of a home for all Canadians.
            - paragraph [ref=f722e118]: "Guided Tours of the Residence: Explore the elegant State rooms where the Governor General fulfills official duties and welcomes dignitaries. You'll see incredible collections of Canadian art and furniture."
            - paragraph [ref=f722e119]: "Grounds and Gardens: Wander through the meticulously landscaped heritage gardens. The estate features over 10,000 trees, including many planted by world leaders and royalty during state visits."
        - article [ref=f722e120]:
          - figure [ref=f722e121]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_hkpch3o8h755\" w:id=\"8\"/><w:bookmarkEnd w:id=\"8\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">7. Canadian Museum of Nature, Ottawa" [ref=f722e122]
          - generic [ref=f722e123]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_hkpch3o8h755\" w:id=\"8\"/><w:bookmarkEnd w:id=\"8\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">7. Canadian Museum of Nature" [level=3] [ref=f722e124]
            - paragraph [ref=f722e125]: Housed in a magnificent building that looks like a castle, the Canadian Museum of Nature is Canada's national natural history and sciences museum. Often referred to as a castle of nature, it combines historic Scottish baronial-style architecture with modern glass additions to create one of the most visually striking landmarks in the city.
            - paragraph [ref=f722e126]: "Fossil Gallery: This world-class exhibit features more than 30 complete dinosaur skeletons and hundreds of fossils, including the iconic horned dinosaurs and a dramatic Death of a Dinosaur scene."
            - paragraph [ref=f722e127]: "Water Gallery: Centered around a massive, 19-meter blue whale skeleton suspended from the ceiling, this gallery explores the diverse life found in Canada's oceans and freshwater systems."
            - paragraph [ref=f722e128]: Good to know. Note that the museum is typically closed on Tuesdays during the off-peak season (September to May), so plan your visit for a different day of the week.
        - article [ref=f722e129]:
          - figure [ref=f722e130]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_8wcdy6u2oiph\" w:id=\"9\"/><w:bookmarkEnd w:id=\"9\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">8. ByWard Market, Ottawa" [ref=f722e131]
          - generic [ref=f722e132]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_8wcdy6u2oiph\" w:id=\"9\"/><w:bookmarkEnd w:id=\"9\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">8. ByWard Market" [level=3] [ref=f722e133]
            - paragraph [ref=f722e134]: ByWard Market is one of Ottawa’s most vibrant and historic areas, offering a blend of fresh food, local goods, and cultural experiences. Established in 1826 by Colonel John By, it has long been a hub for farmers, artisans, and locals, making it one of the oldest and most well-known public markets in Canada. The area is famous for its eclectic mix of open-air farmer stalls, artisanal boutiques, and a high concentration of some of the city's most beloved restaurants and pubs.
            - paragraph [ref=f722e135]: "Culinary Landmarks: No visit is complete without stopping at the original BeaverTails stand to try the world-famous cinnamon and sugar fried pastry."
            - paragraph [ref=f722e136]: "Artisan Shopping: The main market building and surrounding streets are filled with local vendors selling everything from handmade jewelry and maple syrup to fresh seasonal produce and flowers."
        - article [ref=f722e137]:

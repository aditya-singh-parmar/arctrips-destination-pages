          - generic [ref=f722e226]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_7knojdvjwlj1\" w:id=\"24\"/><w:bookmarkEnd w:id=\"24\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">8. Bytown Museum" [level=3] [ref=f722e227]
            - paragraph [ref=f722e228]: The Bytown Museum is located in Ottawa's oldest stone building, originally used as a treasury and storehouse during the construction of the Rideau Canal. It sits at the dramatic meeting point of the canal and the Ottawa River, nestled right between Parliament Hill and the Fairmont Château Laurier.
            - paragraph [ref=f722e229]: "Historical Narrative: The museum provides a deep dive into the early years of Bytown, Ottawa's original name, covering everything from the grueling construction of the canal to the city's evolution into Canada's capital."
            - paragraph [ref=f722e230]: "Unique Setting: Because it is housed in a former commissariat built in 1827, the architecture itself is a primary exhibit, featuring thick limestone walls and original wooden beams that reflect the rugged history of the region."
        - article [ref=f722e231]:
          - figure [ref=f722e232]:

      - generic [ref=f738e593]:
        - article [ref=f738e594]:
          - generic [ref=f738e595]: camping
          - heading "What is the best campground in Tofino?" [level=3] [ref=f738e596]
          - paragraph [ref=f738e597]: Surf Grove is a top choice for Cox Bay surf access. Bella Pacifica is a classic family-friendly beach campground on tinwis/Mackenzie Beach.
        - article [ref=f738e598]:
          - generic [ref=f738e599]: surfing
          - heading "What Is a Rip Current?" [level=3] [ref=f738e600]
          - paragraph [ref=f738e601]: A rip current is a strong flow of water that moves away from shore. It can pull swimmers and surfers farther out. If you get caught in one, do not fight it. Stay calm.
        - article [ref=f738e602]:
          - generic [ref=f738e603]: kayaking
          - heading "Is Tofino Good for Beginner Kayaking?" [level=3] [ref=f738e604]
          - paragraph [ref=f738e605]: Yes, Tofino can be great for beginner kayaking, especially with a guide. Many tours use calm, sheltered waters instead of open surf beaches.
        - article [ref=f738e606]:
          - generic [ref=f738e607]: birding
          - heading "What seabirds can you see in Tofino?" [level=3] [ref=f738e608]
          - paragraph [ref=f738e609]: You may see gulls, cormorants, common murres, rhinoceros auklets, pigeon guillemots, tufted puffins, shearwaters, sea ducks, loons, grebes, black oystercatchers, and bald eagles.
        - article [ref=f738e610]:
          - generic [ref=f738e611]: storm watching
          - heading "Is storm watching in Tofino dangerous?" [level=3] [ref=f738e612]
          - paragraph [ref=f738e613]: It can be dangerous if you get too close to the ocean. Watch from a safe distance, avoid wet rocks, and never turn your back on the waves.
        - article [ref=f738e614]:
          - generic [ref=f738e615]: restaurants
          - heading "What is the best restaurant in Tofino?" [level=3] [ref=f738e616]
          - paragraph [ref=f738e617]: Many visitors consider Wolf in the Fog one of the best restaurants in Tofino because it focuses on local seafood, foraged ingredients, cocktails, and west coast flavor.

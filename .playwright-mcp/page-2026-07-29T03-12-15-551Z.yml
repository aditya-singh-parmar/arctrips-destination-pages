      - generic [ref=f730e62]:
        - text: Campbell River
        - heading "Campbell River" [level=2] [ref=f730e63]
        - paragraph [ref=f730e64]: 14 places, written up one at a time
      - generic [ref=f730e65]:
        - article [ref=f730e66]:
          - figure [ref=f730e67]:
            - img "14. Cold Water Diving, Campbell River" [ref=f730e68]
          - generic [ref=f730e69]:
            - heading "14. Cold Water Diving" [level=3] [ref=f730e70]
            - paragraph [ref=f730e71]: Known as one of the top cold-water diving destinations in the world, Campbell River sits on the edge of the Discovery Passage, where massive tidal currents act as a nutrient-rich conveyor belt for marine life. The result is a vibrant, emerald sea teeming with giants.
            - paragraph [ref=f730e72]: "Meet the Friendly Giants: This is one of the best places to encounter the Giant Pacific octopus and the prehistoric-looking Wolf eel. Despite their intimidating appearance, Wolf eels are often curious and will peek out from rocky dens to watch divers."
            - paragraph [ref=f730e73]: "Explore the HMCS Columbia: Dive a 366-foot decommissioned destroyer escort sunk as an artificial reef. It sits in a protected bay, making it accessible even when the Discovery Passage currents are too strong."
        - article [ref=f730e74]:
          - figure [ref=f730e75]:
            - img "13. Discovery Passage Aquarium, Campbell River" [ref=f730e76]
          - generic [ref=f730e77]:
            - heading "13. Discovery Passage Aquarium" [level=3] [ref=f730e78]
            - paragraph [ref=f730e79]: The Discovery Passage Aquarium is a very special catch-and-release aquarium located right on the Pier. Unlike most aquariums where the fish stay forever, the creatures here are collected from the local waters every spring and then safely returned to the exact same spot in the ocean every fall. This means the animals you see are the same ones swimming right under your feet.
            - paragraph [ref=f730e80]: "Touch Tanks: This is the best part for kids. You can gently touch colorful sea stars, prickly sea urchins, and squishy sea cucumbers. Knowledgeable staff are always there to explain how these creatures live."
            - paragraph [ref=f730e81]: "Local Wonders: See amazing animals from the Discovery Passage, including camouflage-expert octopuses, tiny grunt sculpins, and bright stinging anemones."
        - article [ref=f730e82]:
          - figure [ref=f730e83]:
            - img "12. Maritime Heritage Centre, Campbell River" [ref=f730e84]
          - generic [ref=f730e85]:
            - heading "12. Maritime Heritage Centre" [level=3] [ref=f730e86]
            - paragraph [ref=f730e87]: Just a short drive from the Tyee Spit, the Maritime Heritage Centre (MHC) serves as the cultural anchor of Campbell River’s waterfront. Housed in a former fish processing plant, it preserves the gritty, salty history of the "Salmon Capital of the World."
            - paragraph [ref=f730e88]: "The BCP 45: This is the crown jewel of the centre. It is a beautifully restored 1927 wooden seine fishing boat that was famously featured on the Canadian five-dollar bill from 1972 to 1986. You can actually walk onto the deck and explore the cabin."
            - paragraph [ref=f730e89]: "The Rotary Sea Walk: Use the centre as your starting point for this 6 km paved scenic walk along the shoreline."
        - article [ref=f730e90]:
          - figure [ref=f730e91]:
            - img "11. Tyee Spit (Dick Murphy Park), Campbell River" [ref=f730e92]
          - generic [ref=f730e93]:
            - heading "11. Tyee Spit (Dick Murphy Park)" [level=3] [ref=f730e94]
            - paragraph [ref=f730e95]: Located at the mouth of the Campbell River on Vancouver Island, Tyee Spit (and the adjacent Dick Murphy Park) is a unique geographical finger of land that offers a front-row seat to the region's maritime culture and natural beauty.
            - paragraph [ref=f730e96]: "Watch the Tyee Club Tradition: From July 15 to September 15, see anglers in classic wooden rowboats attempting to catch a 30+ lb Chinook salmon using only traditional, non-motorized methods."
            - paragraph [ref=f730e97]: "Spot Marine Wildlife: Keep an eye on the Discovery Passage for humpback whales, orcas, and harbor seals. The currents here often bring marine life very close to the shore."
        - article [ref=f730e98]:
          - figure [ref=f730e99]:
            - img "10. Quadra Island, Campbell River" [ref=f730e100]
          - generic [ref=f730e101]:
            - heading "10. Quadra Island" [level=3] [ref=f730e102]
            - paragraph [ref=f730e103]: Just a 10-minute ferry ride from downtown Campbell River lies Quadra Island. It is the largest and most populated of the Discovery Islands, but it still feels like a quiet, magical world. Known for its vibrant artist community, hidden beaches, and deep Indigenous history, it is the perfect place to spend a full day exploring.
            - paragraph [ref=f730e104]: "Rebecca Spit Marine Provincial Park: This is the most famous spot on the island. It is a long, thin strip of land with sandy beaches on both sides. It’s perfect for a walk, a picnic, or looking for colorful sea glass and unique driftwood."
            - paragraph [ref=f730e105]: "Cape Mudge Lighthouse: Built in 1898, this beautiful white and red lighthouse still helps guide ships through the dangerous waters. It is a great place to take photos and watch the massive cruise ships pass by."
        - article [ref=f730e106]:
          - figure [ref=f730e107]:
            - img "9. Quinsam River Salmon Hatchery, Campbell River" [ref=f730e108]
          - generic [ref=f730e109]:
            - heading "9. Quinsam River Salmon Hatchery" [level=3] [ref=f730e110]
            - paragraph [ref=f730e111]: To truly understand why Campbell River is the Salmon Capital of the World, you have to visit the Quinsam River Salmon Hatchery. Located just 5 kilometers west of downtown, this large facility helps millions of salmon start their lives before they head out to the Pacific Ocean. It is one of the best places on Vancouver Island to see the incredible life cycle of fish up close.
            - paragraph [ref=f730e112]: "The Interpretive Centre: Start your visit at the visitor center. It has cool 3D models you can touch, underwater photos, and even a microscope where you can look at the tiny bugs that baby salmon eat."
            - paragraph [ref=f730e113]: "Fish Eye View: Walk through the facility to see the indoor and outdoor tanks. Depending on the time of year, you can see tiny \"fry\" (baby fish) swimming around or massive adult salmon waiting to spawn."
        - article [ref=f730e114]:
          - figure [ref=f730e115]:
            - img "8. Strathcona Provincial Park, Campbell River" [ref=f730e116]
          - generic [ref=f730e117]:
            - heading "8. Strathcona Provincial Park" [level=3] [ref=f730e118]
            - paragraph [ref=f730e119]: Established in 1911, Strathcona Provincial Park is the oldest provincial park in British Columbia. This massive 250,000-hectare wilderness is the backyard of Vancouver Island, featuring rugged, snow-capped peaks, alpine meadows, and crystal-clear lakes. It is a true haven for hikers, photographers, and anyone looking to escape into the wild.
            - paragraph [ref=f730e120]: While Strathcona is the backyard of Campbell River, it is actually located outside the city limits. To reach the main park entrance, you will drive west on Highway 28. It is roughly a 45 to 60-minute drive (about 48 km) to the Buttle Lake area.
            - paragraph [ref=f730e121]: Even though it requires a bit of travel, it is considered a must-do for anyone staying in Campbell River for more than a couple of days. Most visitors use the city as their base camp, heading into the park for the day to see its world-famous waterfalls and alpine scenery before returning to town for dinner.
        - article [ref=f730e122]:
          - figure [ref=f730e123]:
            - img "7. Ripple Rock Trail, Campbell River" [ref=f730e124]
          - generic [ref=f730e125]:
            - heading "7. Ripple Rock Trail" [level=3] [ref=f730e126]
            - paragraph [ref=f730e127]: The Ripple Rock Trail is the most famous hike in Campbell River. It is an 8-kilometer round-trip trail that leads you through a beautiful forest to a high cliff. From the top, you can look down at the Seymour Narrows, a skinny piece of ocean where the water moves as fast as a river.
            - paragraph [ref=f730e128]: "The Big View: The best part of this hike is the lookout at the end. You can see for miles over the ocean and the mountains of Vancouver Island and the mainland."
            - paragraph [ref=f730e129]: "Whirlpools and Rapids: Look down at the water below. Because the ocean is squeezed between the land, you can see massive whirlpools and white water, especially when the tide is changing."
        - article [ref=f730e130]:
          - figure [ref=f730e131]:
            - img "6. Museum at Campbell River, Campbell River" [ref=f730e132]
          - generic [ref=f730e133]:
            - heading "6. Museum at Campbell River" [level=3] [ref=f730e134]
            - paragraph [ref=f730e135]: The Museum at Campbell River is widely considered one of the best local museums in Canada. It isn't just a building full of old things; it is a storytelling center that brings the wild history of the coast to life. From the spiritual traditions of the First Nations to the dangerous days of early logging and fishing, this museum is a must-see to truly understand the spirit of the town.
            - paragraph [ref=f730e136]: "The Mask Gallery: Enter a stunning, darkened room filled with ceremonial masks carved by the Kwakwaka’wakw people. The masks are beautiful and sometimes a little spooky, representing spirits from the sea and sky."
            - paragraph [ref=f730e137]: "The Ripple Rock Explosion: Watch a short, exciting film about the 1958 blast that blew up an underwater mountain. It was so big it was broadcast live on TV across the country."
        - article [ref=f730e138]:
          - figure [ref=f730e139]:
            - img "5. Rotary Seawalk, Campbell River" [ref=f730e140]
          - generic [ref=f730e141]:
            - heading "5. Rotary Seawalk" [level=3] [ref=f730e142]
            - paragraph [ref=f730e143]: The Rotary Seawalk is a beautiful, paved pathway that stretches for 13 kilometers along the edge of the ocean. It is the favorite place for locals to walk their dogs, go for a run, or simply sit on a bench and watch the waves. It connects the southern part of the city all the way to the downtown area.
            - paragraph [ref=f730e144]: "Walk, Bike, or Blade: The path is wide and flat, making it perfect for a long bike ride or a slow stroll with a stroller."
            - paragraph [ref=f730e145]: "The Big Rock: Along the way, you will see a massive boulder sitting on the beach. Local legend says it was once a giant grizzly bear that was turned to stone by the Great Spirit. It is a famous spot for a photo."
        - article [ref=f730e146]:
          - figure [ref=f730e147]:
            - img "4. Fishing Charters, Campbell River" [ref=f730e148]
          - generic [ref=f730e149]:
            - heading "4. Fishing Charters" [level=3] [ref=f730e150]
            - paragraph [ref=f730e151]: Dubbed the "Salmon Capital of the World," Campbell Riveroriginally became famous for its Tyee salmon derby in rowboats . It is not the place it was 50 years ago but there are certain times in the summer when you can catch salmon.
            - paragraph [ref=f730e152]: "Target the Big Five: Depending on the season, you can fish for all five species of Pacific Salmon: Chinook (King), Coho (Silver), Pink, Sockeye, and Chum. The Chinook is the ultimate prize, often reaching weights of over 30 lbs. The numbers of fish here are not what they once were but you can still have a shot at a Chinook salmon or every second year Pinks (smallest of the Pacific salmon) can be caught. In October its possible to catch Chum salmon."
            - paragraph [ref=f730e153]: "Expert Guiding: Your charter includes a professional local guide who knows the secret spots, the best lures to use, and how to read the complex tides of the Passage."
        - article [ref=f730e154]:
          - figure [ref=f730e155]:
            - img "3. Discovery Fishing Pier, Campbell River" [ref=f730e156]
          - generic [ref=f730e157]:
            - heading "3. Discovery Fishing Pier" [level=3] [ref=f730e158]
            - paragraph [ref=f730e159]: Canada’s first saltwater fishing pier is a favorite spot for both locals and visitors. Stretching 180 meters out into the deep waters of Discovery Passage, it feels like you are walking right into the middle of the ocean without ever leaving the land.
            - paragraph [ref=f730e160]: "Catch a Big One: You don't need a boat to go fishing here. People catch huge Chinook and Coho salmon right from the pier. If you didn't bring gear, you can rent a rod and buy tackle at the pier office."
            - paragraph [ref=f730e161]: "The Famous Ice Cream: Almost everyone who visits the pier stops at the concession stand. They are famous for serving massive soft-serve ice cream cones that are sometimes bigger than your head."
        - article [ref=f730e162]:
          - figure [ref=f730e163]:
            - img "2. Whale & Wildlife Discovery Tours, Campbell River" [ref=f730e164]
          - generic [ref=f730e165]:
            - heading "2. Whale & Wildlife Discovery Tours" [level=3] [ref=f730e166]
            - paragraph [ref=f730e167]: Campbell River is one of the best places in the world to see marine giants. Because the city sits right next to narrow ocean passages filled with fish, it acts like a highway for hungry whales and other amazing animals.
            - paragraph [ref=f730e168]: "Whale Watching: Look for massive Humpback whales splashing and Orcas (Killer Whales) hunting in pods. You might even hear them sing if your boat has an underwater microphone called a hydrophone."
            - paragraph [ref=f730e169]: "Dolphin Encounters: Pacific White-Sided Dolphins often travel in huge groups. They love to jump and play in the wake behind the tour boats."
        - article [ref=f730e170]:
          - figure [ref=f730e171]:
            - img "1. Elk Falls Provincial Park, Campbell River" [ref=f730e172]
          - generic [ref=f730e173]:
            - heading "1. Elk Falls Provincial Park" [level=3] [ref=f730e174]
            - paragraph [ref=f730e175]: Just a ten-minute drive from downtown, Elk Falls Provincial Park is the most popular nature spot in Campbell River. It is famous for its massive trees, a rushing river, and a world-class suspension bridge that gives you a bird's-eye view of a thundering waterfall.
            - paragraph [ref=f730e176]: "The Suspension Bridge: Walk 60 meters across a deep canyon. It hangs high above the Campbell River and offers a thrilling view of the falls."
            - paragraph [ref=f730e177]: "The Waterfall: Watch the water drop 25 meters down into a rocky gorge. It is loudest and most powerful in the spring when the snow melts."

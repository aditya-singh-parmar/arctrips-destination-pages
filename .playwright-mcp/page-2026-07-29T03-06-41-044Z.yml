        - generic [ref=f702e300]:
          - heading "Ladysmith - Transfer Beach" [level=3] [ref=f702e301]
          - paragraph [ref=f702e302]: Transfer Beach Park is a central community hub in Ladysmith, located approximately 23 kilometers south of Nanaimo, roughly a 20-minute drive via the Trans-Canada Highway. Known for having some of the warmest ocean swimming waters north of San Francisco, this sprawling waterfront park offers a blend of natural beauty and extensive family amenities.
          - paragraph [ref=f702e303]: "The Amphitheatre: A stunning seaside amphitheatre serves as a primary venue for live concerts, community festivals, and even logger sports during the summer months."
          - paragraph [ref=f702e304]: "Family Recreation: The park is exceptionally well-equipped for children, featuring a large playground, a seasonal water park (spray park), and expansive open green spaces perfect for frisbee or soccer."

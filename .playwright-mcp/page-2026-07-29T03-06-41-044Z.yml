      - article [ref=f702e283]:
        - figure [ref=f702e284]:
          - img "Nanaimo Bar Trail, Nanaimo" [ref=f702e285]
        - generic [ref=f702e286]:
          - heading "Nanaimo Bar Trail" [level=3] [ref=f702e287]
          - paragraph [ref=f702e288]: The Nanaimo Bar Trail is a self-guided culinary tour featuring over 30 stops, each offering a unique take on the city's legendary no-bake dessert. The experience ranges from classic chocolate-and-custard squares to creative interpretations like deep-fried rolls, cocktails, and even themed spa treatments.
          - paragraph [ref=f702e289]: The Nanaimo Museum serves as the official starting point for many, housing the official recipe by Joyce Hardcastle and a permanent exhibit on the dessert's history. You can even sit on the museum's signature Nanaimo Bar-shaped benches for a photo.
          - paragraph [ref=f702e290]: "Classic Creations: Red's Bakery is a local favorite for the traditional version, often cited for its perfect balance of a rich cocoa-crumb base and velvety custard."

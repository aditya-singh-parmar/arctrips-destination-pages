        - generic [ref=f683e865]:
          - heading "Top-Rated Tour Operators" [level=3] [ref=f683e866]
          - paragraph [ref=f683e867]: Eagle Wing Tours is a carbon-neutral industry leader known for its high-performance catamarans and strong educational focus. Their tours typically last 3 to 3.5 hours, though they also offer extended Wildlife Safaris during peak season. Vessel options include open-air catamarans for a more immersive experience and semi-covered boats for added protection from the elements. Onboard naturalists provide detailed scientific insight into the local ecosystem and marine conservation, and guests are given access to high-end optics and binoculars.
          - paragraph [ref=f683e868]: Prince of Whales is a long-established operator that received a Viator Experience Award in 2023. It features the Salish Sea Eclipse, a custom-built, environmentally friendly catamaran with three viewing levels. Tour options include the standard 3.5-hour whale-watching trip as well as full-day Ultimate Day Tours connecting Victoria and Vancouver. Guests can choose between high-speed Zodiacs for a more thrilling ride or large, stable catamarans with multiple viewing decks. A complimentary professional photo package is often included, featuring high-quality images from the specific trip. Their flagship vessel is designed for both environmental efficiency and passenger comfort across all age groups.
          - paragraph [ref=f683e869]: Orca Spirit Adventures is known for offering both high-speed Zodiac adventures and comfortable covered boat tours. The company is carbon-neutral and includes a hydrophone on its Zodiac tours, allowing passengers to listen to whale calls in real time. Tours usually last around 3 hours, with both morning and afternoon departures, as well as seasonal sunset tours during the summer. Their fleet includes open-air Zodiacs and large heated cruisers with indoor seating and washrooms. Covered boat options also make them a comfortable choice for winter excursions.

            - paragraph [ref=f683e699]: Victoria is world-renowned as a whale-watching destination due to its unique location at the center of the Salish Sea. This rich ecosystem supports a high concentration of marine life, with peak sightings occurring between May and October, where success rates for spotting whales often exceed 95%.
            - paragraph [ref=f683e700]: Seasonal Highlights and Wildlife
            - paragraph [ref=f683e701]: "The waters around Victoria are home to several iconic species that can be spotted throughout the year:"
        - article [ref=f683e702]:

          - generic [ref=f683e667]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_djxrr6xka0rb\" w:id=\"21\"/><w:bookmarkEnd w:id=\"21\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Fan Tan Alley" [level=3] [ref=f683e668]
            - paragraph [ref=f683e669]: Fan Tan Alley is a record-breaking destination known as the narrowest street in Canada. While it originated in the 19th century as a hub for gambling and opium dens within Victoria’s Chinatown National Historic Site, it has transformed into a vibrant, high-character micro-district. Measuring only 0.9 meters (about 3 feet) at its tightest point, the alley offers an immediate sense of intrigue, with red-brick walls that seem to lean inward, housing a curated collection of local boutiques and art galleries.
            - paragraph [ref=f683e670]: "Curated Shopping: The alley is a sanctuary for independent business. Stop at the Fan Tan Home & Style for unique decor, or the Umbrellatorium & Canery, a shop entirely dedicated to umbrellas and walking sticks that fits the alley's whimsical vibe perfectly."
            - paragraph [ref=f683e671]: "Whimsical Treats: Look for Kid Sister Ice Cream, a local favorite that serves artisanal, small-batch scoops. It’s the perfect place to grab a cone and lean against the historic brickwork to soak in the atmosphere."
        - article [ref=f683e672]:
          - figure [ref=f683e673]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_4zfytq6qyfqt\" w:id=\"22\"/><w:bookmarkEnd w:id=\"22\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">6. St. Andrew's Cathedral, Victoria" [ref=f683e674]
          - generic [ref=f683e675]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_4zfytq6qyfqt\" w:id=\"22\"/><w:bookmarkEnd w:id=\"22\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">6. St. Andrew's Cathedral" [level=3] [ref=f683e676]
            - paragraph [ref=f683e677]: St. Andrew's Cathedral is Victoria’s Catholic landmark, a stunning example of High Victorian Gothic architecture that has served as the seat of the Diocese of Victoria since 1892. While the city's skyline has modernized around it, the cathedral remains a dramatic presence with its asymmetrical towers and intricate brickwork, modeled after the medieval churches of Europe. It serves as a spiritual and architectural sanctuary in the heart of the downtown core, offering a high-impact interior that contrasts the busy commercial streets outside.
            - paragraph [ref=f683e678]: "Altar and Sanctuary: The centerpiece of the interior is a beautifully carved altar, often highlighted by reviewers for its intricate detail and historical significance. The sanctuary’s open, airy design allows for a clear view of the liturgical art that defines the space."
            - paragraph [ref=f683e679]: "Stained Glass Masterpieces: The cathedral features an impressive collection of stained glass windows that filter the light into vibrant hues across the nave. These windows are frequently cited by visitors as the highlight of the interior architecture."

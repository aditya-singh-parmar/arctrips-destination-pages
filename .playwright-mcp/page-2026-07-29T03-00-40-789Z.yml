          - 'heading "The Peak Season: Summer (July, August)" [level=3] [ref=f683e515]'
          - generic [ref=f683e516]:
            - paragraph [ref=f683e517]: This is the most reliable window for sightseeing, offering the highest number of sunny days and the clearest visibility for mountain-top viewpoints.
            - paragraph [ref=f683e518]: "The Vibe: Vibrant, bustling, and blue."
            - paragraph [ref=f683e519]: "The Butchart Gardens: Summer is the only time to see the evening illuminations, where the gardens are transformed by thousands of hidden lights."
        - article [ref=f683e520]:
          - 'heading "The City of Gardens Season: Spring (April, June)" [level=3] [ref=f683e521]'
          - generic [ref=f683e522]:
            - paragraph [ref=f683e523]: If your primary goal is to see why Victoria is famous for its flora, this is the essential time to visit.
            - paragraph [ref=f683e524]: "The Vibe: Fresh, colorful, and lush."
            - paragraph [ref=f683e525]: "Cherry Blossoms: In April, the city streets (especially near Beacon Hill Park and View Street) turn into tunnels of pink petals."

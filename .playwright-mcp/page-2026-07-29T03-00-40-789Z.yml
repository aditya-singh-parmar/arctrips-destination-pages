          - generic [ref=f683e713]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_tgatxahb864y\" w:id=\"28\"/><w:bookmarkEnd w:id=\"28\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">4. Dallas Road Beach" [level=3] [ref=f683e714]
            - paragraph [ref=f683e715]: Dallas Road Beach is a rugged stretch of shoreline that serves as the city’s favorite outdoor social hub. While many beaches are tucked-away coves, this beach is actually a series of pebbly inlets and rocky outcrops linked by the iconic 4km Dallas Road waterfront path. It offers an immediate connection to the wild Salish Sea, providing a high-energy atmosphere where you can watch paragliders soar from the bluffs, kite surfers battle the waves, and cruise ships glide toward the horizon against the backdrop of the snow-capped Olympic Mountains.
            - paragraph [ref=f683e716]: "Spiral Beach: Located at the foot of Cook Street, this is the most popular sandy/pebbly spot. It’s famous for its dramatic driftwood piles and the steep, winding staircase that gives it its name."
            - paragraph [ref=f683e717]: "Off-Leash Social: Dallas Road is arguably the most famous dog-walking spot in Canada. The grassy bluffs between the road and the path are an off-leash paradise where locals gather daily. Even if you don’t have a dog, the pup-watching here is world-class."
        - article [ref=f683e718]:
          - figure [ref=f683e719]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_f4xq5vjg4zl0\" w:id=\"29\"/><w:bookmarkEnd w:id=\"29\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Mount Tolmie Park, Victoria" [ref=f683e720]
          - generic [ref=f683e721]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_f4xq5vjg4zl0\" w:id=\"29\"/><w:bookmarkEnd w:id=\"29\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Mount Tolmie Park" [level=3] [ref=f683e722]
            - paragraph [ref=f683e723]: Mount Tolmie Park is a 45-acre hilltop sanctuary that serves as the city’s premier 360-degree lookout. While many local peaks require a grueling trek, this mountain is actually a highly accessible municipal park that allows you to drive or walk to the very top. It offers an immediate, panoramic connection to the Greater Victoria landscape, providing a serene atmosphere where you can watch the city transition from day to night against a massive backdrop of the Olympic Mountains, the San Juan Islands, and the distant, snowy peak of Mount Baker.
            - paragraph [ref=f683e724]: "Concrete Summit: The most famous feature is the large, flat concrete slab at the peak, a relic of a WWII defense system. It’s the ultimate stage for the best views in the city, perfect for spinning in a circle to see everything from the University of Victoria to the downtown skyline."
            - paragraph [ref=f683e725]: "Garry Oak Meadows: Wander through the protected meadows to see one of the rarest ecosystems in Canada. In the spring, these rocky slopes are covered in camas lilies and wildflowers, offering a peaceful, low-impact nature walk right in the middle of a residential neighborhood."
        - article [ref=f683e726]:
          - figure [ref=f683e727]:

            - paragraph [ref=f683e661]: Hatley Park National Historic Site is Victoria’s Edwardian estate, a sprawling 565-acre sanctuary that serves as one of the most complete and intact examples of an early 20th-century bonanza property. Built for coal baron James Dunsmuir, the estate is centered around the majestic Hatley Castle, a 40-room stone mansion that looks so much like a cinematic fantasy it has served as the filming location for the X-Men film series. It offers a stunning blend of architectural grandeur and ecological diversity, ranging from formal heritage gardens to old-growth forests and saltwater marshes.
            - paragraph [ref=f683e662]: "Formal Gardens: Explore the trio of world-class gardens: the Italian Garden with its classic statuary, the Rose Garden featuring heritage varieties, and the serene Japanese Garden. Visitors often note that the Japanese Garden, designed with the help of Isaburo Kishida, is one of the most authentic and tranquil spots on the property."
            - paragraph [ref=f683e663]: "Hatley Castle Interior: While the castle currently serves as the administrative hub for Royal Roads University, you can take a guided tour to see the grand oak-paneled rooms and the stunning fireplace."
        - article [ref=f683e664]:
          - figure [ref=f683e665]:

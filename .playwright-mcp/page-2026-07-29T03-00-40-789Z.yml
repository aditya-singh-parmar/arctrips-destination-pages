          - generic [ref=f683e705]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_wziyl2tpmucd\" w:id=\"27\"/><w:bookmarkEnd w:id=\"27\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Abkhazi Garden" [level=3] [ref=f683e706]
            - paragraph [ref=f683e707]: Abkhazi Garden, a 1.4-acre heritage estate, is a hidden gem in Victoria, offering a peaceful escape with its stunning blend of natural beauty and rich history. This place's history dates back to 1946 when Prince and Princess Abkhazi, exiled from Russia, began creating the garden, transforming a rough landscape into a beautiful space over decades. The garden is known for its unique design, combining traditional European garden elements with the wild charm of the Pacific Northwest.
            - paragraph [ref=f683e708]: "Teahouse: Located in the original residence, the teahouse is famous for its elevated Four-Season Afternoon Tea. Visitors frequently mention the exceptional quality of the local ingredients and the stunning views over the garden from the dining room."
            - paragraph [ref=f683e709]: "Glaciated Rock Formations: The garden is built directly into a sloping rock face. Look for the way the Prince used these natural features to create rooms, using the rock as both a structural element and a backdrop for rare rhododendrons."

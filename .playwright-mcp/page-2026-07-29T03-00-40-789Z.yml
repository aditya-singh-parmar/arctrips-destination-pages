    - generic [ref=f683e83]:
      - generic [ref=f683e84]:
        - text: Best Places for Birdwatching in Victoria
        - heading "Best Places for Birdwatching in Victoria" [level=2] [ref=f683e85]
        - paragraph [ref=f683e86]: 11 places, written up one at a time
      - generic [ref=f683e87]:
        - article [ref=f683e88]:
          - figure [ref=f683e89]:
            - img "Swan Lake Christmas Hill Nature Sanctuary, Victoria" [ref=f683e90]
          - generic [ref=f683e91]:
            - heading "Swan Lake Christmas Hill Nature Sanctuary" [level=3] [ref=f683e92]
            - paragraph [ref=f683e93]: "Swan Lake Christmas Hill Nature Sanctuary is one of the best birdwatching spots in Victoria. It has two main habitats: the wetland around Swan Lake and the rocky oak meadow on Christmas Hill."
            - paragraph [ref=f683e94]: The lake area is good for ducks, great blue herons, marsh birds, songbirds, woodpeckers, and hummingbirds. The trails are easy to follow, and the boardwalks and viewing areas make it a great beginner birding spot.
            - paragraph [ref=f683e95]: Christmas Hill adds a different habitat, with Garry oak meadow, rocky slopes, wildflowers, and views across the city.
            - paragraph [ref=f683e96]: Good to know. Bring binoculars and move slowly around the lake. Many birds hide in reeds, shrubs, and tree branches.
        - article [ref=f683e97]:
          - figure [ref=f683e98]:
            - img "Esquimalt Lagoon, Victoria" [ref=f683e99]
          - generic [ref=f683e100]:
            - heading "Esquimalt Lagoon" [level=3] [ref=f683e101]
            - paragraph [ref=f683e102]: Esquimalt Lagoon is one of the top birdwatching places near Victoria. It is a federal Migratory Bird Sanctuary in Colwood, just west of Victoria.
            - paragraph [ref=f683e103]: The lagoon has shallow tidal water, a long beach spit, sheltered resting areas, and rich feeding grounds. It is especially important from fall through spring, when many waterfowl use the lagoon.
            - paragraph [ref=f683e104]: You may see swans, ducks, geese, gulls, great blue herons, shorebirds, and other water birds. It is also a beautiful place for photography because you can see birds with ocean, lagoon, driftwood, and mountain views.
            - paragraph [ref=f683e105]: Good to know. Do not feed birds. Feeding wildlife can cause health problems and change natural behavior.
        - article [ref=f683e106]:
          - figure [ref=f683e107]:
            - img "Dallas Road Waterfront, Victoria" [ref=f683e108]
          - generic [ref=f683e109]:
            - heading "Dallas Road Waterfront" [level=3] [ref=f683e110]
            - paragraph [ref=f683e111]: Dallas Road is one of the easiest places to watch birds near downtown Victoria. The waterfront path follows the coast with views over the Strait of Juan de Fuca.
            - paragraph [ref=f683e112]: You can scan the water for seabirds and ducks, look along the shoreline for gulls and shorebirds, and watch for bald eagles flying overhead. On windy days, seabirds may be easier to spot from shore.
            - paragraph [ref=f683e113]: Good to know. Bring binoculars. Many birds sit farther offshore than you expect.
        - article [ref=f683e114]:
          - figure [ref=f683e115]:
            - img "Clover Point, Victoria" [ref=f683e116]
          - generic [ref=f683e117]:
            - heading "Clover Point" [level=3] [ref=f683e118]
            - paragraph [ref=f683e119]: Clover Point is a strong birdwatching stop along the Victoria waterfront. It sticks out into the water, which makes it useful for scanning the ocean.
            - paragraph [ref=f683e120]: You may see gulls, cormorants, shorebirds, ducks, loons, grebes, and sometimes larger seabird movement offshore.
            - paragraph [ref=f683e121]: Good to know. This is a good place to bird from the car or near the parking area when the weather is windy or rainy.
        - article [ref=f683e122]:
          - figure [ref=f683e123]:
            - img "Ogden Point Breakwater, Victoria" [ref=f683e124]
          - generic [ref=f683e125]:
            - heading "Ogden Point Breakwater" [level=3] [ref=f683e126]
            - paragraph [ref=f683e127]: Ogden Point Breakwater gives birdwatchers a better view into deeper water near Victoria Harbour. It is a good place to scan for cormorants, gulls, ducks, loons, grebes, and other seabirds.
            - paragraph [ref=f683e128]: The breakwater also gives great views back toward the city and across the water.
            - paragraph [ref=f683e129]: Good to know. It can be windy and exposed. Dress warmly and stay aware of waves and weather.
        - article [ref=f683e130]:
          - figure [ref=f683e131]:
            - img "Beacon Hill Park, Victoria" [ref=f683e132]
          - generic [ref=f683e133]:
            - heading "Beacon Hill Park" [level=3] [ref=f683e134]
            - paragraph [ref=f683e135]: Beacon Hill Park is a large urban park near downtown Victoria. It has ponds, lawns, gardens, trees, rocky areas, and coastal edges.
            - paragraph [ref=f683e136]: This makes it good for many types of birds. You may see ducks, geese, herons, woodpeckers, sparrows, juncos, towhees, hummingbirds, and other songbirds. The park is also known for its peacocks, which are easy to spot but are not native wild birds.
            - paragraph [ref=f683e137]: "Beacon Hill Park is best for:"
            - paragraph [ref=f683e138]: Good to know. This is one of the easiest birding spots if you are staying downtown.
        - article [ref=f683e139]:
          - figure [ref=f683e140]:
            - img "Panama Flats, Victoria" [ref=f683e141]
          - generic [ref=f683e142]:
            - heading "Panama Flats" [level=3] [ref=f683e143]
            - paragraph [ref=f683e144]: Panama Flats is a seasonal wetland and open habitat area in Saanich. It is a good place to look for ducks, geese, shorebirds, swallows, sparrows, raptors, and other open-area birds.
            - paragraph [ref=f683e145]: It can be especially interesting during migration and wet seasons when water levels create good feeding areas.
            - paragraph [ref=f683e146]: Good to know. Wear shoes that can handle mud, especially after rain.
        - article [ref=f683e147]:
          - figure [ref=f683e148]:
            - img "Witty’s Lagoon, Victoria" [ref=f683e149]
          - generic [ref=f683e150]:
            - heading "Witty’s Lagoon" [level=3] [ref=f683e151]
            - paragraph [ref=f683e152]: Witty’s Lagoon is a beautiful birdwatching spot in Metchosin, west of Victoria. It has lagoon habitat, beach, forest, shoreline, and trails.
            - paragraph [ref=f683e153]: At low tide, birds feed along the mudflats and shoreline. You may see herons, ducks, gulls, shorebirds, eagles, kingfishers, and forest birds.
            - paragraph [ref=f683e154]: "Witty’s Lagoon is best for:"
            - paragraph [ref=f683e155]: Good to know. Check tide times before visiting if shorebirds are your main goal.
        - article [ref=f683e156]:
          - figure [ref=f683e157]:
            - img "Cattle Point, Victoria" [ref=f683e158]
          - generic [ref=f683e159]:
            - heading "Cattle Point" [level=3] [ref=f683e160]
            - paragraph [ref=f683e161]: Cattle Point is a small rocky coastal area in Oak Bay. It is a good quick birding stop, especially for shorebirds and seabirds.
            - paragraph [ref=f683e162]: Look for turnstones, gulls, cormorants, ducks, and birds feeding around rocky edges.
            - paragraph [ref=f683e163]: Good to know. Move slowly around rocky areas and give shorebirds space.
        - article [ref=f683e164]:
          - figure [ref=f683e165]:
            - img "Mount Douglas Park, Victoria" [ref=f683e166]
          - generic [ref=f683e167]:
            - heading "Mount Douglas Park" [level=3] [ref=f683e168]
            - paragraph [ref=f683e169]: Mount Douglas Park is good for forest and hilltop birdwatching. The lower trails and forest edges may have woodpeckers, towhees, chickadees, juncos, wrens, and other songbirds.
            - paragraph [ref=f683e170]: The summit can be good for scanning for raptors, including hawks and bald eagles.
            - paragraph [ref=f683e171]: "Mount Douglas is best for:"
            - paragraph [ref=f683e172]: Good to know. Early morning is often best for songbirds.
        - article [ref=f683e173]:
          - figure [ref=f683e174]:
            - img "Goldstream Provincial Park, Victoria" [ref=f683e175]
          - generic [ref=f683e176]:
            - heading "Goldstream Provincial Park" [level=3] [ref=f683e177]
            - paragraph [ref=f683e178]: Goldstream Provincial Park is best known for salmon runs in fall, but it is also a good birdwatching area. When salmon are in the river, bald eagles may gather to feed.
            - paragraph [ref=f683e179]: The park also has forest birds, river birds, and wetland habitat.
            - paragraph [ref=f683e180]: Quick Victoria Birdwatching Guide
            - paragraph [ref=f683e181]: Good to know. During salmon season, follow park rules and stay out of closed areas.

          - generic [ref=f683e689]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_tb301w3lludt\" w:id=\"24\"/><w:bookmarkEnd w:id=\"24\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">1. Scenic Marine Route" [level=3] [ref=f683e690]
            - paragraph [ref=f683e691]: The Scenic Marine Route in Victoria offers one of the most breathtaking drives along Vancouver Island’s southern coast. Stretching from the Inner Harbour through the posh neighborhoods of Oak Bay and up toward the Saanich Peninsula, this route offers an immediate connection to the Pacific Ocean. While many coastal drives are obscured by trees or buildings, the Marine Route provides unobstructed, 360-degree views of the Olympic Mountains and the Salish Sea, making it the ultimate way to see Victoria’s wild side without ever leaving the comfort of your car.
            - paragraph [ref=f683e692]: "Dallas Road Waterfront: This is the iconic first leg of the journey. Parallel to Beacon Hill Park, this stretch features a long, paved walkway atop the bluffs. Pull over to watch the paragliders catch the wind or descend the staircases to the driftwood-strewn beaches below."
            - paragraph [ref=f683e693]: "Clover Point Loop: A paved peninsula that juts out into the ocean. It’s a premier spot for kite-flying and storm-watching. It remains the best place to sit in your car with a coffee and watch the massive international cruise ships glide past."

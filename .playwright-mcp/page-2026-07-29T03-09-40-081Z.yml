          - heading "Do you need a car in Whistler in winter?" [level=3] [ref=f717e1625]
          - paragraph [ref=f717e1627]: Not always. If you stay near Whistler Village, many restaurants, shops, lifts, rentals, and tour meeting points are walkable. A car is helpful for side trips, but winter driving requires more planning.
        - article [ref=f717e1628]:

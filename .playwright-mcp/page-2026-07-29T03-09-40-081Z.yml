            - heading "Lost Lake Biking" [level=3] [ref=f717e553]
            - paragraph [ref=f717e554]: Lost Lake is one of the easiest places to enjoy biking close to Whistler Village. The area has paved access through the Valley Trail, plus forest trails nearby for riders who want a little more adventure.
            - paragraph [ref=f717e555]: Casual riders can bike to the lake for swimming, a picnic, or a short loop. More confident riders can explore nearby cross-country trails.

          - generic [ref=f717e518]:
            - paragraph [ref=f717e519]: The Creekside Zone gives riders another access point and a different style of terrain. It is popular with riders who want longer descents, a little more space, and a different base area from the main village.
            - paragraph [ref=f717e520]: This zone is better for riders who already feel comfortable on mountain bike trails.

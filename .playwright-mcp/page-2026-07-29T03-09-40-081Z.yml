    - generic [ref=f717e1009]:
      - generic [ref=f717e1010]:
        - text: World-Known Landmarks
        - heading "World-Known Landmarks" [level=2] [ref=f717e1011]
        - paragraph [ref=f717e1012]: 10 places, written up one at a time
      - generic [ref=f717e1013]:
        - article [ref=f717e1014]:
          - figure [ref=f717e1015]:
            - img "1. Whistler Blackcomb, Whistler" [ref=f717e1016]
          - generic [ref=f717e1017]:
            - heading "1. Whistler Blackcomb" [level=3] [ref=f717e1018]
            - paragraph [ref=f717e1019]: Whistler Blackcomb is the undisputed heavyweight of North American ski resorts, covering over 8,000 acres across two massive mountains. It is a high-alpine kingdom where you can ride a single lift from mossy rainforests at the bottom to windy glaciers at the top.
            - paragraph [ref=f717e1020]: What makes this place famous is the incredible variety. With over 200 runs, 16 bowls, and 3 glaciers, the area is so big that you can explore for a week and still find new spots. Whether you are watching pros on steep slopes or teaching kids in the Magic Castle, the scale of these mountains is something you have to see to believe.
            - paragraph [ref=f717e1021]: "Location & Access: The resort is divided into two main bases: Whistler Village (access via the Whistler Village Gondola or Fitzsimmons Express) and the Upper Village (access via the Blackcomb Gondola). Both mountains are seamlessly connected mid-mountain by the Peak 2 Peak Gondola."
        - article [ref=f717e1022]:
          - figure [ref=f717e1023]:
            - img "2. Peak 2 Peak Gondola, Whistler" [ref=f717e1024]
          - generic [ref=f717e1025]:
            - heading "2. Peak 2 Peak Gondola" [level=3] [ref=f717e1026]
            - paragraph [ref=f717e1027]: The Peak 2 Peak is a high-speed gondola system that links the alpine hubs of Whistler Mountain and Blackcomb Mountain, letting skiers and sightseers glide across the deep valley between them in roughly 11 minutes. The full span stretches about 4.4 km (2.7 miles), and it famously holds the world record for the longest unsupported span between two cable towers, 3.024 km.
            - paragraph [ref=f717e1028]: "Even more jaw-dropping is the height: at its highest point, the gondola hangs about 436 metres (1,427 feet) above the valley floor, delivering a true floating over the wilderness feeling. On a clear day, you can see the volcanic spire of Black Tusk, the sprawling Fitzsimmons Creek below, and the ancient glaciers that carved this landscape."
            - paragraph [ref=f717e1029]: "Location & Access: The Peak 2 Peak terminals are located at Roundhouse Lodge (Whistler Mountain) and Rendezvous Lodge (Blackcomb Mountain). You reach them by taking the main gondolas up from Whistler Village (Whistler Gondola) or the Upper Village (Blackcomb Gondola). The Peak 2 Peak Gondola is open year-round, but weather conditions can affect operations, particularly during the winter months."
        - article [ref=f717e1030]:
          - figure [ref=f717e1031]:
            - img "3. Olympic Rings (Whistler Olympic Plaza), Whistler" [ref=f717e1032]
          - generic [ref=f717e1033]:
            - heading "3. Olympic Rings (Whistler Olympic Plaza)" [level=3] [ref=f717e1034]
            - paragraph [ref=f717e1035]: The Olympic Rings at the Whistler Olympic Plaza are the definitive symbol of the town’s 2010 Winter Games legacy. While they are technically a photo-op, the plaza they sit in is really the town square of the Village. It’s a massive, open-air green space (or snow space, depending on when you visit) where the energy of the town shifts from adrenaline-fueled mountain sports to community chill.
            - paragraph [ref=f717e1036]: What makes this spot special is the backdrop. You’ve got the giant rings in the foreground and the towering peaks of Whistler and Blackcomb looming right behind them. It’s the kind of place where you’ll see kids running on the grass in the summer, or locals playing a game of pond hockey on the outdoor rink in the winter.
            - paragraph [ref=f717e1037]: "Location & Access: You’ll find the rings at the north end of the Village Stroll in Whistler Olympic Plaza. If you’re walking from the main gondola base, just follow the Stroll all the way past the shops; you can’t miss the giant open field and the mountain views."
        - article [ref=f717e1038]:
          - figure [ref=f717e1039]:
            - img "4. Whistler Inukshuk, Whistler" [ref=f717e1040]
          - generic [ref=f717e1041]:
            - heading "4. Whistler Inukshuk" [level=3] [ref=f717e1042]
            - paragraph [ref=f717e1043]: The Whistler Inukshuk is much more than just a stone statue; it is a powerful symbol of Northern culture and a permanent legacy of the 2010 Winter Games. Standing tall at the very top of the world, this traditional Inuit stone landmark was historically used as a navigational aid or to mark sacred ground. Here in the Coast Mountains, it serves as a silent guardian overlooking the vast, snow-capped wilderness.
            - paragraph [ref=f717e1044]: What makes this particular Inukshuk so special is its placement. Perched on a rocky ridge at the summit, it creates a dramatic contrast between man-made heritage and the raw, jagged peaks of the Garibaldi Ranges. Standing next to it, you get a humbling sense of scale, it feels like you’re at the edge of the map. On a bluebird day, the grey stones pop against the deep blue sky, making it arguably the most meaningful photo-op in the entire province.
            - paragraph [ref=f717e1045]: "Location & Access: The most famous Inukshuk is located at the summit of Whistler Mountain, right near the top of the Peak Express Chairlift. To get there, you’ll take the Whistler Village Gondola to the Roundhouse Lodge, walk a short distance to the Peak Express, and ride the open-air chair to the very top."
        - article [ref=f717e1046]:
          - figure [ref=f717e1047]:
            - img "5. Brandywine Falls Provincial Park, Whistler" [ref=f717e1048]
          - generic [ref=f717e1049]:
            - heading "5. Brandywine Falls Provincial Park" [level=3] [ref=f717e1050]
            - paragraph [ref=f717e1051]: Brandywine Falls is that wow moment you usually find on the cover of a travel magazine. It’s a spectacular 70-metre (230-foot) waterfall that plunges over a sheer basalt cliff into a perfectly round volcanic bowl. What makes it so striking isn't just the height, but the way the water has carved through layers of ancient lava flows over thousands of years, leaving behind a rugged, prehistoric-looking canyon.
            - paragraph [ref=f717e1052]: It’s the ultimate low effort, high reward stop. A flat, easy 15-minute walk through a lush forest brings you to a viewing platform that makes you feel tiny against the roar of the water. On a sunny afternoon, you’ll almost always see a rainbow shimmering in the mist at the base of the falls, hence the name Brandywine. It’s the perfect place to stretch your legs and get your first real taste of the Sea to Sky wilderness.
            - paragraph [ref=f717e1053]: "Location & Access: You’ll find the entrance right off Highway 99, about 15 minutes (20km) south of Whistler Village. There is a large, well-marked parking lot, and the trail to the falls is a wide, gravel path that is easy for almost anyone to navigate."
        - article [ref=f717e1054]:
          - figure [ref=f717e1055]:
            - img "6. The Black Tusk, Whistler" [ref=f717e1056]
          - generic [ref=f717e1057]:
            - heading "6. The Black Tusk" [level=3] [ref=f717e1058]
            - paragraph [ref=f717e1059]: The Black Tusk is the unmistakable crown of the Garibaldi Ranges, a jagged, black volcanic spire that looks like a giant tooth jutting out from a sea of white glaciers. It’s easily the most recognizable landmark in the Whistler skyline. This isn't just another mountain; it’s the core of an ancient volcano that erupted roughly 170,000 years ago. Over time, the softer outer rock eroded away, leaving behind this dramatic, dark basalt plug that stands in stark contrast to the surrounding green valleys and blue alpine lakes.
            - paragraph [ref=f717e1060]: For the Squamish People, the Tusk is known as the Landing Place of the Thunderbird. It carries a heavy sense of mystery and power that you feel the moment you see it from a distance. Whether you are staring at it from a gondola or standing on its base, the Tusk feels ancient, imposing, and completely wild. It’s the ultimate North Star for hikers and photographers in the region.
            - paragraph [ref=f717e1061]: "Location & Access: The Black Tusk is located within Garibaldi Provincial Park. To see it up close, most hikers start at the Rubble Creek trailhead, about a 25-minute drive south of Whistler. To see it without the 11-hour hike, simply take the Whistler Village Gondola to the summit, it looms large on the southern horizon from almost any high-alpine viewpoint."
        - article [ref=f717e1062]:
          - figure [ref=f717e1063]:
            - img "7. Whistler Sliding Centre, Whistler" [ref=f717e1064]
          - generic [ref=f717e1065]:
            - heading "7. Whistler Sliding Centre" [level=3] [ref=f717e1066]
            - paragraph [ref=f717e1067]: The Whistler Sliding Centre is where the high-octane legacy of the 2010 Winter Olympics truly lives on. Tucked onto the side of Blackcomb Mountain, this is the fastest ice track in the world, a serpentine ribbon of concrete and ice where athletes hit speeds that most of us only reach on the highway. It’s a place of incredible intensity; standing beside the track while a sled thunders past is an experience that vibrates right through your chest.
            - paragraph [ref=f717e1068]: What’s truly unique about the Sliding Centre is that it isn’t just for pros. It is one of the very few Olympic venues globally where regular people can actually jump in a sled and experience the g-force for themselves. Whether you’re watching world-class lugers train or bracing yourself for a bobsleigh run, there’s an electric, competitive energy here that you won’t find anywhere else in the valley.
            - paragraph [ref=f717e1069]: "Location & Access: You’ll find the Centre at 4910 Glacier Lane, just above the Upper Village. You can reach it via a quick 5-minute drive or by taking the Excalibur Gondola (which is free for foot passengers) to the first stop and walking about 10 minutes up the hill."
        - article [ref=f717e1070]:
          - figure [ref=f717e1071]:
            - img "8. Whistler Mountain Bike Park, Whistler" [ref=f717e1072]
          - generic [ref=f717e1073]:
            - heading "8. Whistler Mountain Bike Park" [level=3] [ref=f717e1074]
            - paragraph [ref=f717e1075]: Whistler Mountain Bike Park is a world-renowned biking destination that draws enthusiasts from around the globe. When the snow melts, the ski runs transform into a massive, gravity-fed playground with over 80 kilometers of trails winding through four distinct mountain zones. It’s a high-energy landscape where you’ll see everyone from world-class professionals catching massive air to families tentatively navigating their first forest loamy paths.
            - paragraph [ref=f717e1076]: What makes the park legendary is its flow. The trail builders here are artists; they’ve created everything from Easy Tiger, a gentle introduction to downhill, to A-Line, arguably the most famous jump trail on the planet. Even if you don’t ride, standing at the base and watching riders fly off the final drops into the Village is a spectator sport in its own right. It’s loud, dusty, and absolutely exhilarating, a place where the adrenaline of winter is kept alive all summer long.
            - paragraph [ref=f717e1077]: "Location & Access: The main hub is at the Whistler Village Base, where you load the Fitzsimmons Express or the Whistler Village Gondola. You can also access the higher Creekside Zone via the Creekside Gondola, which offers a quieter, local feel with some of the best technical trails in the park."
        - article [ref=f717e1078]:
          - figure [ref=f717e1079]:
            - img "9. Cloudraker Skybridge, Whistler" [ref=f717e1080]
          - generic [ref=f717e1081]:
            - heading "9. Cloudraker Skybridge" [level=3] [ref=f717e1082]
            - paragraph [ref=f717e1083]: The Cloudraker Skybridge, often simply called the Whistler Suspension Bridge, is one of those take your breath away experiences that stays with you long after you’ve headed back down the mountain. Stretching 130 metres (427 feet) from Whistler Peak to the West Ridge, it hangs right over the legendary Whistler Bowl. It’s not just a bridge; it’s a high-altitude thrill ride where you’re suspended in the open air, feeling the mountain breeze and staring down into a dizzying alpine abyss.
            - paragraph [ref=f717e1084]: What makes it truly unique is the engineering and the sheer height. Standing at over 2,000 metres (nearly 7,000 feet) above sea level, you get a 360-degree view that includes the jagged Tantalus Range and the icy glaciers of Blackcomb. The bridge has a slight sway to it, which adds to the adrenaline, but it’s the Raven’s Eye, a cantilevered viewing platform at the far end, that really steals the show. It extends out over the cliff edge, making you feel like you’re literally floating above the mountain peaks.
            - paragraph [ref=f717e1085]: "Location & Access: The bridge is located at the very top of Whistler Mountain. To get there, take the Whistler Village Gondola to the Roundhouse Lodge, then walk to the Peak Express Chairlift. Once you get off the chair at the summit, the bridge entrance is just a few steps away."
        - article [ref=f717e1086]:
          - figure [ref=f717e1087]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:sz w:val=\"22\"/><w:szCs w:val=\"22\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_aizq8sddshqw\" w:id=\"24\"/><w:bookmarkEnd w:id=\"24\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">10. Joffre Lakes Provincial Park, Whistler" [ref=f717e1088]
          - generic [ref=f717e1089]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:sz w:val=\"22\"/><w:szCs w:val=\"22\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_aizq8sddshqw\" w:id=\"24\"/><w:bookmarkEnd w:id=\"24\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">10. Joffre Lakes Provincial Park" [level=3] [ref=f717e1090]
            - paragraph [ref=f717e1091]: Joffre Lakes is the kind of place that looks like a Photoshop filter come to life. It’s a string of three glacier-fed lakes, Lower, Middle, and Upper, each one a more impossible shade of turquoise than the last. This vibrant Gatorade blue comes from silt (rock flour) suspended in the glacial meltwater, reflecting the sunlight in a way that’s almost blindingly bright. It’s a rugged, high-alpine landscape where ancient glaciers hang off the peaks right above you.
            - paragraph [ref=f717e1092]: What makes this hike so iconic is the progression. You start in the dense, cool forest and work your way up to the Matier Glacier, which feeds the lakes. It’s a steep climb in sections, but the moment you break through the trees at Middle Lake and see that famous log floating in the blue water, all the effort feels worth it. It’s a quintessential British Columbia experience, raw and beautiful.
            - paragraph [ref=f717e1093]: "Location & Access: Joffre Lakes is located about an hour’s drive (60km) north of Whistler, just past the town of Pemberton. The trailhead has a large parking lot right off Highway 99 (the Sea to Sky Highway). Unlike the Village attractions, you’ll definitely need a car or a booked shuttle to get here."

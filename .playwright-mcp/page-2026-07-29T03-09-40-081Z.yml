          - generic [ref=f717e524]:
            - paragraph [ref=f717e525]: Garbanzo takes riders higher up the mountain. Trails here are longer, rougher, and more demanding than the lower mountain. Riders should be comfortable with sustained downhill riding, braking, body position, and fatigue.
            - paragraph [ref=f717e526]: "Best for: Intermediate to advanced riders, longer descents, more physical riding."
        - article [ref=f717e527]:
          - heading "Peak Zone and Top of the World" [level=3] [ref=f717e528]
          - generic [ref=f717e529]:
            - paragraph [ref=f717e530]: The Peak Zone gives riders a high-alpine experience with big mountain views. Top of the World is one of Whistler’s most iconic alpine bike trails, but it is not for beginners. The terrain is exposed, rocky, and more serious than lower park trails.
            - paragraph [ref=f717e531]: "Best for: Advanced and expert riders, alpine views, bucket-list Whistler biking."
            - paragraph [ref=f717e532]: Yes, beginners can bike in Whistler, but they should choose the right type of riding.
            - paragraph [ref=f717e533]: Good to know. Do not judge bike park trails by ski-run colors alone. A green downhill bike trail can still feel harder than a normal paved or gravel ride.

          - heading "Fitzsimmons Zone" [level=3] [ref=f717e511]
          - generic [ref=f717e512]:
            - paragraph [ref=f717e513]: The Fitzsimmons Zone is the original and most famous part of the bike park. It is close to Whistler Village and is where many riders start. This zone has beginner-friendly progression trails, classic flow trails, technical trails, and some of the most famous lines in the park.
            - paragraph [ref=f717e514]: It is a good place to build confidence, repeat laps, and learn how the bike park works.

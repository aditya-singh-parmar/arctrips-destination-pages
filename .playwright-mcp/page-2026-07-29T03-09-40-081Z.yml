            - heading "Crankworx Whistler" [level=3] [ref=f717e568]
            - paragraph [ref=f717e569]: Crankworx Whistler is the biggest mountain biking event in Whistler and one of the most important bike festivals in the world. It is usually held in summer, most often in July or August.
            - paragraph [ref=f717e570]: The event brings together professional riders, amateur riders, bike fans, brands, demos, races, Kidsworx events, and a high-energy village atmosphere. It is not just one race.
            - paragraph [ref=f717e571]: "Crankworx includes several styles of mountain bike competition, such as slopestyle, downhill, dual slalom, pump track, enduro, and other gravity-focused events. These events show different sides of mountain biking: big tricks, technical downhill speed, head-to-head racing, tight cornering, stamina, and bike handling."
            - paragraph [ref=f717e572]: Good to know. Whistler gets very busy during Crankworx. Book lodging, bike rentals, restaurants, and activities early. Some trails, village areas, and bike park zones may also be affected by events, so check the current schedule before planning your riding days.
        - article [ref=f717e573]:

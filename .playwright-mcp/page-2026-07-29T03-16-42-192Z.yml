    - generic [ref=f747e119]:
      - generic [ref=f747e120]:
        - generic [ref=f747e121]:
          - text: Why here
          - heading "The whales are not visiting the town" [level=2] [ref=f747e122]
          - paragraph [ref=f747e123]: They are working a stretch of coast that happens to have two towns on it. This is what that stretch is, and why it holds them.
        - link "All nine subjects in Tofino" [ref=f747e124] [cursor=pointer]:
          - /url: things-to-do.html
      - generic [ref=f747e125]:
        - generic [ref=f747e126]:
          - img "Several whale blows hanging over the water below a dark forested hillside" [ref=f747e128]
          - generic [ref=f747e129]:
            - generic [ref=f747e130]: Clayoquot Sound
            - generic [ref=f747e132]: Open Pacific, sheltered inlets, islands
            - generic [ref=f747e134]: 321 blocks of writing
          - heading "The whales come for the food, and the food is here" [level=3] [ref=f747e135]
          - paragraph [ref=f747e136]: "Tofino sits beside Clayoquot Sound, a rich coastal area with ocean, islands, beaches, rainforest and rocky shorelines. It is one of the best places on Vancouver Island to see wild animals, and the reason is structural: the shelf here pushes cold water up, the cold water feeds the herring and the krill, and everything larger follows."
          - paragraph [ref=f747e137]: Gray whales pass on their way from the calving lagoons in Baja California to the feeding grounds off Alaska. Humpbacks stay to feed through the summer. Orcas turn up when they turn up. The same water holds sea lions, harbour seals, sea otters, bald eagles, and a seabird passage twice a year.
          - paragraph [ref=f747e138]: Forty minutes south, Ucluelet faces Barkley Sound and the Broken Group Islands. That is the quieter half of the same shelf, and it is where five of the six places in this guide sit.

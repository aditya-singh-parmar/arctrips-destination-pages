    - generic [ref=f747e672]:
      - generic [ref=f747e674]:
        - text: Boats and cost
        - heading "Three kinds of boat, one honest note about price" [level=2] [ref=f747e675]
        - paragraph [ref=f747e676]: Tours run March to October, most of them two and a half to three hours. Operators pick the route on the day from weather, swell and the last few days of sightings, so nobody sells you a fixed itinerary.
      - generic [ref=f747e677]:
        - generic [ref=f747e678]:
          - heading "Covered boat" [level=3] [ref=f747e679]
          - paragraph [ref=f747e680]: Better for comfort, families and cooler days. You are out of the wind and the spray, and you can sit down for three hours without regretting it.
          - paragraph [ref=f747e681]:
            - generic [ref=f747e682]: Best for
            - text: Families, cool days, long trips
        - generic [ref=f747e683]:
          - heading "Zodiac" [level=3] [ref=f747e684]
          - paragraph [ref=f747e685]: Faster, open air, and a rougher ride. Better for travellers who want the adventure version and are happy in a survival suit on the open Pacific.
          - paragraph [ref=f747e686]:
            - generic [ref=f747e687]: Best for
            - text: Speed and open air
        - generic [ref=f747e688]:
          - heading "Small or private charter" [level=3] [ref=f747e689]
          - paragraph [ref=f747e690]: Better for photographers and for groups who want the boat to stop where they want it to stop. Fewer people at the rail, more say in the route.
          - paragraph [ref=f747e691]:
            - generic [ref=f747e692]: Best for
            - text: Photographers and groups
      - generic [ref=f747e693]:
        - generic [ref=f747e694]:
          - heading "What it costs" [level=3] [ref=f747e695]
          - paragraph [ref=f747e696]: We do not publish an operator price until we have paid it ourselves. Every Tofino and Ucluelet operator sets its own rate by boat type, season and group size, and a number copied from a website in February is wrong by June.
          - paragraph [ref=f747e697]: "The one number we do stand behind is the stay: 134 places in Tofino, from $320 a night, and 158 more in Ucluelet forty minutes down the road."
        - generic [ref=f747e698]:
          - heading "Booking on Arc Trips" [level=3] [ref=f747e699]
          - paragraph [ref=f747e700]: Whale watching is not bookable here yet. We are signing operators in both towns and will not list one until we have been out on the boat.
          - paragraph [ref=f747e701]: "Until then the honest path is the one below: leave an address and we will write once, on the day the first boat goes live. The stays are live now."
          - paragraph [ref=f747e702]:
            - link "Get told when boats go live" [ref=f747e703] [cursor=pointer]:
              - /url: "#notify"
    - generic [ref=f747e707]:
      - generic [ref=f747e709]:
        - text: What to bring
        - heading "Six things, and one of them is the difference" [level=2] [ref=f747e710]
        - paragraph [ref=f747e711]: The water is colder than the forecast you read at breakfast, and it is always windier at the rail than on the dock.
      - generic [ref=f747e712]:
        - generic [ref=f747e713]:
          - term [ref=f747e714]: Binoculars
          - definition [ref=f747e715]: "The single biggest upgrade to a day from shore. Straight out of the Wild Pacific Trail write-up: bring binoculars, wildlife may be far from shore."
        - generic [ref=f747e716]:
          - term [ref=f747e717]: A waterproof shell
          - definition [ref=f747e718]: Tofino records rain on 22 days in January and still 9 in July. A shell is never the wrong call here.
        - generic [ref=f747e719]:
          - term [ref=f747e720]: Warm layers under it
          - definition [ref=f747e721]: The August average high is 18.6 degrees on land. On the water, moving, it is not.
        - generic [ref=f747e722]:
          - term [ref=f747e723]: Something for motion
          - definition [ref=f747e724]: The open Pacific has swell most days. If you are prone to it, take something before you board rather than after.
        - generic [ref=f747e725]:
          - term [ref=f747e726]: A national park pass
          - definition [ref=f747e727]: You may need one if you stop in Pacific Rim National Park Reserve, which is most of the coast between the two towns.
        - generic [ref=f747e728]:
          - term [ref=f747e729]: Sunglasses and sunscreen
          - definition [ref=f747e730]: Flat grey water reflects hard, and the three hours you spend squinting at the horizon are the three hours you get burned.
    - generic [ref=f747e732]:
      - generic [ref=f747e734]:
        - text: Safety
        - heading "Four rules, each one lifted from a place in this guide" [level=2] [ref=f747e735]
        - paragraph [ref=f747e736]: Nothing here is theoretical. Every line is the note attached to one of the six write-ups above.
      - generic [ref=f747e737]:
        - generic [ref=f747e738]:
          - heading "Stay off wet rock" [level=3] [ref=f747e739]
          - paragraph [ref=f747e740]: At Amphitrite Point, stay on the marked paths and away from wet rock. Large waves can be dangerous, and the ones that reach the path arrive without a set warning you.
        - generic [ref=f747e741]:
          - heading "Give wildlife the distance" [level=3] [ref=f747e742]
          - paragraph [ref=f747e743]: In Pacific Rim National Park Reserve, give wildlife space, store food properly and never feed animals. Black bears work the same shoreline you are walking.
        - generic [ref=f747e744]:
          - heading "The harbour is a workplace" [level=3] [ref=f747e745]
          - paragraph [ref=f747e746]: In Ucluelet Harbour, watch for boat traffic and keep a safe distance from the docks and the working areas. The fleet is not on holiday.
        - generic [ref=f747e747]:
          - heading "Boat access means boat access" [level=3] [ref=f747e748]
          - paragraph [ref=f747e749]: The Broken Group Islands are reachable only by water. Plan ahead if you are paddling or camping, and treat the crossing as the serious part of the day.

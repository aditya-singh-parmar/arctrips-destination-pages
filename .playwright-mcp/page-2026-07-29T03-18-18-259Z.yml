            - heading "What you are actually looking for" [level=2] [ref=f755e88]
            - paragraph [ref=f755e89]: "Tofino is one of the best places on Vancouver Island to see wild animals. It sits beside Clayoquot Sound, a rich coastal area with ocean, islands, beaches, rainforest and rocky shorelines. Almost everything on a tour boat here comes down to that geography: deep water close in, shallow feeding ground behind the islands, and a harbour you can leave from in almost any weather."
            - paragraph [ref=f755e90]: Three whales carry most trips. Gray whales come past on migration in spring, humpbacks work the feeding water through summer and into September, and orcas turn up often enough to be worth hoping for and not often enough to be worth planning around. Alongside them you get sea otters, sea lions hauled out on the rocks, harbour seals, river otters, bald eagles, great blue herons and more seabirds than most people expect.
            - paragraph [ref=f755e91]: Bears are a separate trip. Operators run them into the calm inlet water behind town, around Grice Bay, and they are timed to a low tide rather than to a time of day, because that is when black bears come down to turn rocks over on the flats. If you want both, book them on different days. They are not the same boat and they are not the same water.
            - generic [ref=f755e92]:
              - generic [ref=f755e93]: Good to know
              - paragraph [ref=f755e94]: Nothing on the water is guaranteed. Operators pick routes on the day from weather, swell and recent sightings, and the honest ones will tell you when the sea state means a shorter loop closer in.
          - figure "Orcas travelling in a line inside the islands. They turn up often enough to hope for, and not often enough to plan a trip around." [ref=f755e95]:
            - img "Four orcas travelling in a line, dorsal fins above flat green water with dark forest behind them" [ref=f755e97]
          - generic [ref=f755e99]:
            - heading "When to go" [level=2] [ref=f755e100]
            - paragraph [ref=f755e101]: Tours run eight months of the twelve, one of the longest seasons on this coast. That is why March in Tofino books out while the rain is still falling.
            - generic [ref=f755e103]:
              - heading "When should you go?" [level=3] [ref=f755e104]
              - paragraph [ref=f755e105]: Tours run March to October. Go in April or May for gray whales, August or September for humpbacks. November to February the boats stop and the storms take over.

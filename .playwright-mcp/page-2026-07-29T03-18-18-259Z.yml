          - generic [ref=f755e268]:
            - heading "Blows, backs and flukes" [level=2] [ref=f755e269]
            - paragraph [ref=f755e270]: Most people spend the first half hour of a tour looking for the wrong thing. Whales do not pose. What you get is a sequence, and once you can read it you stop missing things.
            - paragraph [ref=f755e271]: A blow means the whale has surfaced to breathe. It is often the first sign people see during whale watching, and on a still morning you can hear it before anyone points. Whales show their backs when they surface to breathe, travel or prepare for another dive. That long dark roll is the most common thing anyone sees all day.
            - figure "Three blows hanging against the hillside. At any real distance the blow is the whole sighting, not the whale." [ref=f755e272]:
              - img "Several whale blows hanging in the air above dark water, lit against a steep forested hillside" [ref=f755e274]
            - paragraph [ref=f755e276]: If a whale lifts its tail fluke before disappearing, it usually means the whale is making a deeper dive.
            - generic [ref=f755e277]:
              - paragraph [ref=f755e278]: A fluke is not a goodbye. It usually means a deeper dive, and the whale may surface again nearby after several minutes, or come up a long way off.
              - generic [ref=f755e279]: Marit Sandoval, on the water off Clayoquot Sound
            - paragraph [ref=f755e280]: So when the boat cuts its engine and everyone goes quiet, that is the skipper counting. Gray whales feeding in the shallows will often stay in one patch of water for an hour. Humpbacks travelling will not. The difference between the two is the difference between a five minute stop and the rest of your trip.
            - figure "A gray whale surfacing close in to the beach. Grays feed in shallow water, which is why they are the ones people occasionally get from land." [ref=f755e281]:
              - img "The mottled grey back of a gray whale surfacing in shallow water a short way off a gravel beach, with a blow above it" [ref=f755e283]
            - paragraph [ref=f755e285]: Gray whales pass here as they travel north from winter breeding and calving areas in Baja California, Mexico, toward northern feeding grounds near Alaska and the Arctic. The main spring migration period is usually March to May. Early sightings may happen in February, and some whales may still be present into early summer, which is the overlap that makes May the strongest single month on this coast.
          - figure "One blow, one back, at the range most sightings actually happen. Half of a three hour tour looks like this, and it is the half people forget to watch." [ref=f755e286]:
            - img "One tall blow and a dark whale back on flat water in front of a long forested shoreline" [ref=f755e288]
          - generic [ref=f755e290]:
            - heading "Booking, and what to take" [level=2] [ref=f755e291]
            - paragraph [ref=f755e292]: "Tours here fill first at the two ends of the season: the second half of March, when the gray whales are coming back through and the Pacific Rim Whale Festival is on, and the middle of August. Between those, a day or two of notice is usually enough. Sailings do get cancelled for swell, so leave a spare morning in the trip if you can only do this once."
            - list [ref=f755e293]:
              - listitem [ref=f755e294]: Layers, and a windproof shell. It is consistently colder on the water than on the sand, in every month of the year.
              - listitem [ref=f755e295]: Binoculars. The single biggest upgrade to the day, on the boat and off it.
              - listitem [ref=f755e296]: Motion sickness tablets, taken before boarding. Not after.
              - listitem [ref=f755e297]: A camera you can hold with one hand. The other hand is for the rail.
              - listitem [ref=f755e298]: Sunglasses, even in the rain. Glare off grey water is what tires your eyes out by hour two.
              - listitem [ref=f755e299]: A national park pass if the same day takes you down to Long Beach, Wickaninnish or Florencia Bay.
            - paragraph [ref=f755e300]: Whale watching tours are not bookable through Arc Trips yet. Below is where that stands, and where the stays are in the meantime.
          - generic [ref=f755e301]:
            - heading "Questions people ask" [level=2] [ref=f755e302]
            - paragraph [ref=f755e303]: The ten that come up most, answered short. They came out of the whale watching guides for both towns.
            - generic [ref=f755e304]:
              - generic [ref=f755e305]:
                - heading "What is the best month for whale watching in Tofino?" [level=3] [ref=f755e306]
                - paragraph [ref=f755e307]: March to May is one of the best times for gray whales. Summer and early fall can also be great for humpbacks, gray whales, orcas, sea otters, sea lions, and other wildlife.
              - generic [ref=f755e308]:
                - heading "Can you see whales in Tofino without a tour?" [level=3] [ref=f755e309]
                - paragraph [ref=f755e310]: Yes, sometimes whales can be seen from shore. But a guided boat tour gives you a much better chance of seeing whales and learning about them.
              - generic [ref=f755e311]:
                - heading "What is the best time of day for whale watching?" [level=3] [ref=f755e312]
                - paragraph [ref=f755e313]: There is no perfect time every day. Tour operators choose routes based on weather, swell, and recent sightings. Morning trips may have calmer water, but wildlife can be active at different times.
              - generic [ref=f755e314]:
                - heading "Is a zodiac or covered boat better for whale watching?" [level=3] [ref=f755e315]
                - paragraph [ref=f755e316]: A covered boat is better for comfort, families, and cooler days. A zodiac is better for travelers who want a faster, more open-air adventure.
              - generic [ref=f755e317]:
                - heading "What does it mean when a whale blows?" [level=3] [ref=f755e318]
                - paragraph [ref=f755e319]: A blow means the whale has surfaced to breathe. It is often the first sign people see during whale watching.
              - generic [ref=f755e320]:
                - heading "What does a whale tail mean?" [level=3] [ref=f755e321]
                - paragraph [ref=f755e322]: If a whale lifts its tail fluke before disappearing, it usually means the whale is making a deeper dive.
              - generic [ref=f755e323]:
                - heading "Does seeing a fluke mean the whale is leaving?" [level=3] [ref=f755e324]
                - paragraph [ref=f755e325]: Not always. A fluke usually means the whale is diving deeper. It may surface again nearby after several minutes, or it may come up farther away.
              - generic [ref=f755e326]:
                - heading "How long are Ucluelet whale watching tours?" [level=3] [ref=f755e327]
                - paragraph [ref=f755e328]: Many tours are about 2.5 to 3 hours, but timing can vary. Always check the operator's current tour details.
              - generic [ref=f755e329]:
                - heading "When is the gray whale migration in Ucluelet?" [level=3] [ref=f755e330]
                - paragraph [ref=f755e331]: The main spring migration period is usually March to May. Early sightings may happen in February, and some whales may still be present into early summer.
              - generic [ref=f755e332]:
                - heading "Where is the best place to see whales from shore in Ucluelet?" [level=3] [ref=f755e333]
                - paragraph [ref=f755e334]: The Wild Pacific Trail and Amphitrite Point Lighthouse area are among the best shore-based places to scan for whales. Bring binoculars.

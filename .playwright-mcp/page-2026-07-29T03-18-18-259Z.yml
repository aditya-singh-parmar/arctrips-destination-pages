          - generic [ref=f755e173]:
            - heading "Zodiac or covered boat" [level=2] [ref=f755e174]
            - paragraph [ref=f755e175]: This is the only real decision you have to make, and it changes the day more than the operator does.
            - list [ref=f755e176]:
              - listitem [ref=f755e177]: A covered boat is better for comfort, families and cooler days. There is a heated cabin to retreat into, a washroom, and somewhere to put a camera down. You sit higher, which helps you spot a blow at distance.
              - listitem [ref=f755e178]: A zodiac is better for travellers who want a faster, more open-air adventure. You are lower, closer to the water and colder, and the boat can turn and hold in places a bigger hull will not. Nobody on a zodiac stays dry in a swell.
              - listitem [ref=f755e179]: A smaller tour or private charter is the photographers' answer, and the answer for a group that wants the skipper's attention rather than a commentary.
            - paragraph [ref=f755e180]: Many tours are about two and a half to three hours, but timing can vary, and the exact length is the operator's to set. There is no perfect time of day either. Morning trips may have calmer water, but wildlife can be active at different times, and a good skipper will chase the report rather than the clock.
            - paragraph [ref=f755e181]: If you are travelling with someone who gets seasick, take the covered boat and take the tablets before boarding rather than after. The swell out past the islands is longer and slower than it looks from the dock.

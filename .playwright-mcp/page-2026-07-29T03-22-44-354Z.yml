        - heading "Beaches in Tofino" [level=1] [ref=f770e49]
        - paragraph [ref=f770e50]: Tofino is famous for its beaches. They are wide, wild, and full of west coast beauty. You will find soft sand, big waves, driftwood, rainforest, rocky points, and long views of the Pacific Ocean.

          - heading "Chesterman Beach" [level=3] [ref=f770e65]
          - paragraph [ref=f770e66]: Chesterman Beach is one of the most loved beaches in Tofino. It is long, sandy, and easy to enjoy. It is close to town and popular with walkers, surfers, families, and photographers.
          - paragraph [ref=f770e67]: Chesterman Beach is one of the most loved beaches in Tofino. It is long, sandy, and easy to enjoy. It is close to town and popular with walkers, surfers, families, and photographers.
          - paragraph [ref=f770e68]: Chesterman is split into North Chesterman and South Chesterman. At low tide, you can walk across the sandspit, also called a tombolo, toward Frank Island. This is one of the most scenic beach walks in Tofino.

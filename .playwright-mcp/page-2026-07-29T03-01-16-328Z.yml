        - generic [ref=f684e575]:
          - generic [ref=f684e576]: Beaches, Tofino
          - heading "Can you swim in Tofino?" [level=3] [ref=f684e577]
          - paragraph [ref=f684e578]: Yes, but the water is cold and the ocean can be strong. Most people wear wetsuits. There are no lifeguards, so be careful.
        - generic [ref=f684e579]:
          - generic [ref=f684e580]: Whale watching, Ucluelet
          - heading "When do whale watching tours run in Ucluelet?" [level=3] [ref=f684e581]
          - paragraph [ref=f684e582]: Many tours run from March to October, but exact dates depend on the operator, the weather and the season.
        - generic [ref=f684e583]:
          - generic [ref=f684e584]: Storm watching, Tofino
          - heading "Is storm watching in Tofino dangerous?" [level=3] [ref=f684e585]
          - paragraph [ref=f684e586]: It can be, if you get too close. Watch from a safe distance, avoid wet rocks, and never turn your back on the waves.
        - generic [ref=f684e587]:
          - generic [ref=f684e588]: Surfing, Tofino
          - heading "Can beginners surf in Tofino?" [level=3] [ref=f684e589]
          - paragraph [ref=f684e590]: Yes. Tofino is one of the best places in Canada for a first surf lesson. Start with a surf school so you learn the right beach, gear and safety steps.
        - generic [ref=f684e591]:
          - generic [ref=f684e592]: Restaurants, Tofino
          - heading "Is Tofino expensive for food?" [level=3] [ref=f684e593]
          - paragraph [ref=f684e594]: It can be, because it is remote and popular. Mixing food trucks, cafes and takeout with one or two sit-down meals keeps it sensible.
        - generic [ref=f684e595]:
          - generic [ref=f684e596]: Camping, Tofino and Ucluelet
          - heading "Can you camp on the beach in Tofino?" [level=3] [ref=f684e597]
          - paragraph [ref=f684e598]: Only in official campgrounds or designated backcountry sites. Not on public beaches, parking lots, roadsides or pullouts.

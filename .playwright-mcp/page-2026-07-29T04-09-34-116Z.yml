    - generic [ref=f25e94]:
      - generic [ref=f25e95]:
        - text: Why go
        - heading "A town the tide sets the timetable for" [level=2] [ref=f25e96]
        - paragraph [ref=f25e97]: Tofino sits at the western edge of Vancouver Island, where the rainforest meets long stretches of open Pacific beach. It draws surfers, storm-watchers, and travellers looking for quiet time close to the water.
        - paragraph [ref=f25e98]: Plan around the tides and the seasons. Summer brings calm mornings and warm evenings on the sand, while winter delivers dramatic storm watching and empty beaches. Whatever the season, the pace here rewards staying a few nights rather than passing through.
        - link "Read the month by month guide" [ref=f25e99] [cursor=pointer]:
          - /url: guide.html
      - generic [ref=f25e100]:
        - generic [ref=f25e101]:
          - term [ref=f25e102]: Where it is
          - definition [ref=f25e103]: The western edge of Vancouver Island, where the rainforest meets open Pacific beach.
        - generic [ref=f25e104]:
          - term [ref=f25e105]: Getting there
          - definition [ref=f25e106]: Four hours from Nanaimo by road, and the last stretch is slow. Book the ferry first.

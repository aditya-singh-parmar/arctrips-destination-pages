    - generic [ref=f1e39]:
      - img "Banff, Alberta" [ref=f1e40]
      - generic [ref=f1e43]:
        - text: Alberta
        - heading "Banff" [level=1] [ref=f1e44]
        - paragraph [ref=f1e45]: Lake Louise, often referred to as the Jewel of the Rockies, is known worldwide for its calm turquoise waters framed by mountains and the Fairmont Chateau hotel. The lake’s most famous feature is its vivid blue-green color. This isn't a trick of the light; it’s the result of rock flour, fine particles of glacial silt that remain suspended in the water.

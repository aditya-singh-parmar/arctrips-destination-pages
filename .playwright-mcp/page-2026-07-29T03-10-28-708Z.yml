        - heading "World-Known Landmarks" [level=2] [ref=f721e64]
        - paragraph [ref=f721e65]: 10 places, written up one at a time
      - generic [ref=f721e66]:
        - article [ref=f721e67]:
          - figure [ref=f721e68]:
            - img "1. Signal Hill, St. John" [ref=f721e69]
          - generic [ref=f721e70]:
            - heading "1. Signal Hill" [level=3] [ref=f721e71]
            - paragraph [ref=f721e72]: Signal Hill National Historic Site is the crown jewel of St. John’s and a site of global significance. Standing high above the Atlantic, this rugged cliffside is where the first transatlantic wireless signal was received in 1901, forever changing how the world communicates. The site remains the most visited landmark in Newfoundland and Labrador, offering a mix of military history, scientific triumph, and breathtaking coastal hiking trails.
            - paragraph [ref=f721e73]: "Cabot Tower: This iconic Gothic Revival sandstone tower was built in 1897 to commemorate the 400th anniversary of John Cabot's voyage. Inside, you can explore exhibits on the history of the Narrows and climb to the top for a panoramic view of the city and the endless North Atlantic."
            - paragraph [ref=f721e74]: "The North Head Trail: This 1.7 km signature hiking trail is a must-do. It winds from the summit down to the cliff’s edge, hugging the coastline and leading you through The Battery, a historic neighborhood of colorful houses perched precariously on the rocks."
        - article [ref=f721e75]:
          - heading "Tips and Key Information" [level=3] [ref=f721e76]
          - generic [ref=f721e77]:
            - paragraph [ref=f721e78]: Even on a warm summer day in downtown St. John’s, the summit of Signal Hill can be foggy, damp, and extremely windy. A windbreaker and layers are essential for any visit to the top.
            - paragraph [ref=f721e79]: As one of the most easterly points in North America, Signal Hill is one of the first places on the continent to see the sun. Arriving at dawn provides a spiritual experience and incredible lighting for photographers.
            - paragraph [ref=f721e80]: There are two main parking lots. The summit lot by Cabot Tower is small and fills up quickly. If it's full, park at the larger Visitor Centre lot halfway up and take the Centre to Summit Trail, a scenic 10-minute walk.
        - article [ref=f721e81]:
          - figure [ref=f721e82]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_z7pmffh6znc4\" w:id=\"4\"/><w:bookmarkEnd w:id=\"4\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">2. Cape Spear Lighthouse National Historic Site, St. John" [ref=f721e83]
          - generic [ref=f721e84]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_z7pmffh6znc4\" w:id=\"4\"/><w:bookmarkEnd w:id=\"4\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">2. Cape Spear Lighthouse National Historic Site" [level=3] [ref=f721e85]
            - paragraph [ref=f721e86]: Cape Spear Lighthouse National Historic Site is the rugged, windswept edge of the continent and the most easterly point in North America. Standing on the jagged cliffs of the Avalon Peninsula, this site is defined by its dramatic coastal scenery and its status as the first place on the continent to see the sun rise. As of 2026, it remains a premier destination for travelers seeking the raw beauty of the North Atlantic and a deep dive into Newfoundland’s maritime soul.
            - paragraph [ref=f721e87]: "The Old Lighthouse: Step inside the oldest surviving lighthouse in Newfoundland and Labrador, built in 1836. This meticulously restored white-and-red-trimmed building is a rare example of a functional design where the keeper’s residence was built directly around the light tower to keep the family safe from the elements."
            - paragraph [ref=f721e88]: "The Most Easterly Point: Follow the boardwalk to the very edge of the continent. Standing here, you are closer to Ireland than you are to Calgary. It is a bucket-list photo opportunity, marked by a geographic plaque and a stunning view of the endless blue horizon."
        - article [ref=f721e89]:
          - figure [ref=f721e90]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_xvkilmrsf3y5\" w:id=\"5\"/><w:bookmarkEnd w:id=\"5\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Quidi Vidi, St. John" [ref=f721e91]
          - generic [ref=f721e92]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_xvkilmrsf3y5\" w:id=\"5\"/><w:bookmarkEnd w:id=\"5\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Quidi Vidi" [level=3] [ref=f721e93]
            - paragraph [ref=f721e94]: Quidi Vidi Village (often called The Gut) is a village-within-a-city that feels like a trip back in time to a traditional Newfoundland outport. Tucked away in a narrow harbor just minutes from downtown St. John's, this historic fishing community is a vibrant hub where old-world charm meets modern craft culture. Quidi Vidi remains a top cultural destination, famous for its colorful fishing stages, world-class brewery, and the oldest organized sporting event in North America.
            - paragraph [ref=f721e95]: "The Historic Gut: Wander the narrow harborfront to see the iconic, brightly colored fishing stages (wooden sheds) perched on stilts over the water. These are not just for show; they are active spaces where local fishers have worked for centuries."
            - paragraph [ref=f721e96]: "Quidi Vidi Village Artisan Studios: Located in a large yellow building overlooking the harbor, this incubator for local talent allows you to watch artisans at work. You can purchase unique, handmade Newfoundland crafts ranging from pottery and textiles to fine jewelry and printmaking."
        - article [ref=f721e97]:
          - figure [ref=f721e98]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_71fdgwct5f9w\" w:id=\"6\"/><w:bookmarkEnd w:id=\"6\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">4. George Street, St. John" [ref=f721e99]
          - generic [ref=f721e100]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_71fdgwct5f9w\" w:id=\"6\"/><w:bookmarkEnd w:id=\"6\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">4. George Street" [level=3] [ref=f721e101]
            - paragraph [ref=f721e102]: George Street is the high-energy pulse of St. John’s and one of the most famous entertainment districts in the world. This two-block stretch of cobblestones is legendary for having the most bars and pubs per square foot in North America. It’s a vibrant pedestrian-only zone where traditional Irish-Newfoundland music, modern rock, and local folklore collide.
            - paragraph [ref=f721e103]: "The Screech-In Ceremony: You can’t leave George Street without becoming an honorary Newfoundlander. Head to a pub like Christian’s to recite a local decree, take a shot of Newfoundland Screech rum, and kiss a codfish. It’s a hilarious, essential rite of passage for every visitor."
            - paragraph [ref=f721e104]: "Live Music Crawl: From the soulful fiddles at O’Reilly’s Irish Newfoundland Pub to the high-energy bands at Bridie Molloy’s, live music spills out of nearly every doorway. You can easily bounce between traditional folk, rock, jazz, and country all in a single block."
        - article [ref=f721e105]:
          - figure [ref=f721e106]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_su9b51bcj0tl\" w:id=\"7\"/><w:bookmarkEnd w:id=\"7\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Jellybean Row Houses, St. John" [ref=f721e107]
          - generic [ref=f721e108]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_su9b51bcj0tl\" w:id=\"7\"/><w:bookmarkEnd w:id=\"7\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Jellybean Row Houses" [level=3] [ref=f721e109]
            - paragraph [ref=f721e110]: Jellybean Row Houses are one of the most iconic sights in St. John's, known for their vibrant and colorful facades. These steep, winding hills are lined with heritage Victorian-style row houses painted in an explosion of primary colors, reds, blues, yellows, and lavenders. This kaleidoscope of the North is one of the most photographed residential area in Canada, symbolizing the resilience and creativity of a city that refuses to be grey, even in the thickest North Atlantic fog.
            - paragraph [ref=f721e111]: "The Big Three Streets: For the most iconic views, start your walking tour at the intersection of Gower Street, Bond Street, and Duckworth Street. These rows offer the most continuous stretches of perfectly preserved, multi-colored facades and ornate wooden trim (locally called gingerbread)."
            - paragraph [ref=f721e112]: "Heritage Details: Look closely at the St. John’s Eccentricities, architectural quirks like the Newfoundland Outport Door, where a door appears on the second floor with no stairs leading to it (originally designed for high snowdrifts), and the intricate cornices and brackets that vary from house to house."
        - article [ref=f721e113]:
          - figure [ref=f721e114]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_kepcmqx9yy9r\" w:id=\"8\"/><w:bookmarkEnd w:id=\"8\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">6. Basilica Cathedral of St. John the Baptist, St. John" [ref=f721e115]
          - generic [ref=f721e116]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_kepcmqx9yy9r\" w:id=\"8\"/><w:bookmarkEnd w:id=\"8\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">6. Basilica Cathedral of St. John the Baptist" [level=3] [ref=f721e117]
            - paragraph [ref=f721e118]: The Basilica Cathedral of St. John the Baptist is the spiritual heart of St. John’s and a towering masterpiece of 19th-century architecture. Perched on a high ridge overlooking the city and the harbor, its twin 43-meter towers have served as a landmark for mariners for over 170 years. This cathedral, built in the 1800s, showcases a blend of Gothic Revival and French Romanesque styles, making it an architectural marvel.
            - paragraph [ref=f721e119]: "The Neoclassical Interior: Step inside to witness a soaring vaulted ceiling, intricate gold leaf detailing, and a massive pipe organ featuring 4,000 pipes. The limestone and granite used in its construction were shipped from Ireland and local quarries, symbolizing the deep connection between the two islands."
            - paragraph [ref=f721e120]: "The Veiled Virgin: Located in the Presentation Convent Square next door, this world-renowned marble sculpture by Giovanni Strazza is a must-see. Carved from a single block of Carrara marble, the veil appears breathtakingly transparent, a feat of artistic genius that draws visitors from around the globe."
        - article [ref=f721e121]:
          - figure [ref=f721e122]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_2o67yyc4o78b\" w:id=\"10\"/><w:bookmarkEnd w:id=\"10\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">7. Water Street, St. John" [ref=f721e123]
          - generic [ref=f721e124]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_2o67yyc4o78b\" w:id=\"10\"/><w:bookmarkEnd w:id=\"10\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">7. Water Street" [level=3] [ref=f721e125]
            - paragraph [ref=f721e126]: Water Street is the commercial and historic lifeline of St. John’s. Widely recognized as the oldest continuously operating commercial street in North America, it has evolved from a 16th-century lower path used by Basque and Portuguese fishers into a sophisticated hub of modern boutiques, high-end dining, and heritage architecture.
            - paragraph [ref=f721e127]: "The Downtown Pedestrian Mall: From June 25 to September 7, 2026, a significant portion of Water Street (from Adelaide to Prescott) closes to vehicles. This creates a festive, open-air atmosphere where restaurants move their seating onto the street and local musicians perform for the crowds."
            - paragraph [ref=f721e128]: "Markets on Water: Every Thursday during the summer season, the street hosts a major open-air market featuring over 20 local artisans and food vendors. It’s the perfect place to find upcycled Newfoundland crafts, sea-glass jewelry, and local preserves like partridgeberry jam."
        - article [ref=f721e129]:
          - figure [ref=f721e130]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_3a582cv7umcf\" w:id=\"12\"/><w:bookmarkEnd w:id=\"12\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">8. Cabot Tower, St. John" [ref=f721e131]
          - generic [ref=f721e132]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_3a582cv7umcf\" w:id=\"12\"/><w:bookmarkEnd w:id=\"12\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">8. Cabot Tower" [level=3] [ref=f721e133]
            - paragraph [ref=f721e134]: Cabot Tower is the crowning feature of Signal Hill and the most recognizable silhouette in the St. John’s skyline. Built of rugged red sandstone at the highest point of the hill, this Gothic Revival fortress commemorates the 400th anniversary of John Cabot’s voyage to Newfoundland and Queen Victoria’s Diamond Jubilee. It stands as a global monument to the dawn of the modern telecommunications era and remains the ultimate vantage point for surveying the city and the North Atlantic.
            - paragraph [ref=f721e135]: "The Summit View: Climb to the top of the tower for the most famous view in the province. From the observation deck, you can look straight down into the Narrows, the treacherous, narrow passage ships must navigate to enter the harbor, and see the vast expanse of Iceberg Alley."
            - paragraph [ref=f721e136]: "Marconi and Communications Exhibit: Explore the second-floor museum dedicated to the evolution of global communication. It details the moment on December 12, 1901, when Guglielmo Marconi used a kite-supported antenna near the tower to receive the first transatlantic wireless signal, proving that radio waves could travel across the ocean."
        - article [ref=f721e137]:
          - figure [ref=f721e138]:
            - img "9. Confederation building, St. John" [ref=f721e139]
          - generic [ref=f721e140]:
            - heading "9. Confederation building" [level=3] [ref=f721e141]
            - paragraph [ref=f721e142]: The Confederation Building is the seat of the Newfoundland and Labrador House of Assembly and the headquarters of the provincial government. Situated on Confederation Hill, this 11-story high-rise and its sprawling wings overlook the city, serving as a constant reminder of the province’s 1949 entry into the Canadian Confederation. .
            - paragraph [ref=f721e143]: "The House of Assembly Chamber: Take a free guided tour of the legislative chamber, which features a stunning vaulted ceiling and a stained-glass rendering of the provincial Coat of Arms. The room is ringed by portraits of former Speakers, reflecting the long parliamentary history that predates the building itself."
            - paragraph [ref=f721e144]: "The Harold Goodridge Mural: Located in the main lobby of the East Block, this massive allegorical mural depicts the history of Newfoundland and Labrador. It features figures like John Cabot, Sir Humphrey Gilbert, and a Beothuk person, along with hidden faces of former Prime Ministers and the province's first Premier, Joey Smallwood."
    - generic [ref=f721e146]:
      - generic [ref=f721e147]:
        - text: Art and History Lovers
        - heading "Art and History Lovers" [level=2] [ref=f721e148]
        - paragraph [ref=f721e149]: 7 places, written up one at a time
      - generic [ref=f721e150]:
        - article [ref=f721e151]:
          - figure [ref=f721e152]:
            - img "1. The Rooms, St. John" [ref=f721e153]
          - generic [ref=f721e154]:
            - heading "1. The Rooms" [level=3] [ref=f721e155]
            - paragraph [ref=f721e156]: The Rooms is Newfoundland and Labrador’s largest and most important cultural space, a striking modern facility that unites the Provincial Museum, Art Gallery, and Archives under one roof. Soaring above the St. John’s skyline, its unique architecture is a bold tribute to the fishing rooms, the traditional gable-roofed sheds where generations of families processed their catch along the shoreline. It’s a definitive place to understand the province's identity, from its 9,000-year Indigenous history to its contemporary artistic soul.
            - paragraph [ref=f721e157]: "The Museum Galleries: Explore three floors of history that range from the natural world, featuring giant squid and Newfoundland dog exhibits, to the harrowing and heroic story of the Royal Newfoundland Regiment in the Beaumont-Hamel and First World War galleries."
            - paragraph [ref=f721e158]: "The Art Gallery: With over 7,000 works in its permanent collection, the gallery showcases everything from the haunting landscapes of David Blackwood to bold, modern installations by contemporary Indigenous and local artists. Look for featured exhibits like Nasim Makaremi Nia: Entangled and Meagan Musseau: wtoqwan a'tukwaqnm."
        - article [ref=f721e159]:
          - figure [ref=f721e160]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_x27ijx2lvvdb\" w:id=\"16\"/><w:bookmarkEnd w:id=\"16\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">2. Johnson Geo Centre, St. John" [ref=f721e161]
          - generic [ref=f721e162]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_x27ijx2lvvdb\" w:id=\"16\"/><w:bookmarkEnd w:id=\"16\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">2. Johnson Geo Centre" [level=3] [ref=f721e163]
            - paragraph [ref=f721e164]: "ohnson Geo Centre is a world-class science museum with a literal twist: roughly 85% of the building is underground. Carved directly into the 550-million-year-old rock of Signal Hill, the center uses the Earth’s natural bedrock as its interior walls. It serves as the premier geological interpretation center in the province, offering an immersive journey from the cooling of the planet to the future of space exploration."
            - paragraph [ref=f721e165]: "The Great Rock Wall: The center’s most striking feature is its exposed 550-linear-foot interior wall of Precambrian rock. You can literally touch the ancient Gibbett Hill Formation sandstone and siltstone that forms the foundation of the city."
            - paragraph [ref=f721e166]: "The Titanic Story: Explore an extensive exhibit on the world’s most famous shipwreck, which sank just 350 kilometers off the coast. The display features artifacts, passenger stories, and a deep dive into the combination of human error and environmental forces that led to the tragedy."
        - article [ref=f721e167]:
          - figure [ref=f721e168]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_6mdi0658kq7c\" w:id=\"17\"/><w:bookmarkEnd w:id=\"17\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Anglican Cathedral of St. John the Baptist, St. John" [ref=f721e169]
          - generic [ref=f721e170]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_6mdi0658kq7c\" w:id=\"17\"/><w:bookmarkEnd w:id=\"17\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Anglican Cathedral of St. John the Baptist" [level=3] [ref=f721e171]
            - paragraph [ref=f721e172]: The Anglican Cathedral of St. John the Baptist is a masterpiece of Gothic Revival architecture and the mother church of the oldest Anglican parish in Canada (founded in 1699). Designed by the world-renowned British architect Sir George Gilbert Scott, the cathedral’s austere stone exterior and soaring interior are considered among the finest examples of ecclesiastical design in North America. It’s a pillar of the city’s historic Ecclesiastical District, having been meticulously restored after the devastating Great Fire of 1892.
            - paragraph [ref=f721e173]: "The Gothic Revival Architecture: Admire the Gothic style of the 13th century, featuring pointed arches, ribbed vaults, and massive sandstone piers. Though Scott’s original vision for a grand central spire was never completed, the building’s cruciform (cross-shaped) layout and 80-foot roofline remain a dominant feature of the downtown landscape."
            - paragraph [ref=f721e174]: "The Kempe Stained Glass: The cathedral is home to one of the largest collections of stained glass by the famous English designer C.E. Kempe. Look for his signature wheatsheaf mark hidden in the corners of the vibrant windows, which were installed during the post-fire restoration to replace those lost in 1892."
        - article [ref=f721e175]:
          - figure [ref=f721e176]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_tufhx793crh6\" w:id=\"18\"/><w:bookmarkEnd w:id=\"18\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">4. Railway Coastal Museum, St. John" [ref=f721e177]
          - generic [ref=f721e178]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_tufhx793crh6\" w:id=\"18\"/><w:bookmarkEnd w:id=\"18\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">4. Railway Coastal Museum" [level=3] [ref=f721e179]
            - paragraph [ref=f721e180]: The Railway Coastal Museum is a tribute to the Iron Horse and the Coastal Boats that once served as the only lifelines for Newfoundland’s isolated outport communities. Housed in the magnificent Riverhead Station (built in 1903), the museum occupies a National Historic Site that marked Mile Zero for the trans-island journey. The museum operates as a seasonal treasure, having been revitalized through a partnership with the Memorial University-affiliated Genesis Centre to ensure the province's transportation history remains accessible to the public.
            - paragraph [ref=f721e181]: "The 1940s Passenger Train Diorama: Step into a 90-foot, full-scale replica of the Overland Limited. You can walk through meticulously restored sections of a 1940s train, including the Dining Car, the Pullman Sleeper, and the Mail Car, complete with costumed figures that bring the era to life."
            - paragraph [ref=f721e182]: "Automated Model Railway: A highlight for families and hobbyists, this large-scale working model depicts the train’s journey across the entire island, from Port aux Basques to St. John’s. It features detailed landscapes, a busy railyard, and a functioning roundhouse."
        - article [ref=f721e183]:
          - figure [ref=f721e184]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_m5k8wodgfk26\" w:id=\"19\"/><w:bookmarkEnd w:id=\"19\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Colonial Building, St. John" [ref=f721e185]
          - generic [ref=f721e186]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_m5k8wodgfk26\" w:id=\"19\"/><w:bookmarkEnd w:id=\"19\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Colonial Building" [level=3] [ref=f721e187]
            - paragraph [ref=f721e188]: The Colonial Building is a neoclassical gem that served as the seat of Newfoundland’s government for over a century (1850, 1959). After a massive, decade-long restoration, it reopened to the public in late 2022 as a premier provincial historic site. Tthe building stands as a masterclass in heritage conservation, featuring meticulously restored interiors that tell the complex story of Newfoundland’s journey from a self-governing Dominion to a Canadian province.
            - paragraph [ref=f721e189]: "The Legislative Chambers: Step into the Red Council Chamber and the Green House of Assembly. Both have been restored to their 1880s glory, featuring 30-foot ceilings and original desks. You'll notice the ruling party sits on the left of the Speaker, a local quirk dating back to the 1800s because that side of the room was closer to the heaters."
            - paragraph [ref=f721e190]: "The Pindikowski Frescoes: Look up to see the breathtaking ceiling art painted in 1880 by Alexander Pindikowski. A Polish artist serving a prison sentence for forgery, he was released daily to paint these masterpieces; his work was so impressive that the government reduced his 15-month sentence by 30 days."
        - article [ref=f721e191]:
          - figure [ref=f721e192]:
            - img "6. Government House, St. John" [ref=f721e193]
          - generic [ref=f721e194]:
            - heading "6. Government House" [level=3] [ref=f721e195]
            - paragraph [ref=f721e196]: Government House is the official residence of the Lieutenant Governor of Newfoundland and Labrador and a grand symbol of the British Crown’s historical presence in the province. Built between 1827 and 1831, this Palladian-style mansion was designed to reflect the growing status of the colony as it transitioned from naval to civilian rule. As of 2026, it remains an active vice-regal residence where dignitaries are received and provincial ceremonies are held, surrounded by some of the most beautifully manicured grounds in the city.
            - paragraph [ref=f721e197]: "Guided Interior Tours: Explore the main floor of the residence on a free 45-minute guided tour. You’ll see the Ballroom, the Dining Room, and the Cochrane Room, all filled with original 19th-century furnishings, grand chandeliers, and portraits of former governors that trace the province's political evolution."
            - paragraph [ref=f721e198]: "The Palladian Architecture: Admire the symmetrical red sandstone exterior, which was quarried from nearby Signal Hill. The building’s austere, dignified design and English Portland stone trim were intended to project stability and authority in the early 19th-century capital."
        - article [ref=f721e199]:
          - figure [ref=f721e200]:
            - img "7. National War Memorial, St. John" [ref=f721e201]
          - generic [ref=f721e202]:
            - heading "7. National War Memorial" [level=3] [ref=f721e203]
            - paragraph [ref=f721e204]: The National War Memorial is the most significant monument in the province and one of only two National War Memorials in all of Canada. Located on a sloping site between Water Street and Duckworth Street, it marks the spot where Sir Humphrey Gilbert claimed Newfoundland for England in 1583. As of 2026, the site has been completely transformed following a massive $6-million restoration and the historic 2024 centennial, which saw the repatriation and entombment of an unknown First World War soldier.
            - paragraph [ref=f721e205]: "The Tomb of the Unknown Soldier: This is the heart of the newly refurbished site. Added in July 2024, the tomb is the final resting place of a Royal Newfoundland Regiment soldier who was killed at Beaumont-Hamel. Crafted from black Canadian granite and blue Labradorite, it features a bronze bouquet of forget-me-nots, the traditional Newfoundland symbol of remembrance."
            - paragraph [ref=f721e206]: "The Five Bronze Sculptures: Admire the intricate work of British artists Gilbert Bayes and Ferdinand Victor Blundstone. At the top stands the Spirit of Newfoundland, holding a torch for freedom and a sword for loyalty. Below her are realistic figures representing the four branches of service: a sailor (Naval Reserve), a soldier (Regiment), a fisherman (Mercantile Marine), and a lumberman (Forestry Corps)."
    - generic [ref=f721e208]:
      - generic [ref=f721e209]:
        - text: Outdoor Attractions
        - heading "Outdoor Attractions" [level=2] [ref=f721e210]
        - paragraph [ref=f721e211]: 8 places, written up one at a time
      - generic [ref=f721e212]:
        - article [ref=f721e213]:
          - figure [ref=f721e214]:
            - img "1. East Coast Trail, St. John" [ref=f721e215]
          - generic [ref=f721e216]:
            - heading "1. East Coast Trail" [level=3] [ref=f721e217]
            - paragraph [ref=f721e218]: The East Coast Trail (ECT) is a world-class hiking network that stretches over 336 kilometers along the rugged Avalon Peninsula. Linking more than 30 historic coastal communities, it offers everything from gentle lighthouse strolls to grueling multi-day wilderness treks.The ECT has solidified its reputation as one of the premier coastal hiking destinations in North America, famous for its edge of the world views, breaching whales, and ancient geological formations.
            - paragraph [ref=f721e219]: "The Spout: Hike the Spout Path to see a natural, wave-driven geyser that blasts seawater up to 30 meters into the air. This blowhole is a physical roar of the North Atlantic and a favorite for experienced hikers."
            - paragraph [ref=f721e220]: "Berry Head Sea Arch: Located on the Spurwink Island Path, this massive, cathedral-like stone arch is one of the most photographed natural wonders in the province. Standing atop it offers a dizzying and awe-inspiring view of the surf below."
        - article [ref=f721e221]:
          - figure [ref=f721e222]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_fupnoi9adab5\" w:id=\"24\"/><w:bookmarkEnd w:id=\"24\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">2. North Head Trail, St. John" [ref=f721e223]
          - generic [ref=f721e224]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_fupnoi9adab5\" w:id=\"24\"/><w:bookmarkEnd w:id=\"24\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">2. North Head Trail" [level=3] [ref=f721e225]
            - paragraph [ref=f721e226]: The North Head Trail is St. John’s most iconic and adrenaline-pumping hike, a 1.7 km cliffside path that connects the summit of Signal Hill to the historic Battery neighborhood. Originally used by fishers as far back as the 1500s, this trail offers a front-row seat to the Atlantic Ocean. It’sthe ultimate city-wilderness experience, famous for its rugged terrain, steep staircases, and the thrill of walking high above the swirling waters of the Narrows.
            - paragraph [ref=f721e227]: "The Chains Section: The trail’s most famous feature is a narrow, rocky ledge where a heavy metal chain is anchored into the cliffside. You’ll need to grip the chain to navigate a short, airy stretch with a sheer drop to the ocean below, an exhilarating highlight for any hiker."
            - paragraph [ref=f721e228]: "Ross’ Valley: Hike through this unique hanging valley, a geological remnant from the last ice age. This tucked-away meadow was once the site of Prowse's Folly, a 19th-century quarantine hospital, and still contains hidden relics like iron rings and wild apple trees."
        - article [ref=f721e229]:
          - figure [ref=f721e230]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_k72n89ck5ufy\" w:id=\"26\"/><w:bookmarkEnd w:id=\"26\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Bowring Park, St. John" [ref=f721e231]
          - generic [ref=f721e232]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_k72n89ck5ufy\" w:id=\"26\"/><w:bookmarkEnd w:id=\"26\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">3. Bowring Park" [level=3] [ref=f721e233]
            - paragraph [ref=f721e234]: Bowring Park is the emerald heart of St. John’s and one of the most scenic urban parks in Canada. Gifted to the city in 1914 by the wealthy Bowring merchant family to celebrate their 100th anniversary in business, the park was designed in the classic English landscaping tradition. It’s a sprawling 200-acre sanctuary of ancient trees, winding rivers, and world-class sculptures, offering a peaceful retreat from the rugged coastal cliffs of the Atlantic.
            - paragraph [ref=f721e235]: "The Fighting Newfoundlander Statue: Standing tall near the main entrance, this bronze tribute to the Royal Newfoundland Regiment of WWI is a powerful local landmark. It depicts a soldier in full marching order, poised to throw a grenade, and serves as a poignant site for local remembrance."
            - paragraph [ref=f721e236]: "The Peter Pan Statue: A beloved favorite for families, this is one of only a few authorized duplicates of the original statue in London’s Kensington Gardens. It was erected by Sir Edgar Bowring in memory of a beloved goddaughter who was lost at sea when the S.S. Florizel sank in 1918."
        - article [ref=f721e237]:
          - figure [ref=f721e238]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_z1u7u794ig9y\" w:id=\"27\"/><w:bookmarkEnd w:id=\"27\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">4. Quidi Vidi Lake Trail, St. John" [ref=f721e239]
          - generic [ref=f721e240]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_z1u7u794ig9y\" w:id=\"27\"/><w:bookmarkEnd w:id=\"27\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">4. Quidi Vidi Lake Trail" [level=3] [ref=f721e241]
            - paragraph [ref=f721e242]: The Quidi Vidi Lake Trail is the most popular flat walk in St. John’s, offering a scenic 3.8 km (2.4 mile) loop around the body of water known as the rower’s paradise. While the rest of the city is defined by grueling hills, this paved and gravel path provides an accessible, high-energy circuit for runners, walkers, and families. The area is buzzing with activity as it prepares for the historic 208th anniversary of the Royal St. John’s Regatta.
            - paragraph [ref=f721e243]: "The Royal St. John’s Regatta (August 5, 2026): If you are here on the first Wednesday of August, you are at the center of the oldest organized sporting event in North America. Known as The Largest Garden Party in the World, the lakefront transforms into a massive festival with food stalls, games of chance, and high-stakes rowing races that draw over 50,000 people."
            - paragraph [ref=f721e244]: "Birdwatching and Wildlife: The lake is a year-round sanctuary for waterfowl. It’s a prime spot to see the rare Lesser Black-backed Gull and various species of ducks. In the quieter morning hours, you might even spot an eagle or an osprey diving for fish from the surrounding White Hills."
            - paragraph [ref=f721e245]: Good to know. Note that work began in January 2026 on the replacement of the Quidi Vidi Slipway off Cadet Road. While the main walking trail remains open, expect some minor detours and parking impacts near the Quidi Vidi Village end of the lake as the city installs a new million-dollar wooden structure.
        - article [ref=f721e246]:
          - figure [ref=f721e247]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_5xb5st6fja4h\" w:id=\"28\"/><w:bookmarkEnd w:id=\"28\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Chance Cove Coastal Hiking Trail, St. John" [ref=f721e248]
          - generic [ref=f721e249]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_5xb5st6fja4h\" w:id=\"28\"/><w:bookmarkEnd w:id=\"28\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">5. Chance Cove Coastal Hiking Trail" [level=3] [ref=f721e250]
            - paragraph [ref=f721e251]: The Chance Cove Coastal Hiking Trail is one of Newfoundland’s most rapidly rising Instagram stars. Located about a 90-minute drive from St. John’s on the Isthmus of the Avalon, this trail offers a dramatic tropical-meets-North-Atlantic aesthetic that was once a local secret but is now a must-visit destination. It features emerald-green waters, hidden sea caves, and secluded pebble beaches.
            - paragraph [ref=f721e252]: "The Money Shot Viewpoint: After a short climb through a dense, mossy forest, the trail opens up to a spectacular ridge overlooking Big Chance Cove. On a sunny day, the refraction of the water against the white limestone rocks creates a vibrant turquoise hue that looks more like the Mediterranean than the North Atlantic."
            - paragraph [ref=f721e253]: "The Rope Descent to Big Cove: For the adventurous, there is a famous section where you must use a sturdy fixed rope to shimmy down a steep embankment to reach the beach. This secluded cove features a massive sea stack and deep caves that you can explore at low tide."
        - article [ref=f721e254]:
          - figure [ref=f721e255]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_qi81rsgfd79b\" w:id=\"29\"/><w:bookmarkEnd w:id=\"29\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">6. Bannerman Park, St. John" [ref=f721e256]
          - generic [ref=f721e257]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_qi81rsgfd79b\" w:id=\"29\"/><w:bookmarkEnd w:id=\"29\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">6. Bannerman Park" [level=3] [ref=f721e258]
            - paragraph [ref=f721e259]: Bannerman Park is the historic centerpiece of St. John’s and a masterpiece of 19th-century Victorian landscaping. Named after Sir Alexander Bannerman, a former Governor of Newfoundland, it was established in 1864 as the city's first public park. It’s a year-round community hub, seamlessly blending its colonial history with modern amenities that serve as the setting for some of the province's most beloved festivals.
            - paragraph [ref=f721e260]: "The Loop: This refrigerated outdoor skating trail is the park's crown jewel during the winter months. Opened in 2015, it allows skaters of all levels to glide through the park on a winding ice path, often accompanied by festive music and holiday lights."
            - paragraph [ref=f721e261]: "The Newfoundland & Labrador Folk Festival (July 2026): For over 50 years, Bannerman Park has hosted this legendary event. The park transforms into a sea of lawn chairs and blankets as world-class traditional musicians take to the main stage, while smaller workshop tents offer intimate sessions on fiddling, storytelling, and dance."
        - article [ref=f721e262]:
          - figure [ref=f721e263]:
            - img "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_g26kyqbccinr\" w:id=\"30\"/><w:bookmarkEnd w:id=\"30\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">7. Grand Concourse, St. John" [ref=f721e264]
          - generic [ref=f721e265]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr><w:color w:val=\"434343\"/><w:sz w:val=\"28\"/><w:szCs w:val=\"28\"/></w:rPr></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_g26kyqbccinr\" w:id=\"30\"/><w:bookmarkEnd w:id=\"30\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">7. Grand Concourse" [level=3] [ref=f721e266]
            - paragraph [ref=f721e267]: The Grand Concourse is one of Canada’s most ambitious pedestrian networks, an award-winning walker's paradise that spans over 200 kilometers across the Northeast Avalon region. Managed by the Grand Concourse Authority (GCA), it links every major park, river, pond, and green space in St. John’s, Mount Pearl, and Paradise. As of 2026, the network has expanded to integrate 10 municipalities, offering a seamless blend of urban convenience and rugged Atlantic beauty.
            - paragraph [ref=f721e268]: "The Three Rivers System: The Concourse is anchored by three main river-valley trails: the Rennie’s River Trail, the Virginia River Trail, and the Waterford River Trail. These paths offer lush, forested escapes right in the middle of the city, perfect for spotting local brown trout or the elusive American Dipper bird."
            - paragraph [ref=f721e269]: "The T'Railway (Newfoundland T'Railway): This section follows the bed of the former Newfoundland Railway. It is a major multi-use artery that allows for longer-distance trekking and cycling, connecting the downtown core to the suburban communities of Mount Pearl and Paradise."
        - article [ref=f721e270]:
          - figure [ref=f721e271]:
            - img "8. Waterford River Walk, St. John" [ref=f721e272]
          - generic [ref=f721e273]:
            - heading "8. Waterford River Walk" [level=3] [ref=f721e274]
            - paragraph [ref=f721e275]: The Waterford River Walk is the most extensive river-valley trail in the Grand Concourse network, a 6.2 km (3.9 mile) linear path that follows the historic Waterford River. It serves as a natural corridor connecting the industrial heritage of the downtown west end to the manicured gardens of Bowring Park and beyond into Mount Pearl. It’s a avorite for cyclists and walkers seeking a countryside feel without leaving the city limits.
            - paragraph [ref=f721e276]: "The Trans Canada Trail Mile 0: The walk begins at the Railway Coastal Museum (the former Riverhead Station), which is officially designated as the eastern \"Mile 0\" of the Trans Canada Trail. It is a bucket-list starting point for those trekking across the country."
            - paragraph [ref=f721e277]: "Heritage Architecture: As you move west from the downtown core, the trail passes behind some of the city's most beautiful 19th-century estate homes along Waterford Bridge Road. These grand houses once belonged to the city's merchant elite who wanted to escape the summer fog of the harbor."

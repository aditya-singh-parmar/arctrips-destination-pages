          - generic [ref=f721e287]:
            - heading "<w:left w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:bottom w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:right w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/><w:between w:space=\"0\" w:sz=\"0\" w:val=\"nil\"/></w:pBdr><w:shd w:fill=\"auto\" w:val=\"clear\"/><w:spacing w:after=\"80\" w:before=\"320\" w:line=\"276\" w:lineRule=\"auto\"/><w:ind w:left=\"0\" w:right=\"0\" w:firstLine=\"0\"/><w:jc w:val=\"left\"/><w:rPr/></w:pPr><w:bookmarkStart w:colFirst=\"0\" w:colLast=\"0\" w:name=\"_h6unhqj7p79z\" w:id=\"35\"/><w:bookmarkEnd w:id=\"35\"/><w:r w:rsidDel=\"00000000\" w:rsidR=\"00000000\" w:rsidRPr=\"00000000\"><w:rPr><w:rtl w:val=\"0\"/></w:rPr><w:t xml:space=\"preserve\">1. The Battery" [level=3] [ref=f721e288]
            - paragraph [ref=f721e289]: The Battery is perhaps the most photographed neighborhood in St. John’s, a cluster of brightly painted wooden houses that "cling valiantly to the steep, rocky cliffs at the entrance to the harbor. Often described as an outport within the city, this historic fishing village is famous for its narrow, winding lanes where houses are so close together that neighbors can practically shake hands from their windows. It’s a vibrant, lived-in community and the primary gateway for hikers tackling the world-renowned North Head Trail.
            - paragraph [ref=f721e290]: "The Jellybean Architecture: Wander through the Upper, Lower, and Outer Battery to see homes painted in vivid teals, reds, and yellows. Because of the extreme terrain, many houses are built on high stilts or shored up with massive timber cribs to stay level against the cliffside."
            - paragraph [ref=f721e291]: "Chain Rock: Walk down toward the water’s edge in the Outer Battery to see the massive iron ring bolted into the rock. This is where a heavy chain was once stretched across the Narrows to Fort Amherst on the opposite side to physically block enemy ships from entering the harbor during the 1700s and both World Wars."
        - article [ref=f721e292]:
          - figure [ref=f721e293]:
            - img "2. Iceberg Boat Cruise, St. John" [ref=f721e294]
          - generic [ref=f721e295]:
            - heading "2. Iceberg Boat Cruise" [level=3] [ref=f721e296]
            - paragraph [ref=f721e297]: An Iceberg Boat Cruise is the classic Newfoundland adventure, offering a front-row seat to Iceberg Alley. These 10,000-year-old glacial giants drift down from Greenland, passing the coast of St. John's and the Avalon Peninsula every spring. As of March 2026, the first icebergs of the season have already been spotted north of the Grand Banks, with the peak viewing window in St. John's expected between mid-May and late June.
            - paragraph [ref=f721e298]: What to Expect on the Water
            - paragraph [ref=f721e299]: "The Triple Threat: If you time your visit for late June, you may experience the rare Newfoundland Triple Threat, seeing an iceberg, a breaching humpback whale, and thousands of Atlantic puffins all in a single 90-minute trip."
        - article [ref=f721e300]:
          - figure [ref=f721e301]:
            - img "3. Whale and Seabird Boat Tour, St. John" [ref=f721e302]
          - generic [ref=f721e303]:
            - heading "3. Whale and Seabird Boat Tour" [level=3] [ref=f721e304]
            - paragraph [ref=f721e305]: Whale and Seabird Boat Tours are a bucket-list experience that combines the drama of the North Atlantic with world-class wildlife sightings. Most tours head to the Witless Bay Ecological Reserve, home to North America's largest Atlantic Puffin colony (over 260,000 pairs) and a major feeding ground for humpback whales. Operators are currently accepting bookings for the upcoming season, which officially kicks off in mid-May.
            - paragraph [ref=f721e306]: "The Atlantic Puffin (May, August): These clowns of the sea return to the islands of Witless Bay to nest in burrows. Peak viewing is in June and July, when the islands are literally swarming with hundreds of thousands of birds."
            - paragraph [ref=f721e307]: "Humpback Whales (June, August): Newfoundland hosts the world’s largest gathering of humpback whales. They follow the capelin (small silver fish) toward the shore. The capelin roll is expected in late June, which usually triggers a frenzy of whale activity including spectacular breaching and tail-slapping."
        - article [ref=f721e308]:
          - figure [ref=f721e309]:
            - img "4. Fort Amherst Lighthouse, St. John" [ref=f721e310]
          - generic [ref=f721e311]:
            - heading "4. Fort Amherst Lighthouse" [level=3] [ref=f721e312]
            - paragraph [ref=f721e313]: Fort Amherst Lighthouse stands as the silent sentinel on the southern jaw of the Narrows, directly across the water from the Battery. Named after Colonel William Amherst, who recaptured St. John’s from the French in 1762, this site has hosted a light station since 1810. The current structure, a square, tapered concrete tower built in 1954, continues to guide massive container ships, fishing boats, and cruise liners into the safety of the harbor.
            - paragraph [ref=f721e314]: "The Panoramic Gatekeeper View: This is arguably the most dramatic view of St. John’s. Looking back across the Narrows, you get a perfectly framed postcard shot of the colorful Battery houses, Cabot Tower, and the city skyline."
            - paragraph [ref=f721e315]: "The World War II Gun Emplacements: Walk among the massive concrete ruins of the coastal defense batteries built during the 1940s. You can explore the old magazines and observation posts that once housed 6-inch breech-loading guns designed to protect the port from U-boat attacks."
        - article [ref=f721e316]:
          - figure [ref=f721e317]:
            - img "5. Quidi Vidi Brewery, St. John" [ref=f721e318]
          - generic [ref=f721e319]:
            - heading "5. Quidi Vidi Brewery" [level=3] [ref=f721e320]
            - paragraph [ref=f721e321]: Quidi Vidi Brewery is Newfoundland and Labrador’s largest craft brewery, famously housed in a former fish plant in the heart of the historic Quidi Vidi Gut. Known for its blue bottle flagship and its stunning waterfront taproom, it has become a cultural landmark where industrial heritage meets modern hospitality. The brewery is a focal point of local life, currently serving as a major hub for the 2026 Montana's Brier curling festivities.
            - paragraph [ref=f721e322]: "The Iceberg Beer Experience: This is the brewery's claim to fame. The light, golden lager is brewed using 20,000-year-old iceberg water harvested from the North Atlantic. Because the water is so pure and devoid of minerals, it produces a crispness that is virtually impossible to replicate with tap water."
            - paragraph [ref=f721e323]: "The Taproom View: Often cited as one of the most beautiful taprooms in the world, the space features massive windows and an outdoor deck that look directly out onto the cliffs and the narrow harbor entrance. It’s the perfect spot to watch small fishing boats return with their catch while you sample a flight."
        - article [ref=f721e324]:
          - figure [ref=f721e325]:
            - img "6. Harbourside Park, St. John" [ref=f721e326]
          - generic [ref=f721e327]:
            - heading "6. Harbourside Park" [level=3] [ref=f721e328]
            - paragraph [ref=f721e329]: Harbourside Park is a small but powerful urban park that serves as the front porch of downtown St. John’s. Located directly across from the National War Memorial, it marks the exact spot where Sir Humphrey Gilbert stood in 1583 to claim Newfoundland for the British Crown. The park is a bustling transit point for cruise ship passengers and a beloved lunch-break sanctuary for locals, known for its iconic bronze statues and unobstructed harbor views.
            - paragraph [ref=f721e330]: "Our Dogs Statues: This is the park's most famous feature, two larger-than-life bronze sculptures by artist Luben Boykov. One depicts a powerful Newfoundland dog and the other a sleek Labrador Retriever. These statues celebrate the two world-famous breeds that originated in the province.The statues are designed so that their backs form comfortable benches, making them a favorite spot for children and tourists to sit for a photo."
            - paragraph [ref=f721e331]: "Sir Humphrey Gilbert Tablet: Find the stone monument commemorating the birth of the British Empire. In 1583, Gilbert performed a cut and turf ceremony here, making this site one of the most historically significant locations in North America."

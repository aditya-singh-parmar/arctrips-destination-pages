        - paragraph [ref=f708e69]: 12 places, written up one at a time
      - generic [ref=f708e70]:
        - article [ref=f708e71]:
          - figure [ref=f708e72]:
            - img "1. Kinsol Trestle, Shawnigan Lake" [ref=f708e73]
          - generic [ref=f708e74]:
            - heading "1. Kinsol Trestle" [level=3] [ref=f708e75]
            - paragraph [ref=f708e76]: The Kinsol Trestle is one of the most remarkable landmarks in the Shawnigan Lake area and a centerpiece of Vancouver Island’s rail-to-trail heritage. Standing 44 meters high and stretching 187 meters across the Koksilah River, it is one of the tallest free-standing timber rail trestle structures in the world.
            - paragraph [ref=f708e77]: "The Cowichan Valley Trail: The trestle is a highlight of this multi-use trail system. The approach from the main parking lot is a relatively flat, well-maintained 1.2-kilometer walk through a lush forest, making it accessible for families, cyclists, and dog walkers."
            - paragraph [ref=f708e78]: "Architectural Marvel: Originally completed in 1920 to transport old-growth timber, the structure was extensively restored and reopened in 2011. Visitors can now walk across the sturdy wooden decking and peer down through the intricate timber Howe trusses to the river below."
        - article [ref=f708e79]:
          - figure [ref=f708e80]:
            - img "2. Shawnigan Lake, Shawnigan Lake" [ref=f708e81]
          - generic [ref=f708e82]:
            - heading "2. Shawnigan Lake" [level=3] [ref=f708e83]
            - paragraph [ref=f708e84]: Shawnigan Lake is a prominent freshwater destination on southern Vancouver Island, stretching roughly 7 kilometers in length. Known as a centerpiece of the warm land, the lake's sheltered position often allows surface water temperatures to become comfortable for swimming by mid-summer, making it a primary recreation hub for both residents and visitors.
            - paragraph [ref=f708e85]: West Shawnigan Lake Provincial Park serves as the primary day-use area on the lake's western shore, offering a sanctuary of Douglas fir and arbutus forest. The park features a designated swimming area marked with floats, providing a secure spot for families to enjoy the water. Large grassy fields and established picnic tables make it a preferred location for full-day outings and large group gatherings.
            - paragraph [ref=f708e86]: Shawnigan Wharf Park is the vibrant heart of the lake's social scene, located just steps from the village center. This park includes a public wharf, a sandy beach, and an enclosed swimming area, alongside a beach volleyball court for active visitors.It serves as a major entry point for motorized watercraft, though the area remains highly organized to ensure the safety of swimmers and paddlers.
        - article [ref=f708e87]:
          - figure [ref=f708e88]:
            - img "3. Cowichan Valley Trail, Shawnigan Lake" [ref=f708e89]
          - generic [ref=f708e90]:
            - heading "3. Cowichan Valley Trail" [level=3] [ref=f708e91]
            - paragraph [ref=f708e92]: The Cowichan Valley Trail is a multi-use trail system that forms a major portion of the Trans Canada Trail on Vancouver Island. Stretching over 120 kilometers, it follows the gentle grade of decommissioned rail lines, connecting communities from the Malahat summit north to Shawnigan Lake, west to Lake Cowichan, and further north through Duncan and Chemainus.
            - paragraph [ref=f708e93]: Key Trail Segments and Experience
            - paragraph [ref=f708e94]: "The Historic Trestle Route: The most popular section runs between Shawnigan Lake and the Kinsol Trestle. This part of the trail is wide, flat, and surfaced with crushed gravel, making it ideal for casual cyclists and families."
        - article [ref=f708e95]:
          - figure [ref=f708e96]:
            - img "4. West Shawnigan Lake Park, Shawnigan Lake" [ref=f708e97]
          - generic [ref=f708e98]:
            - heading "4. West Shawnigan Lake Park" [level=3] [ref=f708e99]
            - paragraph [ref=f708e100]: West Shawnigan Lake Provincial Park is a primary day-use destination on the western shore of Shawnigan Lake, offering a quieter alternative to the busier beaches near the village. The park is characterized by its transition from old-growth Douglas fir forest to a series of rocky and sandy access points along the water.
            - paragraph [ref=f708e101]: "Shoreline Recreation: The park features a designated swimming area marked with floats, providing a secure environment for families. The beach is a mix of small pebbles and sand, suitable for launching paddleboards or kayaks to explore the lake's western bays."
            - paragraph [ref=f708e102]: "Forest Trails: A network of short, accessible trails winds through the forest of large Douglas firs and arbutus trees. These paths provide a cool, shaded retreat from the sun and are popular for brief nature walks."
        - article [ref=f708e103]:
          - figure [ref=f708e104]:
            - img "5. Old Baldy Mountain, Shawnigan Lake" [ref=f708e105]
          - generic [ref=f708e106]:
            - heading "5. Old Baldy Mountain" [level=3] [ref=f708e107]
            - paragraph [ref=f708e108]: Old Baldy Mountain is a popular hiking destination on the eastern side of Shawnigan Lake, known for providing some of the most accessible and rewarding panoramic views in the South Cowichan region. Managed as part of Old Baldy Mountain Park, the peak offers a sweeping perspective of the lake, the surrounding valley, and the distant Saanich Inlet.
            - paragraph [ref=f708e109]: "The Summit Hike: The primary trail is a relatively short but steep ascent that gains roughly 150 meters in elevation. Most hikers reach the summit in 20 to 30 minutes, where they are met with wide rock bluffs that serve as natural viewing platforms."
            - paragraph [ref=f708e110]: "The Famous Swing: For many years, a wooden swing hung from a large arbutus tree at the summit was a local icon and a favorite photography spot. While its presence can vary due to maintenance, the bluff remains a primary gathering point for sunset watchers."
        - article [ref=f708e111]:
          - figure [ref=f708e112]:
            - img "6. Shawnigan Wharf Park, Shawnigan Lake" [ref=f708e113]
          - generic [ref=f708e114]:
            - heading "6. Shawnigan Wharf Park" [level=3] [ref=f708e115]
            - paragraph [ref=f708e116]: Shawnigan Wharf Park is the primary social and recreational hub of the lake, located directly adjacent to the Shawnigan Lake village center. It is highly regarded for its accessibility and range of facilities that cater to both active water sports and relaxed lakeside lounging.
            - paragraph [ref=f708e117]: "The Swimming Wharf: A major draw for locals and visitors, the large wooden wharf features a designated swimming area. It is a popular spot for jumping into the lake during the warmer summer months."
            - paragraph [ref=f708e118]: "Sand Beach and Volleyball: The park offers a sandy beach area that is ideal for children to play, along with a full-sized beach volleyball court that frequently hosts casual community games."
        - article [ref=f708e119]:
          - figure [ref=f708e120]:
            - img "7. Shawnigan Village, Shawnigan Lake" [ref=f708e121]
          - generic [ref=f708e122]:
            - heading "7. Shawnigan Village" [level=3] [ref=f708e123]
            - paragraph [ref=f708e124]: Shawnigan Village is the charming heart of the community, serving as a hub for local culture, dining, and history just steps from the eastern shore of the lake. The village is characterized by its walkable layout and a mix of historic buildings and modern amenities that cater to the recreational lifestyle of the region.
            - paragraph [ref=f708e125]: "Local Culinary Scene: The village is home to several popular spots like Shawnigan House Coffee + Chocolate, known for its artisan sweets, and THREE B'S CAFE, a favored local destination for breakfast and lunch."
            - paragraph [ref=f708e126]: "Cultural Landmarks: The Shawnigan Lake Museum is centrally located, offering insights into the area's pioneer and logging history."
        - article [ref=f708e127]:
          - heading "8. Shawnigan Lake Museum" [level=3] [ref=f708e128]
          - generic [ref=f708e129]:
            - paragraph [ref=f708e130]: The Shawnigan Lake Museum is a community-driven institution that preserves the diverse history of the region, from its Indigenous roots to its development as a major logging and recreational hub. Recently undergoing significant expansions, the museum serves as a vibrant cultural center located in the heart of the village.
            - paragraph [ref=f708e131]: "EJ Hughes Gallery: A dedicated space showcases the life and work of the renowned Canadian artist EJ Hughes, who lived and painted in the Shawnigan Lake area for many years."
            - paragraph [ref=f708e132]: "Pioneer Life: Exhibits detailed the lives of early settlers, featuring artifacts from the old logging camps, a restored historic schoolroom, and personal items from the families who first established the community."
        - article [ref=f708e133]:
          - heading "9. Mason’s Beach Park" [level=3] [ref=f708e134]
          - generic [ref=f708e135]:
            - paragraph [ref=f708e136]: Masons Beach Park is a small, family-oriented lakeside park located on the north end of Shawnigan Lake. It serves as a quieter community spot for those who want to avoid the larger crowds at the central village docks or the main provincial park.
            - paragraph [ref=f708e137]: "Quiet Swimming: The park features a small, sandy-to-pebbly beach area that provides easy entry into the water. It is a favored spot for local families with younger children due to the typically calm water conditions in this corner of the lake."
            - paragraph [ref=f708e138]: "Paddling Launch: Because it is less congested, it is an excellent place to launch a paddleboard or kayak to explore the northern shoreline or head toward the deeper center of the lake."
        - article [ref=f708e139]:
          - heading "10. Old Mill Park" [level=3] [ref=f708e140]
          - generic [ref=f708e141]:
            - paragraph [ref=f708e142]: Old Mill Park is a tranquil community park located on the eastern shore of Shawnigan Lake. Built on the former site of a historic sawmill, the park features a beautifully landscaped setting that blends industrial history with scenic waterfront access, offering a more serene atmosphere than the busier central beaches.
            - paragraph [ref=f708e143]: "Historic Sawmill Legacy: Interpretive signage throughout the park provides insights into the site's history as an active sawmill, explaining how the timber industry shaped the early community of Shawnigan Lake."
            - paragraph [ref=f708e144]: "Swimming and Sunbathing: A small, pebbly beach area provides a quiet spot for a dip in the lake. The water here is generally calm, making it a favorite for those looking for a peaceful swim."
        - article [ref=f708e145]:
          - figure [ref=f708e146]:
            - 'img "11. Nearby Worthwhile Stop: Malahat SkyWalk, Shawnigan Lake" [ref=f708e147]'
          - generic [ref=f708e148]:
            - 'heading "11. Nearby Worthwhile Stop: Malahat SkyWalk" [level=3] [ref=f708e149]'
            - paragraph [ref=f708e150]: The Malahat SkyWalk is a premier attraction located approximately 20 kilometers south of Shawnigan Lake, roughly a 23-minute drive via Shawnigan Lake Road and the Trans-Canada Highway. This accessible adventure destination offers a high-elevation perspective of the Finlayson Arm and the broader Salish Sea.
            - paragraph [ref=f708e151]: The experience centers on a 600-meter elevated wooden boardwalk that leads through a forest of Arbutus and Douglas fir trees, culminating in a striking ten-story spiral tower.
            - paragraph [ref=f708e152]: "The Spiral Tower: Visitors ascend a gentle 32-meter ramp to reach a sightseeing platform 250 meters above sea level, providing 360-degree views of the Olympic Mountains and Mt. Baker."
        - article [ref=f708e153]:
          - figure [ref=f708e154]:
            - img "12. Short scenic day trips around the South Cowichan area, Shawnigan Lake" [ref=f708e155]
          - generic [ref=f708e156]:
            - heading "12. Short scenic day trips around the South Cowichan area" [level=3] [ref=f708e157]
            - paragraph [ref=f708e158]: The South Cowichan region offers a variety of scenic day trips that blend coastal charm, agricultural heritage, and temperate rainforest landscapes, all within a short drive from Shawnigan Lake.
            - paragraph [ref=f708e159]: Coastal and Marine Adventures
            - paragraph [ref=f708e160]: Cowichan Bay is a historic waterfront village located about 15 minutes north, famous for its colorful buildings on stilts and active fishing harbor. Stroll the 1-kilometer oceanfront strip lined with artisan shops, local seafood restaurants, and a traditional maritime museum. The bay is a prime spot for renting kayaks or booking whale-watching tours to see orcas, eagles, and river otters in their natural habitat.
